<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산책 기록</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="왈슨">
<meta name="theme-color" content="#f7ede2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    /* index.html과 동일한 색 토큰 — 두 화면이 같은 브랜드로 보이게 유지 */
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-tint: #f3ddd2;
    --ok: #5f8f5a; --shadow-rgb: 74, 63, 53;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  body { padding: 16px 16px 32px; }
  .wrap { max-width: 480px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .topbar a {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 12px; text-decoration: none;
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--ink);
    box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.1);
  }
  /* Black Han Sans는 굵기가 하나뿐이라 항상 아주 두꺼운데, 제목처럼 획이 많은 한글
     조합에서는 오히려 안 읽힌다는 피드백을 받음(카드 시안 B에서 같은 이유로 이미 한 번
     뺐던 적 있음, PROJECT_CONTEXT.md "시안 B: 스킬 제목 폰트/색상 커스터마이징" 참고) —
     두께 대신 크기로 존재감을 냄. */
  .topbar h1 {
    font-family: 'Pretendard', -apple-system, sans-serif;
    font-weight: 800; font-size: 22px; margin: 0; letter-spacing: -0.01em;
  }
  .subtitle { margin: 6px 0 18px; font-size: 13px; color: var(--ink-soft); }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .summary .tile {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 12px 8px; text-align: center; box-shadow: 0 3px 10px rgba(var(--shadow-rgb), 0.08);
  }
  .summary .tile .num {
    font-family: 'Black Han Sans', 'Pretendard', sans-serif; font-size: 19px; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .summary .tile .label { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .walk-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
    padding: 12px 14px; box-shadow: 0 3px 12px rgba(var(--shadow-rgb), 0.08);
  }
  .thumb {
    flex-shrink: 0; width: 56px; height: 56px; border-radius: 14px;
    background: var(--accent-tint); display: flex; align-items: center; justify-content: center;
  }
  .thumb svg { width: 40px; height: 40px; }
  .thumb.has-photo { overflow: hidden; }
  .thumb.has-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .no-route { font-size: 10px; color: var(--ink-soft); text-align: center; line-height: 1.3; }

  .info { flex: 1; min-width: 0; }
  .info .top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .info .date { font-weight: 800; font-size: 14px; }
  .info .streak { font-size: 10px; font-weight: 700; color: var(--ok); white-space: nowrap; }
  .info .stats {
    display: flex; gap: 10px; margin-top: 4px; font-size: 12px; color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .info .stats b { color: var(--ink); font-weight: 700; }
  /* 5분·200m 미만 산책 — index.html WALK_RULES 참고 */
  .info .stats .no-reward { color: var(--ink-soft); background: var(--accent-tint); border-radius: 6px; padding: 0 6px; font-size: 11px; }

  /* 응가 달력(2026-11-15, hq "응가 일기 ①안"): 끝 화면에서 고른 응가 답을 날짜별로. 서버·AI 없음 */
  .poop-cal { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; padding: 14px; margin-bottom: 20px; box-shadow: 0 3px 12px rgba(var(--shadow-rgb), 0.08); }
  .poop-cal .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .poop-cal .head h2 { font-size: 15px; font-weight: 800; margin: 0; }
  .poop-cal .head button { font-family: inherit; font-size: 14px; font-weight: 800; width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--panel-border); background: #fff; color: var(--ink); cursor: pointer; }
  .poop-cal .head button:disabled { opacity: 0.35; cursor: default; }
  .poop-cal .month { font-size: 14px; font-weight: 800; }
  .poop-cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .poop-cal .dow { font-size: 11px; font-weight: 700; color: var(--ink-soft); padding-bottom: 2px; }
  .poop-cal .day { aspect-ratio: 1 / 1.1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .poop-cal .day.is-today { box-shadow: inset 0 0 0 2px var(--accent); }
  .poop-cal .day.walked { background: var(--accent-tint); color: var(--ink); font-weight: 700; }
  .poop-cal .dots { display: flex; gap: 2px; height: 9px; align-items: center; }
  .poop-cal .dots i { width: 9px; height: 9px; border-radius: 50% 50% 45% 45%; background: #8a5a2b; display: block; }
  .poop-cal .dots i.none { background: none; border: 1.5px solid #8a5a2b; width: 8px; height: 8px; }
  .poop-cal .dots i.unknown { background: none; border: 1.5px dashed var(--ink-soft); width: 8px; height: 8px; opacity: 0.6; }
  .poop-cal .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 11px; color: var(--ink-soft); }
  .poop-cal .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .poop-cal .sum { font-size: 13px; font-weight: 700; margin: 8px 0 0; }

  .empty {
    text-align: center; padding: 60px 20px; color: var(--ink-soft);
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
  }
  .empty .icon { font-size: 34px; margin-bottom: 10px; }
  .empty p { margin: 0; font-size: 13px; line-height: 1.6; }
  .walk-card .proof-btn {
    flex-shrink: 0; align-self: center; font-family: inherit; font-size: 12px; font-weight: 800; padding: 7px 10px;
    border-radius: 999px; border: 1px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer;
  }
  [data-theme="brutal"] .walk-card .proof-btn { border-radius: 0; border: 2px solid #000; background: var(--b-pink, #FF6BB5); color: #000; }
</style>
<script src="theme.js?v=6"></script>
<script src="site-config.js?v=3"></script>
<script src="track.js?v=3"></script>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="index.html" title="오늘로 돌아가기">←</a>
    <h1>산책 기록</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="summary">
    <div class="tile"><div class="num" id="s-count">0</div><div class="label">이번 달 산책</div></div>
    <div class="tile"><div class="num" id="s-distance">0</div><div class="label">누적 km</div></div>
    <div class="tile"><div class="num" id="s-streak">0</div><div class="label">연속 일수</div></div>
  </div>

  <section class="poop-cal" id="poop-cal" aria-label="응가 달력">
    <div class="head">
      <button type="button" id="cal-prev" aria-label="이전 달">‹</button>
      <div><h2>응가 달력</h2><div class="month" id="cal-month"></div></div>
      <button type="button" id="cal-next" aria-label="다음 달">›</button>
    </div>
    <div class="grid" id="cal-grid"></div>
    <div class="legend">
      <span><span class="dots"><i></i></span>1번</span>
      <span><span class="dots"><i></i><i></i></span>2번 이상</span>
      <span><span class="dots"><i class="none"></i></span>안 했어요</span>
      <span><span class="dots"><i class="unknown"></i></span>산책했지만 안 적음</span>
    </div>
    <p class="sum" id="cal-sum"></p>
  </section>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>
    <div class="icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="8" cy="9" rx="3" ry="5"/><ellipse cx="16" cy="13" rx="3" ry="5"/></svg></div>
    <p>아직 산책 기록이 없어요.<br>지도 화면에서 "산책 시작"을 눌러 첫 기록을 남겨보세요.</p>
  </div>
</div>

<script src="walk-photos.js?v=1"></script>
<script src="walk-proof.js?v=1"></script>
<script>
(function () {
  var WALKS_KEY = 'petwalk_walks'; // index.html과 같은 키 — 같은 오리진이라 localStorage 공유됨

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  function loadWalks() {
    try { return JSON.parse(localStorage.getItem(WALKS_KEY)) || []; } catch (e) { return []; }
  }

  function computeStreakDays(walks) {
    var days = {};
    walks.forEach(function (w) { days[w.date] = true; });
    var streak = 0;
    var d = new Date();
    while (days[dateKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }

  function walksThisMonthCount(walks) {
    var ym = dateKey(new Date()).slice(0, 7);
    return walks.filter(function (w) { return w.date.slice(0, 7) === ym; }).length;
  }

  // 저장된 좌표([lat,lng]...)를 정사각형 썸네일 안에 들어오게 정규화해서 SVG polyline
  // points 문자열로 바꾼다 — 위도가 커질수록 화면에서는 위로 가야 해서(y축 반전).
  function routeThumbnailPoints(route, size) {
    if (!route || route.length < 2) return null;
    var lats = route.map(function (p) { return p[0]; });
    var lngs = route.map(function (p) { return p[1]; });
    var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    var minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
    var latRange = (maxLat - minLat) || 0.00001;
    var lngRange = (maxLng - minLng) || 0.00001;
    var pad = size * 0.16;
    var innerSize = size - pad * 2;
    var scale = Math.min(innerSize / lngRange, innerSize / latRange);
    var drawnW = lngRange * scale, drawnH = latRange * scale;
    var offsetX = pad + (innerSize - drawnW) / 2;
    var offsetY = pad + (innerSize - drawnH) / 2;
    return route.map(function (p) {
      var x = offsetX + (p[1] - minLng) * scale;
      var y = offsetY + (maxLat - p[0]) * scale;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
  }

  function pace(distanceKm, durationMin) {
    if (!distanceKm) return '-';
    var minPerKm = durationMin / distanceKm;
    var m = Math.floor(minPerKm);
    var s = Math.round((minPerKm - m) * 60);
    if (s === 60) { m += 1; s = 0; }
    return m + "'" + (s < 10 ? '0' : '') + s + '"/km';
  }

  function formatDate(dateStr) {
    var today = dateKey(new Date());
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (dateStr === today) return '오늘';
    if (dateStr === dateKey(yesterday)) return '어제';
    var parts = dateStr.split('-');
    return parseInt(parts[1], 10) + '월 ' + parseInt(parts[2], 10) + '일';
  }

  // 스트릭 뱃지 — index.html의 스트릭 표시와 같은 톤(압박/페널티 없는 순수 정보성,
  // PROJECT_CONTEXT.md "최종 결정: 보상 개념 자체를 폐기" 참고): 그날까지 이어진 연속
  // 일수를 보여줄 뿐, 몇 등/달성 같은 판정은 하지 않는다.
  function streakAtDate(walks, dateStr) {
    var days = {};
    walks.forEach(function (w) { days[w.date] = true; });
    var streak = 0;
    var d = new Date(dateStr + 'T00:00:00');
    while (days[dateKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }

  var walks = loadWalks();
  var profileForProof = {};
  try { profileForProof = JSON.parse(localStorage.getItem('petwalk_profile')) || {}; } catch (e) { profileForProof = {}; }
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var subtitleEl = document.getElementById('subtitle');

  if (!walks.length) {
    emptyEl.hidden = false;
    subtitleEl.textContent = '아직 기록 없음';
  } else {
    var totalKm = walks.reduce(function (sum, w) { return sum + w.distanceKm; }, 0);
    var streak = computeStreakDays(walks);
    document.getElementById('s-count').textContent = walksThisMonthCount(walks);
    document.getElementById('s-distance').textContent = totalKm.toFixed(1);
    document.getElementById('s-streak').textContent = streak;
    subtitleEl.textContent = '이번 달 ' + walksThisMonthCount(walks) + '번 산책 · 총 ' +
      totalKm.toFixed(1) + 'km' + (streak > 0 ? ' · 연속 ' + streak + '일째' : '');

    walks.slice().reverse().forEach(function (w) { // 최신 산책이 위로 오게
      var points = routeThumbnailPoints(w.route, 40);
      var thumbInner = points
        ? '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" style="color:var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="' + points + '"/></svg>'
        : '<span class="no-route">' + (w.mode === 'time' ? '시간만' : '기록<br>없음') + '</span>';
      // 끝 화면(walk-end.html)에서 답한 것
      var feelText = w.feel === 'enough' ? '충분했어요' : w.feel === 'short' ? '조금 아쉬워요' : '';
      var extra = (feelText ? '<span>' + feelText + '</span>' : '') + (w.sniff ? '<span>킁킁 ' + w.sniff + '</span>' : '');
      var dayStreak = streakAtDate(walks, w.date);

      var card = document.createElement('div');
      card.className = 'walk-card';
      card.innerHTML =
        '<div class="thumb">' + thumbInner + '</div>' +
        '<div class="info">' +
          '<div class="top-row"><span class="date">' + formatDate(w.date) + '</span>' +
          (dayStreak > 1 ? '<span class="streak">연속 ' + dayStreak + '일째</span>' : '') + '</div>' +
          (w.mode === 'time'
            // 시간만 잰 산책 — 거리·길이 없어서 시간만 보여 준다
            ? '<div class="stats"><span><b>' + w.durationMin + '분</b></span>' + extra + '</div>'
            : '<div class="stats"><span><b>' + w.distanceKm.toFixed(1) + 'km</b></span>' +
              '<span>' + w.durationMin + '분</span>' +
              '<span>' + pace(w.distanceKm, w.durationMin) + '</span>' + extra +
              (w.rewardEligible === false ? '<span class="no-reward">보상 제외</span>' : '') + '</div>') +
        '</div>';
      listEl.appendChild(card);
      // 끝 화면에서 남긴 "오늘의 한 장"이 있으면 썸네일을 사진으로 바꾼다(휴대폰 안 저장소에서 읽음)
      if (w.photoKey && window.WalkPhotos) {
        var thumb = card.querySelector('.thumb');
        var img = document.createElement('img');
        img.alt = '산책 사진';
        WalkPhotos.show(w.photoKey, img).then(function (ok) {
          if (!ok) return;
          thumb.innerHTML = '';
          thumb.classList.add('has-photo');
          thumb.appendChild(img);
          // 사진이 있는 기록은 인증샷을 다시 만들 수 있게(walk-proof.js)
          if (window.WalkProof) {
            var pb = document.createElement('button');
            pb.type = 'button'; pb.className = 'proof-btn'; pb.textContent = '인증샷';
            pb.addEventListener('click', function () { WalkProof.open({ src: img.src, walk: w, profile: profileForProof }); });
            card.appendChild(pb);
          }
        });
      }
    });
  }
})();

// ── 응가 달력 ──
// 끝 화면(walk-end.html)이 산책 기록에 붙인 poop(0 안 함 · 1 한 번 · 2 두 번 이상)을 날짜별로 모은다.
// 하루에 여러 번 산책했으면 그날 가장 많이 한 답을 보인다. 이 휴대폰 기록만 쓰고 어디로도 보내지 않는다.
(function () {
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function key(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
  var walks = [];
  try { walks = JSON.parse(localStorage.getItem('petwalk_walks')) || []; } catch (e) { walks = []; }
  var byDay = {};   // 'YYYY-MM-DD' → { walked: true, poop: 최대값 또는 undefined }
  walks.forEach(function (w) {
    if (!w || !w.date) return;
    var d = byDay[w.date] || (byDay[w.date] = { walked: true });
    if (typeof w.poop === 'number' && (d.poop === undefined || w.poop > d.poop)) d.poop = w.poop;
  });

  var today = new Date();
  var view = new Date(today.getFullYear(), today.getMonth(), 1);
  var first = walks.reduce(function (min, w) { return w && w.date && w.date < min ? w.date : min; }, key(today.getFullYear(), today.getMonth(), 1));
  var firstMonth = new Date(Number(first.slice(0, 4)), Number(first.slice(5, 7)) - 1, 1);

  function render() {
    var y = view.getFullYear(), m = view.getMonth();
    document.getElementById('cal-month').textContent = y + '년 ' + (m + 1) + '월';
    var grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    DOW.forEach(function (d) { var e = document.createElement('div'); e.className = 'dow'; e.textContent = d; grid.appendChild(e); });
    var lead = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    for (var i = 0; i < lead; i++) grid.appendChild(document.createElement('div'));
    var poopDays = 0, walkedDays = 0, answered = 0;
    for (var d = 1; d <= days; d++) {
      var k = key(y, m, d), rec = byDay[k];
      var cell = document.createElement('div');
      cell.className = 'day';
      if (y === today.getFullYear() && m === today.getMonth() && d === today.getDate()) cell.classList.add('is-today');
      var num = document.createElement('span'); num.textContent = d; cell.appendChild(num);
      var dots = document.createElement('span'); dots.className = 'dots';
      var label = d + '일';
      if (rec) {
        cell.classList.add('walked'); walkedDays++;
        if (rec.poop === undefined) { dots.innerHTML = '<i class="unknown"></i>'; label += ', 산책함, 응가 안 적음'; }
        else {
          answered++;
          if (rec.poop === 0) { dots.innerHTML = '<i class="none"></i>'; label += ', 응가 안 함'; }
          else { poopDays++; dots.innerHTML = rec.poop >= 2 ? '<i></i><i></i>' : '<i></i>'; label += rec.poop >= 2 ? ', 응가 2번 이상' : ', 응가 1번'; }
        }
      }
      cell.setAttribute('aria-label', label);
      cell.appendChild(dots);
      grid.appendChild(cell);
    }
    document.getElementById('cal-sum').textContent = walkedDays
      ? '산책한 날 ' + walkedDays + '일 · 응가한 날 ' + poopDays + '일' + (walkedDays > answered ? ' · 안 적은 날 ' + (walkedDays - answered) + '일' : '')
      : '이 달에는 산책 기록이 없어요.';
    document.getElementById('cal-prev').disabled = view <= firstMonth;
    document.getElementById('cal-next').disabled = y === today.getFullYear() && m === today.getMonth();
  }
  document.getElementById('cal-prev').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); });
  document.getElementById('cal-next').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); });
  render();
})();
</script>
