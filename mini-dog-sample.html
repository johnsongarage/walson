<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도트 강아지 시안</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 도트 강아지 캐릭터 시안(2026-11-22 가르시아 "미니미 느낌으로 강아지 도트 캐릭터 샘플 만들어줘").
     같은 날 밤 "이 페이지 강아지들 다 지우고 이 강아지들로, 작은 건 확대해서 크기 맞춰줘" → 받은 도트 그림 5장으로 바꿈, 이어서 닥스훈트·진돗개·시바 추가("추가해서 배포", "이것도 추가하고").
     그림은 icons/dot-dogs/*.webp — 원래 흰 바탕·크기 제각각이라 테두리 바깥 흰 바탕만 지우고 키를 똑같이(768px) 맞춘 것(_dev/dot-dog-cutout.py).
     코드로 그리던 32칸 강아지(dog-pixel.js)는 이 화면에서만 뺐다(아지트 시안 등은 그대로 씀).
     이 화면은 아무것도 저장하지 않고 어디로도 보내지 않는다. */
  @font-face { font-family: 'DungGeunMo'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff'); }
  body { margin: 0; font-family: Pretendard, sans-serif; background: var(--bg, #fffdfd); color: var(--ink, #121215); }
  main { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  h2 { font-size: 16px; margin: 26px 0 10px; }
  .lead { color: var(--ink-soft, #6b6b70); font-size: 14px; margin: 0 0 8px; line-height: 1.5; }
  canvas { image-rendering: pixelated; display: block; }

  /* 견본 — 칸 너비가 모두 같으니 그림 키도 모두 같다(가장 넓은 푸들도 칸 안에 들어가게 92%) */
  .roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
  .chip { background: var(--panel, #fff); border: 1px solid var(--panel-border, #f0d6e2); border-radius: 16px; padding: 8px 6px;
    text-align: center; cursor: pointer; font: inherit; color: inherit; min-width: 0; }
  .chip .pic { position: relative; aspect-ratio: 1 / 1; }
  .chip img { position: absolute; left: 50%; bottom: 0; height: 92%; width: auto; transform: translateX(-50%); display: block; }
  .chip span { display: block; margin-top: 4px; font-family: 'DungGeunMo', monospace; font-size: 15px; white-space: nowrap; }
  .chip[aria-pressed="true"] { border-color: var(--accent, #e9568b); box-shadow: 0 0 0 2px var(--accent, #e9568b) inset; }
  /* 발밑 그림자 */
  .pic::before { content: ''; position: absolute; left: 18%; right: 18%; bottom: 0; height: 9%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, .14), transparent); }

  .maker { display: grid; grid-template-columns: minmax(220px, 340px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 640px) { .maker { grid-template-columns: 1fr; } }
  .stage { background: var(--panel, #fff); border: 1px solid var(--panel-border, #f0d6e2); border-radius: 16px; padding: 14px; text-align: center; }
  .stage .pic { height: min(300px, 72vw); display: flex; align-items: flex-end; justify-content: center; position: relative; }
  .stage .pic::before { left: 26%; right: 26%; height: 6%; }
  .stage img { position: relative; height: 100%; width: auto; display: block; }
  .stage .nm { font-family: 'DungGeunMo', monospace; font-size: 20px; margin-top: 8px; }
  .stage .breed { font-size: 13px; color: var(--ink-soft, #6b6b70); margin-top: 2px; }
  .hop { animation: hop .56s steps(1, end) infinite; }
  @keyframes hop { 0% { transform: translateY(0); } 50% { transform: translateY(-2.5%); } }
  .form { background: var(--panel, #fff); border: 1px solid var(--panel-border, #f0d6e2); border-radius: 16px; padding: 14px; }
  label { font-size: 12px; font-weight: 700; color: var(--ink-soft, #6b6b70); display: block; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--panel-border, #f0d6e2); background: var(--bg, #fffdfd); color: var(--ink, #121215); }
  button.save { font: inherit; font-size: 14px; font-weight: 700; padding: 10px; border-radius: 12px; margin-top: 10px; width: 100%;
    border: 1px solid var(--panel-border, #f0d6e2); background: var(--panel, #fff); color: var(--ink, #121215); cursor: pointer; }
  .form .note { font-size: 13px; color: var(--ink-soft, #6b6b70); line-height: 1.5; margin: 12px 0 0; }

  .scene { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--panel-border, #f0d6e2); }
  .scene canvas { width: 100%; height: auto; }
  /* 걷는 강아지 — 길 위(바닥 86%)에 키 52% */
  .scene .walker { position: absolute; left: 50%; bottom: 13%; height: 52%; width: auto; transform: translateX(-50%); }
  @media (prefers-reduced-motion: reduce) { .hop { animation: none; } }
</style>
<link rel="stylesheet" href="theme-black.css?v=1"><script src="theme.js?v=14"></script>
</head>
<body>
<main>
  <h1>도트 강아지 시안</h1>
  <p class="lead">받은 도트 강아지 그림 8마리예요. 그림마다 크기가 달라서 흰 바탕을 지우고 키를 똑같이 맞췄어요(작은 그림은 키웠어요).
    견본을 누르면 아래에서 크게 볼 수 있어요.</p>

  <h2>견본</h2>
  <div class="roster" id="roster"></div>

  <h2>크게 보기</h2>
  <div class="maker">
    <div class="stage">
      <div class="pic"><img id="big" class="hop" alt=""></div>
      <div class="nm" id="big-name">콩이</div>
      <div class="breed" id="big-breed"></div>
    </div>
    <div class="form">
      <label for="f-name">이름</label><input id="f-name" value="콩이" maxlength="8">
      <button class="save" id="save">PNG로 저장(512×512, 바탕 투명)</button>
      <p class="note">원래 그림은 흰 바탕에 강아지 크기가 제각각이었어요. 테두리 바깥 흰 바탕만 지우고, 여덟 마리 키를 똑같이 맞췄어요.</p>
    </div>
  </div>

  <h2>산책 장면</h2>
  <div class="scene"><canvas id="scene" width="192" height="72"></canvas><img class="walker" id="walker" alt=""></div>
</main>
<script>
  (function () {
    // 받은 그림 8장(icons/dot-dogs/ — 흰 바탕 지우고 키 768px로 맞춤, 둘레 16px 여백)
    var DOGS = [
      { id: 'pom', breed: '포메' },
      { id: 'poodle', breed: '푸들' },
      { id: 'maltese', breed: '말티즈' },
      { id: 'knit', breed: '파란 니트' },
      { id: 'chihuahua', breed: '치와와' },
      { id: 'dachs', breed: '닥스훈트' },
      { id: 'jindo', breed: '진돗개' },
      { id: 'shiba', breed: '시바' }
    ];
    function src(d) { return 'icons/dot-dogs/' + d.id + '.webp?v=1'; }
    function $(id) { return document.getElementById(id); }
    var cur = DOGS[0], chips = [], frame = 0, tick = 0;

    DOGS.forEach(function (d) {
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button';
      var pic = document.createElement('div'); pic.className = 'pic';
      var img = document.createElement('img'); img.src = src(d); img.alt = d.breed + ' 도트 그림';
      var s = document.createElement('span'); s.textContent = d.breed;
      pic.appendChild(img); b.appendChild(pic); b.appendChild(s);
      b.addEventListener('click', function () { pick(d); });
      $('roster').appendChild(b);
      chips.push({ d: d, b: b });
    });

    function pick(d) {
      cur = d;
      $('big').src = src(d); $('big').alt = d.breed + ' 도트 그림 크게';
      $('walker').src = src(d); $('walker').alt = d.breed + ' 산책 중';
      $('big-breed').textContent = d.breed;
      chips.forEach(function (ch) { ch.b.setAttribute('aria-pressed', ch.d === d ? 'true' : 'false'); });
    }
    $('f-name').addEventListener('input', function () { $('big-name').textContent = $('f-name').value || '우리 강아지'; });

    // 산책 장면 — 192×72칸: 하늘 · 구름 · 나무 · 길(무늬가 뒤로 흘러 걷는 것처럼). 강아지는 그림 그대로 위에 얹는다.
    function scene(t) {
      var c = $('scene'), g = c.getContext('2d'), W = c.width, H = c.height;
      g.fillStyle = '#fde8ef'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#ffffff';   // 구름
      [[20, 10], [110, 6], [160, 14]].forEach(function (q, i) {
        var x = Math.round((q[0] - t * 0.1 * (i + 1)) % (W + 30) + W + 30) % (W + 30) - 30;
        g.fillRect(x, q[1], 18, 4); g.fillRect(x + 4, q[1] - 3, 9, 3);
      });
      for (var i = 0; i < 4; i++) {   // 나무
        var tx = ((i * 56 - t * 0.5) % (W + 40) + W + 40) % (W + 40) - 20;
        g.fillStyle = '#9c6b4a'; g.fillRect(Math.round(tx) + 6, 34, 4, 14);
        g.fillStyle = '#8cc58a'; g.fillRect(Math.round(tx), 22, 16, 14); g.fillRect(Math.round(tx) + 3, 18, 10, 4);
        g.fillStyle = '#6aa868'; g.fillRect(Math.round(tx) + 10, 30, 6, 6);
      }
      g.fillStyle = '#b5d99c'; g.fillRect(0, 48, W, 4);
      g.fillStyle = '#f3d9b8'; g.fillRect(0, 52, W, 20);
      g.fillStyle = '#e6c49c';
      for (var x = -(t % 12); x < W; x += 12) g.fillRect(x, 60, 4, 2);
      g.fillStyle = 'rgba(0, 0, 0, .10)'; g.fillRect(84, 61, 24, 2);   // 발밑 그림자
    }

    $('save').addEventListener('click', function () {
      var img = $('big');
      var c = document.createElement('canvas'); c.width = c.height = 512;
      var g = c.getContext('2d'), k = Math.min(480 / img.naturalWidth, 480 / img.naturalHeight);
      var w = img.naturalWidth * k, h = img.naturalHeight * k;
      g.imageSmoothingQuality = 'high';
      g.drawImage(img, (512 - w) / 2, (512 - h) / 2, w, h);
      // 파일 이름이 살도록 blob 주소 + 문서에 붙인 링크로(save-image.js와 같은 방식)
      c.toBlob(function (b) {
        var url = URL.createObjectURL(b), a = document.createElement('a');
        a.href = url; a.download = 'walson-dog-' + ($('f-name').value || cur.id) + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }, 'image/png');
    });

    pick(DOGS[0]);
    var last = 0;
    function loop(ts) {
      if (ts - last > 280) {
        last = ts; tick += 3; frame = frame ? 0 : 1;
        scene(tick);
        $('walker').style.transform = 'translate(-50%, ' + (frame ? '-3%' : '0') + ')';   // 통통 걷기
      }
      requestAnimationFrame(loop);
    }
    scene(0);
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
