<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산책 끝</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<meta name="theme-color" content="#f7ede2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 산책 끝난 직후 화면(2026-11-14, 기획표 V1-19 — 화면 구조 C안).
     산책 중에는 휴대폰을 못 만지니(실패 시나리오 F-1a) 물어볼 것은 끝난 뒤에 한 번에 묻는다:
     오늘 충분했나 · 킁킁 지수 · 응가. 전부 골라도 되고 안 골라도 된다.
     방금 끝난 산책(petwalk_walks의 마지막 기록)에 답을 붙여 저장한다 — feel / sniff / poop.
     go.html(시간만)과 walk.html(길 기록) 둘 다 끝나면 여기로 온다. 서버 없음, 위치 없음.
     문구와 응가 선택지는 아직 제안이다(SPEC_STAGE0.md "정할 것"). 오늘의 한 장은 휴대폰 안에만(walk-photos.js). 응가가 1번·2번 이상이면 응가 캐릭터(poop-toon.html)로 가족에게 보낼 수 있다(11/16) — 가기 전에 답을 먼저 저장하고, 다녀오면 그 산책 기록에 표정·상태(poopToon)만 남는다.
     저장하면 [기록] 탭(walk-history.html?end=1)으로 넘어가 방금 산책의 영수증을 보여 준다(2026-11-15 가르시아 "끝 화면에서 바로 영수증으로",
     11/16 [영수증] 탭을 [기록]에 합침). 인증샷은 11/16 서비스 줄이기 때 뺐다 — 같은 순간·같은 재료로 영수증이 나와서.
     "묻지 않고 넘어가기"는 그대로 [오늘]로 — 아무것도 하기 싫은 사람의 출구.
     11/18 "남의 응가도 치웠다면"(응가 답과 상관없이 늘 보임) → 야생 응가 포획 카드(poop-toon.html?mode=catch). 가기 전에 답을 먼저 저장한다.
     2026-11-16 2단계(시안 ⑭): 맨 위에 "○○랑 산책 다녀왔어요 · 분·km·출발 시각"과 "이번 산책으로 받은 것"(새 발도장·주민증 성장·다음 미션 — 11/16 자라는 카드를 주민증에 합침).
     예전엔 길 기록 산책 화면 위에 보상 알림이 잠깐 떴다 — 산책 중 화면을 하나로 줄이면서 보상은 여기서 한 번에 보여 준다.
     계산은 이 휴대폰의 산책 기록으로만(reward-rules.js) — 방금 산책을 뺀 것과 넣은 것을 비교한다.
     같은 상자에 "오늘 목표"(크기별 소 30·중 60·대 90분)와 "영수증" 줄도(2026-11-16 가르시아 "그렇게 진행해줘" — 보상 체감 재검토 제안 1·2). */
  :root {
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-ink: #9c4530; --accent-tint: #f3ddd2;
    --shadow-rgb: 74, 63, 53;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  body { padding: 24px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .wrap { max-width: 420px; margin: 0 auto; }

  .sum { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 16px; }
  .sum h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; word-break: keep-all; }
  .sum .line { margin: 0; font-size: 15px; font-weight: 700; }
  .sum .sub { margin: 0; font-size: 12px; line-height: 1.6; color: var(--ink-soft); word-break: keep-all; }
  .sum .sub span { display: block; }

  /* 이번 산책으로 받은 것(2026-11-16 2단계, 시안 ⑭) */
  .got { display: flex; flex-direction: column; gap: 10px; padding: 16px; margin-bottom: 12px; border-radius: 18px;
    background: var(--panel); border: 1px solid var(--panel-border); box-shadow: 0 4px 14px rgba(var(--shadow-rgb), 0.08); }
  .got[hidden] { display: none; }
  .got-title { font-size: 13px; font-weight: 800; color: var(--accent-ink); }
  .got-row { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 700; word-break: keep-all; }
  .got-row .ic { flex: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 11px; background: var(--accent); color: #fff; }
  .got-row .ic.is-soft { background: var(--accent-tint); color: var(--accent-ink); }
  .got-row small { font-size: 15px; font-weight: 500; color: var(--ink-soft); }
  .got-next { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-tint); font-size: 14px; font-weight: 700; word-break: keep-all; }
  .got-next svg { flex: none; color: var(--accent); }
  .got-note { margin: 0; font-size: 14px; line-height: 1.6; word-break: keep-all; }
  .got-hint { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-soft); word-break: keep-all; }

  .q {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px;
    padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.06);
  }
  .q h2 { font-size: 15px; font-weight: 800; margin: 0 0 10px; }
  .q h2 span { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-left: 6px; }
  .opts { display: flex; gap: 8px; }
  .opts button {
    flex: 1; border: 2px solid var(--panel-border); background: #fff; color: var(--ink);
    border-radius: 14px; padding: 13px 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .opts button:active { transform: scale(0.97); }
  .opts button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
  .scale-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-top: 6px; }
  /* 응가 캐릭터로 보내기(1번·2번 이상일 때만) */
  .toon-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 14px;
    background: var(--accent-tint); color: var(--ink); text-decoration: none; }
  .toon-row[hidden] { display: none; }
  .toon-row:active { transform: scale(0.98); }
  .toon-row .toon-ico { flex: none; width: 40px; height: 40px; }
  .toon-row .toon-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; word-break: keep-all; }
  .toon-row b { font-size: 15px; font-weight: 800; color: var(--accent-ink); }
  .toon-row small { font-size: 12px; color: var(--ink-soft); }
  .toon-row .toon-go { flex: none; font-size: 22px; font-weight: 800; color: var(--accent); }
  /* 남의 응가도 치웠다면(11/18) — 야생 응가 포획 카드. 응가 답과 상관없이 늘 보이고, 응가 캐릭터 줄보다 가볍게 */
  .toon-row.catch-row { margin-top: 10px; padding: 10px 14px; background: transparent; border: 1.5px dashed var(--panel-border); }
  .toon-row.catch-row .toon-ico { width: 32px; height: 32px; }
  .toon-row.catch-row b { font-size: 14px; }

  .photo { position: relative; border-radius: 14px; overflow: hidden; background: #fff; }
  .photo img { display: block; width: 100%; max-height: 360px; object-fit: cover; }
  .photo img[hidden] { display: none; }
  .photo-pick {
    width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 2px dashed var(--panel-border); border-radius: 14px; background: #fff; color: var(--accent);
    padding: 22px 10px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .photo-pick[hidden] { display: none; }
  .photo-pick .plus { font-size: 28px; line-height: 1; }
  .photo-pick small { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .photo-actions { display: flex; gap: 8px; margin-top: 8px; }
  .photo-actions[hidden] { display: none; }
  .photo-actions button {
    flex: 1; border: 1px solid var(--panel-border); background: #fff; color: var(--ink);
    border-radius: 12px; padding: 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .photo-note { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; }
  .btn-main[disabled] { opacity: 0.6; }

  .btn-main {
    width: 100%; border: none; border-radius: 999px; padding: 16px; margin-top: 10px;
    background: linear-gradient(180deg, #c96b4f 0%, var(--accent) 100%); color: #fff;
    font-family: inherit; font-weight: 800; font-size: 17px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.15), 0 6px 16px rgba(var(--shadow-rgb), 0.3);
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-text {
    display: block; margin: 14px auto 0; padding: 6px 10px; text-align: center;
    font-size: 13px; font-weight: 600; color: var(--ink-soft); text-decoration: underline;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<script src="store.js?v=1"></script>
<script src="device.js?v=1"></script>
<script src="theme.js?v=10"></script>
<script src="site-config.js?v=9"></script>
<script src="inapp.js?v=4"></script>
<script src="track.js?v=8"></script>
<script src="save-image.js?v=3"></script>
</head>
<body>

<div class="wrap">
  <div class="sum">
    <h1 id="sum-label">산책 다녀왔어요</h1>
    <p class="line"><span id="sum-min">0</span>분<span id="sum-rest"></span></p>
    <p class="sub" id="sum-sub"></p>
  </div>

  <!-- 이번 산책으로 받은 것(2026-11-16 2단계, 시안 ⑭) — 새 발도장·주민증 성장·다음 미션. 시간만 잰 산책은 왜 없는지 한 줄 -->
  <section class="got" id="got" aria-label="이번 산책으로 받은 것" hidden>
    <span class="got-title">이번 산책으로 받은 것</span>
  </section>

  <!-- 스친 강아지(2026-11-15 서버 가정 시험판): ?server=mock으로 켰고 스친 강아지를 켠 경우에만 보인다 -->
  <a id="met-banner" href="friends.html#met" hidden
     style="align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:14px 16px;border-radius:18px;text-decoration:none;background:var(--accent-tint);color:var(--ink);font-weight:800;font-size:15px;">
    <span id="met-text">스친 강아지 찾는 중…</span><span aria-hidden="true">→</span>
  </a>
  <!-- 꾸준함 도장(2026-11-15): 이 산책까지 넣은 이번 주 — 시간만 잰 산책도 들어간다 -->
  <section class="q" id="steady-end" hidden>
    <h2>꾸준함 도장 <span>이번 주</span></h2>
    <div id="steady-end-box"></div>
  </section>

  <section class="q">
    <h2>오늘 산책, 충분했나요?</h2>
    <div class="opts" data-field="feel">
      <button type="button" data-value="enough" aria-pressed="false">충분했어요</button>
      <button type="button" data-value="short" aria-pressed="false">조금 아쉬워요</button>
    </div>
  </section>

  <section class="q">
    <h2>킁킁 지수 <span>냄새를 얼마나 맡았나요</span></h2>
    <div class="opts" data-field="sniff">
      <button type="button" data-value="1" aria-pressed="false">1</button>
      <button type="button" data-value="2" aria-pressed="false">2</button>
      <button type="button" data-value="3" aria-pressed="false">3</button>
      <button type="button" data-value="4" aria-pressed="false">4</button>
      <button type="button" data-value="5" aria-pressed="false">5</button>
    </div>
    <div class="scale-ends"><span>거의 못 맡음</span><span>실컷 맡음</span></div>
  </section>

  <!-- 응가 치웠나요?(2026-11-17 가르시아 — 예전 "응가는요?"): 응가 기록을 "치운 횟수"로 읽게 한다(똥 치우기 캠페인·나중 뱃지의 근거).
       사진 인증은 안 한다 — 한 번 누르기(자기 신고). "안 했어요"는 "안 치웠다"로 읽힐 수 있어 "안 쌌어요"로. 저장 값(poop 0·1·2)은 그대로 -->
  <section class="q">
    <h2>응가 치웠나요?</h2>
    <div class="opts" data-field="poop">
      <button type="button" data-value="0" aria-pressed="false">안 쌌어요</button>
      <button type="button" data-value="1" aria-pressed="false">1번</button>
      <button type="button" data-value="2" aria-pressed="false">2번 이상</button>
    </div>
    <!-- 응가 캐릭터(2026-11-16): 1번·2번 이상이면 여기서 바로 그림으로 만들어 가족에게. 응가 사진은 저장하지 않는다(poop-toon.html) -->
    <a class="toon-row" id="toon-row" href="poop-toon.html" hidden>
      <svg class="toon-ico" viewBox="0 0 40 40" aria-hidden="true"><path d="M7 33c-3-1-3-6 1-7-2-3 1-7 5-6 0-4 4-7 8-5 2-4 8-3 8 1 4 0 6 4 4 7 3 1 4 5 1 7z" fill="#8a5a2b" stroke="#4a3f35" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="24" r="3.4" fill="#fff" stroke="#4a3f35" stroke-width="1.4"/><circle cx="25" cy="24" r="3.4" fill="#fff" stroke="#4a3f35" stroke-width="1.4"/><circle cx="16.8" cy="24.6" r="1.5" fill="#4a3f35"/><circle cx="25.8" cy="24.6" r="1.5" fill="#4a3f35"/><path d="M17 29.5q3.5 2.6 7 0" fill="none" stroke="#4a3f35" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="toon-txt"><b id="toon-title">응가 캐릭터로 가족에게 보내기</b><small id="toon-sub">사진 한 장 → 눈알 달린 그림 · 사진은 저장 안 해요</small></span>
      <span class="toon-go" aria-hidden="true">›</span>
    </a>
    <!-- 남의 응가도 치웠다면(2026-11-18 가르시아 "그래봐"): 야생 응가 포획 카드(poop-toon.html?mode=catch).
         몇 마리째인지는 이 휴대폰에만(petwalk_poop_catch). 그 산책 기록에는 적지 않는다 -->
    <a class="toon-row catch-row" id="catch-row" href="poop-toon.html?mode=catch">
      <svg class="toon-ico" viewBox="0 0 40 40" aria-hidden="true"><path d="M7 33c-3-1-3-6 1-7-2-3 1-7 5-6 0-4 4-7 8-5 2-4 8-3 8 1 4 0 6 4 4 7 3 1 4 5 1 7z" fill="#8a5a2b" stroke="#4a3f35" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="24" r="3.4" fill="#fff" stroke="#4a3f35" stroke-width="1.4"/><circle cx="25" cy="24" r="3.4" fill="#fff" stroke="#4a3f35" stroke-width="1.4"/><circle cx="16" cy="23.4" r="1.5" fill="#4a3f35"/><circle cx="25" cy="23.4" r="1.5" fill="#4a3f35"/><ellipse cx="20.5" cy="30" rx="2.2" ry="2.6" fill="#4a3f35"/><path d="M3 9l5 3M37 9l-5 3M20 2v5" stroke="#b8563a" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span class="toon-txt"><b>남의 응가도 치웠다면</b><small id="catch-sub">야생 응가 포획 카드 만들기</small></span>
      <span class="toon-go" aria-hidden="true">›</span>
    </a>
  </section>

  <!-- 오늘의 한 장(2026-11-14): 이 휴대폰 안(IndexedDB)에만 저장. 위치 정보는 빠진다(walk-photos.js) -->
  <section class="q">
    <h2>오늘의 한 장 <span>선택</span></h2>
    <div class="photo" id="photo-box">
      <img id="photo-img" alt="오늘 산책 사진" hidden>
      <button type="button" class="photo-pick" id="photo-pick">
        <span class="plus">+</span>
        <span>사진 남기기</span>
        <small>찍거나 앨범에서 골라요</small>
      </button>
    </div>
    <div class="photo-actions" id="photo-actions" hidden>
      <button type="button" id="photo-change">다른 사진</button>
      <button type="button" id="photo-clear">빼기</button>
    </div>
    <input type="file" id="photo-input" accept="image/*" hidden>
    <p class="photo-note">이 휴대폰에만 저장돼요. 사진에 붙은 위치 정보는 빼고 저장해요.</p>
  </section>

  <button type="button" class="btn-main" id="save-btn">저장하고 영수증 받기</button>
  <a class="btn-text" href="index.html">묻지 않고 넘어가기</a>
</div>

<script src="walk-photos.js?v=1"></script>
<script src="spots-data.js"></script>
<script src="reward-rules.js?v=11"></script>
<script src="steady-stamp.js?v=3"></script>
<script src="walk-screen.js?v=2"></script>
<script src="mock-server.js?v=2"></script>
<script>
  // 서버 가정 시험판 — 방금 산책을 가짜 서버로 보내고 스친 강아지 수를 띄운다(꺼져 있으면 아무것도 안 함)
  (function () {
    if (!window.WalsonApi || !WalsonApi.isOn()) return;
    var banner = document.getElementById('met-banner'), text = document.getElementById('met-text');
    var ws = WalsonStore.walks(), walk = ws[ws.length - 1];
    WalsonApi.server.getSettings().then(function (s) {
      if (!s.visible) return;
      banner.hidden = false; banner.style.display = 'flex';
      return WalsonApi.syncWalks().then(function (r) {
        var timeOnly = walk && walk.mode === 'time';
        text.textContent = r.found ? '오늘 스친 강아지 ' + r.found + '마리'
          : timeOnly ? '스친 강아지는 길 기록 산책에서만 생겨요'
          : '이번엔 스친 강아지가 없어요 · 도감 보기';
      });
    });
  })();
</script>
<script>
(function () {
  var walks = WalsonStore.walks();   // 산책 기록·주민증은 store.js(WalsonStore)로 읽고 쓴다
  var walk = walks.length ? walks[walks.length - 1] : null;
  if (!walk) { location.replace('index.html'); return; }

  var profile = WalsonStore.profile() || {};
  var loggedAfter = walk.logged === 'after', timeOnly = walk.mode === 'time';
  var rang = window.WalkScreen ? WalkScreen.rang(profile.name) : '';
  document.getElementById('sum-label').textContent = (rang ? rang + ' ' : '') + (loggedAfter ? '다녀온 산책 적었어요' : '산책 다녀왔어요');
  document.getElementById('sum-min').textContent = walk.durationMin || 0;
  // 분 · km · 출발 시각(시안 ⑭) — 출발 시각은 2026-11-16부터 기록에 남긴다(그 전 기록은 없음)
  var rest = [];
  if (walk.distanceKm) rest.push(walk.distanceKm.toFixed(1) + 'km');
  if (typeof walk.startedAt === 'number') {
    var st = new Date(walk.startedAt);
    rest.push(st.getHours() + '시 ' + (st.getMinutes() < 10 ? '0' : '') + st.getMinutes() + '분 출발');
  }
  document.getElementById('sum-rest').textContent = rest.length ? ' · ' + rest.join(' · ') : '';

  // 작은 줄: 화면이 꺼져 있던 동안(주머니 산책) · 오늘 합계(방금 것까지)
  var todayMin = 0, todayCount = 0;
  walks.forEach(function (w) { if (w.date === walk.date) { todayMin += w.durationMin || 0; todayCount += 1; } });
  var subLines = [];
  if (!timeOnly && walk.gapMin > 0) subLines.push('화면이 꺼져 있던 ' + walk.gapMin + '분은 직선으로 이어서 셌어요');
  if (todayCount > 1) subLines.push('오늘 모두 ' + todayMin + '분 · ' + todayCount + '번째 산책');
  var subEl = document.getElementById('sum-sub');
  subLines.forEach(function (t) { var sp = document.createElement('span'); sp.textContent = t; subEl.appendChild(sp); });

  var receiptSmall = null;   // 아래 "영수증" 줄의 작은 글씨(paintReceiptLine이 바꾼다)

  // ── 이번 산책으로 받은 것(2026-11-16 2단계, 시안 ⑭) ──
  // 방금 산책을 뺀 진행도와 넣은 진행도를 비교한다(reward-rules.js).
  // 발도장·미션은 위치로 5분·200m가 확인된 길 기록 산책만. 주민증 성장(승급·특기)은 11/17부터 어떻게 기록했든
  // 5분 이상이면 들어간다(짤은 인질로 잡지 않는다 — 가르시아 "공원 전에 해"). 꾸준함 도장·오늘 목표는 원래 모든 산책.
  (function paintGot() {
    var R = window.RewardRules, box = document.getElementById('got');
    if (!R || !R.computeProgress) return;
    var FLAG = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 3v18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M7 4h11l-2.6 4.2L18 12.4H7z" fill="currentColor"/></svg>';
    var SEAL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5.2" stroke-width="1.4"/></svg>';
    var CARD = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8h6M9 12h6"/></svg>';
    var ARROW = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l6 9h-4v9h-4v-9H6z" fill="currentColor"/></svg>';
    var GOAL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.4 12.3l2.5 2.5 4.7-5.1"/></svg>';
    var RECEIPT = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 12h6"/></svg>';
    function row(icon, soft, text, small) {
      var d = document.createElement('div');
      d.className = 'got-row';
      d.innerHTML = '<span class="ic' + (soft ? ' is-soft' : '') + '" aria-hidden="true">' + icon + '</span><span></span>';
      var t = d.lastChild;
      t.textContent = text + ' ';
      if (small) { var sm = document.createElement('small'); sm.textContent = small; t.appendChild(sm); }
      box.appendChild(d);
      return d;
    }
    function note(text, cls) {
      var p = document.createElement('p');
      p.className = cls;
      p.textContent = text;
      box.appendChild(p);
    }
    // 오늘 목표·영수증 — 어떻게 걸었든(시간만 재기·다녀왔어요 포함) 매번 뜨는 두 줄
    // (2026-11-16 가르시아 "그렇게 진행해줘" — 보상 체감 재검토 제안 1·2. hq notes/petwalk-reward-feel.md)
    function goalAndReceipt() {
      if (R.dayGoal) {
        // 크기별 목표(소 30·중 60·대 90분, 크기를 모르면 중형) — 모자라도 혼내지 않는다
        var g = R.dayGoal(walks, walk.date), gb = R.dayGoal(walks.slice(0, -1), walk.date);
        var sizeName = { small: '소형', medium: '중형', large: '대형' }[R.dogSize()] || '';
        if (g.reached && !gb.reached) row(GOAL, false, '오늘 목표 달성!', '· 오늘 ' + g.total + '분 / ' + sizeName + ' 목표 ' + g.target + '분');
        else if (g.reached) row(GOAL, true, '오늘 목표는 이미 달성', '· 오늘 ' + g.total + '분');
        else row(GOAL, true, '오늘 목표까지 ' + g.left + '분', '· 오늘 ' + g.total + '분 / ' + sizeName + ' 목표 ' + g.target + '분');
      }
      // 영수증 — "충분했나" 답에 따라 상환 문구가 바뀐다(아래 paintReceiptLine)
      receiptSmall = row(RECEIPT, true, '영수증 No.' + ('000' + walks.length).slice(-4), ' ').querySelector('small');
    }
    var before = R.computeProgress(walks.slice(0, -1)), now = R.computeProgress(walks);
    var counted = now.walks > before.walks;   // 이번 산책이 주민증 성장 횟수에 들어갔는지(5분 이상)
    var shortNote = (R.RECORD_MIN_MINUTES || 5) + '분이 안 돼서 주민증 성장엔 안 들어가요.';
    // 주민증 성장(11/16 자라는 주민증) — 센 산책 하나마다 주민증이 자란다(특기·특이 사항이 생기고 승급)
    function cardRows() {
      var cardUps = R.newUnlocks(before, now).filter(function (t) { return t.indexOf('발도장') < 0; });
      var rankUp = cardUps.filter(function (t) { return t.indexOf('승급') >= 0; })[0];
      var others = cardUps.filter(function (t) { return t !== rankUp; });
      var nr = R.nextRank ? R.nextRank(now.walks) : null;
      var nextLine = nr ? '· ' + nr.name + '까지 ' + (nr.minWalks - now.walks) + '회' : '· 산책 ' + now.walks + '회째';
      if (rankUp) row(SEAL, false, rankUp.replace(/했어요$/, '!'), '· 주민증에 승급 도장 쾅 ' + nextLine);
      if (others.length || !rankUp) row(CARD, true, '주민증이 자랐어요', others.length ? '· ' + others.join(' · ') : nextLine);
    }
    if (timeOnly && walk.noRoute) {
      // 위치를 쓰기로 했지만 위치를 거의 못 받은 산책(walk.html) — 걸은 시간만 남았다
      if (counted) cardRows();
      goalAndReceipt();
      note('위치를 거의 받지 못해서 걸은 길이 남지 않았어요. 걸은 시간만 남겼어요 — 발도장은 없어요.' + (counted ? '' : ' ' + shortNote), 'got-note');
      // 진짜 이유는 대개 화면 꺼짐·다른 앱(웹앱은 그동안 위치를 못 받는다) — 11/17 가르시아 "통화·유튜브 중엔 끊길 수 있음을 고지"
      note('화면이 꺼져 있었거나 통화·유튜브 등 다른 앱을 쓰는 동안(또는 실내·높은 건물 사이)엔 위치를 못 받아요. 다음엔 앱을 켜 둔 채 걷거나, 장소에서 "여기 찍기"를 눌러 주세요.', 'got-hint');
      box.hidden = false;
      return;
    }
    if (timeOnly) {
      if (counted) cardRows();
      goalAndReceipt();
      note((loggedAfter ? '다녀와서 적은' : '시간만 잰') + ' 산책이라 발도장은 없어요.' + (counted ? '' : ' ' + shortNote), 'got-note');
      if (!loggedAfter) note('다음엔 산책 나가기에서 "바꾸기"로 위치를 쓰면 발도장도 찍혀요.', 'got-hint');
      box.hidden = false;
      return;
    }
    if (walk.rewardEligible === false) {
      // 짧은 길 기록 산책 — 5분은 넘었지만 200m가 안 됐으면 주민증만 자라고 발도장은 없다
      if (counted) { cardRows(); note('걸은 거리가 200m가 안 돼서 발도장은 없어요.', 'got-note'); }
      else note('5분이 안 돼서 이번 산책은 발도장·주민증 성장에 안 들어가요.', 'got-note');
      // 화면이 꺼져 있던(다른 앱) 동안 길이 끊겨 거리가 모자랐을 수 있다 — 앱을 켜 두거나 여기 찍기(11/17)
      if (walk.gapMin > 0) note('화면이 꺼져 있던 동안은 길이 안 그려져요 — 앱을 켜 둔 채 걷거나, 장소에서 "여기 찍기"를 누르면 그 사이가 직선으로 이어져요.', 'got-hint');
    } else {
      var all = R.missions ? R.missions(now) : [];
      var doneBefore = R.missions ? R.missions(before).filter(function (m) { return m.done; }).length : 0;
      R.PLACES.filter(function (pl) { return now.visited[pl.id] && !before.visited[pl.id]; }).forEach(function (pl, i) {
        row(FLAG, false, pl.name + ' 발도장', all.length ? '(' + (doneBefore + i + 1) + '/' + all.length + ')' : '');
      });
      cardRows();
    }
    goalAndReceipt();
    // 다음 미션(없으면 다음 보상)
    var m = R.currentMission ? R.currentMission(now) : null, goal = R.nextGoalText ? R.nextGoalText(now) : '';
    var next = document.createElement('div');
    next.className = 'got-next';
    next.innerHTML = ARROW + '<span></span>';
    next.lastChild.textContent = m ? '다음 미션: ' + m.place.name + (m.place.kind === 'building' ? ' 앞까지' : '까지')
      : goal && goal !== '모든 보상을 모았어요' ? '다음 보상: ' + goal : '미션을 다 했어요';
    box.appendChild(next);
    box.hidden = false;
  })();

  // 꾸준함 도장 — 이 산책으로 이번 주 단계가 올랐는지(방금 것 빼고 센 것과 비교)
  if (window.RewardRules && RewardRules.steady && window.SteadyStamp) {
    var stBefore = RewardRules.steady(walks.slice(0, -1)), stAfter = RewardRules.steady(walks);
    var justGot = stAfter.thisWeek.level > stBefore.thisWeek.level;
    document.getElementById('steady-end-box').appendChild(SteadyStamp.week(stAfter, { justGot: justGot }));
    document.getElementById('steady-end').hidden = false;
  }

  // 영수증 줄의 작은 글씨 — "충분했나" 답에 따라 영수증의 상환 도장과 같은 말로 바뀐다
  function paintReceiptLine() {
    if (!receiptSmall) return;
    receiptSmall.textContent = answers.feel === 'short' ? '· 일부 상환 (연체 아님)'
      : answers.feel === 'enough' ? '· 오늘 산책 빚 상환 완료' : '· 오늘 산책 빚 1회분 · 저장하면 나와요';
  }

  // 답 고르기 — 같은 버튼을 다시 누르면 선택이 풀린다(전부 선택 사항)
  var answers = {};
  if (walk.feel) answers.feel = walk.feel;
  if (walk.sniff) answers.sniff = String(walk.sniff);
  if (walk.poop !== undefined) answers.poop = String(walk.poop);
  Array.prototype.forEach.call(document.querySelectorAll('.opts'), function (group) {
    var field = group.getAttribute('data-field');
    var buttons = group.querySelectorAll('button');
    function paint() {
      Array.prototype.forEach.call(buttons, function (b) {
        b.setAttribute('aria-pressed', answers[field] === b.getAttribute('data-value') ? 'true' : 'false');
      });
    }
    Array.prototype.forEach.call(buttons, function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-value');
        if (answers[field] === v) delete answers[field]; else answers[field] = v;
        paint();
        if (field === 'feel') paintReceiptLine();
        if (field === 'poop') paintToon();
      });
    });
    paint();
  });

  paintReceiptLine();

  // ── 응가 캐릭터로 보내기: 1번·2번 이상일 때만. 이미 만들었으면 '다시 만들기' ──
  var toonRow = document.getElementById('toon-row');
  function paintToon() {
    var on = answers.poop === '1' || answers.poop === '2';
    toonRow.hidden = !on;
    if (walk.poopToon) {
      document.getElementById('toon-title').textContent = '응가 캐릭터 만들었어요 ✓';
      document.getElementById('toon-sub').textContent = '다시 만들기 · 가족에게 또 보내기';
    }
  }
  paintToon();
  // 가기 전에 지금 고른 답(사진 포함)을 먼저 저장한다 — 다녀오면 이 화면이 다시 열려 답이 그대로 채워진다
  toonRow.addEventListener('click', function (e) {
    e.preventDefault();
    if (toonRow.getAttribute('aria-busy') === 'true') return;
    toonRow.setAttribute('aria-busy', 'true');
    saveAnswers().then(function (ok) {
      toonRow.removeAttribute('aria-busy');
      if (!ok) return;
      var t = walk.endedAt || walk.loggedAt || walk.startedAt || walk.date || '';
      location.href = 'poop-toon.html?walk=' + encodeURIComponent(String(t));
    });
  });

  // ── 남의 응가도 치웠다면 → 야생 응가 포획 카드(11/18). 지금까지 센 수는 이 휴대폰에만 ──
  var catchRow = document.getElementById('catch-row');
  try {
    var caught = JSON.parse(localStorage.getItem('petwalk_poop_catch'));
    if (caught && caught.n > 0) document.getElementById('catch-sub').textContent = '야생 응가 포획 카드 만들기 · 지금까지 ' + caught.n + '마리';
  } catch (e) { /* 처음 */ }
  catchRow.addEventListener('click', function (e) {
    e.preventDefault();
    if (catchRow.getAttribute('aria-busy') === 'true') return;
    catchRow.setAttribute('aria-busy', 'true');
    saveAnswers().then(function (ok) {
      catchRow.removeAttribute('aria-busy');
      if (!ok) return;
      var t = walk.endedAt || walk.loggedAt || walk.startedAt || walk.date || '';
      location.href = 'poop-toon.html?mode=catch&walk=' + encodeURIComponent(String(t));
    });
  });

  // ── 오늘의 한 장 ──
  var photoBlob = null;          // 새로 고른 사진(아직 저장 전)
  var photoRemoved = false;      // 이미 있던 사진을 빼기로 했는지
  var photoImg = document.getElementById('photo-img');
  var photoPick = document.getElementById('photo-pick');
  var photoActions = document.getElementById('photo-actions');
  var photoInput = document.getElementById('photo-input');
  var previewUrl = null;
  function showPhoto(has) {
    photoImg.hidden = !has;
    photoPick.hidden = has;
    photoActions.hidden = !has;
  }
  function pickPhoto() { photoInput.click(); }
  photoPick.addEventListener('click', pickPhoto);
  document.getElementById('photo-change').addEventListener('click', pickPhoto);
  document.getElementById('photo-clear').addEventListener('click', function () {
    photoBlob = null;
    photoRemoved = true;
    showPhoto(false);
  });
  photoInput.addEventListener('change', function () {
    var file = photoInput.files[0];
    photoInput.value = '';
    if (!file || !window.WalkPhotos) return;
    WalkPhotos.shrink(file, 1080).then(function (blob) {
      photoBlob = blob;
      photoRemoved = false;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(blob);
      photoImg.src = previewUrl;
      showPhoto(true);
    }).catch(function (err) { alert('사진을 불러오지 못했어요: ' + err.message); });
  });
  // 이 산책에 이미 사진이 있으면(끝 화면에 다시 들어온 경우) 보여 준다
  if (walk.photoKey && window.WalkPhotos) {
    WalkPhotos.show(walk.photoKey, photoImg).then(function (ok) { showPhoto(ok); });
  }

  var saveBtn = document.getElementById('save-btn');
  saveBtn.addEventListener('click', function () {
    saveBtn.disabled = true;
    saveAnswers().then(function (ok) {
      if (!ok) { saveBtn.disabled = false; return; }
      // 방금 산책 영수증으로([기록] 탭이 end=1을 보고 맨 마지막 산책 영수증을 열고 안내 한 줄을 띄운다)
      location.replace('walk-history.html?end=1');
    });
  });
  // 답 저장: 사진부터 휴대폰 안 저장소에 넣고, 기록에는 열쇠만 적는다. 됐으면 true
  function saveAnswers() {
    var key = (walk.photoKey && !photoRemoved) ? walk.photoKey : null;
    var step = Promise.resolve();
    if (photoBlob && window.WalkPhotos) {
      key = walk.photoKey || WalkPhotos.newKey();
      step = WalkPhotos.put(key, photoBlob).catch(function (err) {
        key = null;
        alert('사진은 저장하지 못했어요(' + err.message + '). 나머지는 저장할게요.');
      });
    } else if (photoRemoved && walk.photoKey && window.WalkPhotos) {
      step = WalkPhotos.remove(walk.photoKey).catch(function () { /* 지우지 못해도 기록에서는 뺀다 */ });
    }
    return step.then(function () {
      // 다른 탭에서 기록이 바뀌었을 수 있으니 다시 읽어 마지막 기록에 붙인다
      var latest = WalsonStore.walks();
      var target = latest.length ? latest[latest.length - 1] : null;
      if (target) {
        if (answers.feel) target.feel = answers.feel; else delete target.feel;
        if (answers.sniff) target.sniff = Number(answers.sniff); else delete target.sniff;
        if (answers.poop !== undefined) target.poop = Number(answers.poop); else delete target.poop;
        if (key) target.photoKey = key; else delete target.photoKey;
        if (!WalsonStore.saveWalks(latest)) {
          alert('저장하지 못했어요. 저장 공간을 확인해 주세요.');
          return false;
        }
        // 다시 저장해도 같은 사진을 두 번 넣지 않게
        if (key) { walk.photoKey = key; photoBlob = null; } else delete walk.photoKey;
        photoRemoved = false;
      }
      return true;
    });
  }
})();
</script>

</body>
