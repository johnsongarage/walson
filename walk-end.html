<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산책 끝</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<meta name="theme-color" content="#f7ede2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 산책 끝난 직후 화면(2026-11-14, 기획표 V1-19 — 화면 구조 C안).
     산책 중에는 휴대폰을 못 만지니(실패 시나리오 F-1a) 물어볼 것은 끝난 뒤에 한 번에 묻는다:
     오늘 충분했나 · 킁킁 지수 · 응가. 전부 골라도 되고 안 골라도 된다.
     방금 끝난 산책(petwalk_walks의 마지막 기록)에 답을 붙여 저장한다 — feel / sniff / poop.
     go.html(시간만)과 walk.html(길 기록) 둘 다 끝나면 여기로 온다. 서버 없음, 위치 없음.
     문구와 응가 선택지는 아직 제안이다(SPEC_STAGE0.md "정할 것"). 오늘의 한 장은 휴대폰 안에만(walk-photos.js). 가족에게 보내기는 아직 없다.
     저장하면 [기록] 탭(walk-history.html?end=1)으로 넘어가 방금 산책의 영수증을 보여 준다(2026-11-15 가르시아 "끝 화면에서 바로 영수증으로",
     11/16 [영수증] 탭을 [기록]에 합침). 인증샷은 11/16 서비스 줄이기 때 뺐다 — 같은 순간·같은 재료로 영수증이 나와서.
     "묻지 않고 넘어가기"는 그대로 [오늘]로 — 아무것도 하기 싫은 사람의 출구.
     맨 위 "오늘 달라진 것"(2026-11-16 가르시아 "그렇게 진행해줘" — 보상 체감 재검토 제안 1·2): 이번 산책 전후 기록을 비교해
     영수증·오늘 목표·꾸준함·(길 기록이면) 새 발도장·카드 변화·다음 미션을 한 곳에. 길 기록도 지도 위 보상 알림 대신 여기서 끝난다. */
  :root {
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-tint: #f3ddd2;
    --shadow-rgb: 74, 63, 53;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  body { padding: 24px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .wrap { max-width: 420px; margin: 0 auto; }

  .sum { text-align: center; margin-bottom: 22px; }
  .sum .label { font-size: 14px; font-weight: 700; color: var(--ink-soft); margin: 0 0 6px; }
  .sum .num { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .sum .num small { font-size: 22px; font-weight: 700; letter-spacing: 0; margin-left: 4px; }
  .sum .sub { font-size: 14px; color: var(--ink-soft); margin: 10px 0 0; }

  .q {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px;
    padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.06);
  }
  .q h2 { font-size: 15px; font-weight: 800; margin: 0 0 10px; }
  .q h2 span { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-left: 6px; }
  .opts { display: flex; gap: 8px; }
  .opts button {
    flex: 1; border: 2px solid var(--panel-border); background: #fff; color: var(--ink);
    border-radius: 14px; padding: 13px 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .opts button:active { transform: scale(0.97); }
  .opts button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
  .scale-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-top: 6px; }
  /* 오늘 달라진 것(2026-11-16) */
  .ch-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .ch-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.45; word-break: keep-all; }
  .ch-list .tag { flex-shrink: 0; min-width: 52px; text-align: center; font-size: 11px; font-weight: 800; padding: 3px 6px; margin-top: 1px;
    border-radius: 999px; background: var(--accent-tint); color: var(--accent); }
  .ch-list li.is-new .tag { background: var(--accent); color: #fff; }
  .ch-list b { font-weight: 800; }
  .ch-next { margin: 10px 0 0; font-size: 12px; color: var(--ink-soft); line-height: 1.5; word-break: keep-all; }

  .photo { position: relative; border-radius: 14px; overflow: hidden; background: #fff; }
  .photo img { display: block; width: 100%; max-height: 360px; object-fit: cover; }
  .photo img[hidden] { display: none; }
  .photo-pick {
    width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 2px dashed var(--panel-border); border-radius: 14px; background: #fff; color: var(--accent);
    padding: 22px 10px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .photo-pick[hidden] { display: none; }
  .photo-pick .plus { font-size: 28px; line-height: 1; }
  .photo-pick small { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .photo-actions { display: flex; gap: 8px; margin-top: 8px; }
  .photo-actions[hidden] { display: none; }
  .photo-actions button {
    flex: 1; border: 1px solid var(--panel-border); background: #fff; color: var(--ink);
    border-radius: 12px; padding: 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .photo-note { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; }
  .btn-main[disabled] { opacity: 0.6; }

  .btn-main {
    width: 100%; border: none; border-radius: 999px; padding: 16px; margin-top: 10px;
    background: linear-gradient(180deg, #c96b4f 0%, var(--accent) 100%); color: #fff;
    font-family: inherit; font-weight: 800; font-size: 17px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.15), 0 6px 16px rgba(var(--shadow-rgb), 0.3);
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-text {
    display: block; margin: 14px auto 0; padding: 6px 10px; text-align: center;
    font-size: 13px; font-weight: 600; color: var(--ink-soft); text-decoration: underline;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<script src="theme.js?v=9"></script>
<script src="site-config.js?v=3"></script>
<script src="inapp.js?v=2"></script>
<script src="track.js?v=5"></script>
<script src="save-image.js?v=1"></script>
</head>
<body>

<div class="wrap">
  <div class="sum">
    <p class="label" id="sum-label">산책 끝</p>
    <div class="num"><span id="sum-min">0</span><small>분</small></div>
    <p class="sub" id="sum-sub"></p>
  </div>

  <!-- 스친 강아지(2026-11-15 서버 가정 시험판): ?server=mock으로 켰고 스친 강아지를 켠 경우에만 보인다 -->
  <a id="met-banner" href="friends.html#met" hidden
     style="align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:14px 16px;border-radius:18px;text-decoration:none;background:var(--accent-tint);color:var(--ink);font-weight:800;font-size:15px;">
    <span id="met-text">스친 강아지 찾는 중…</span><span aria-hidden="true">→</span>
  </a>
  <!-- 오늘 달라진 것(2026-11-16) — 이번 산책으로 바뀐 것을 한 곳에 -->
  <section class="q" id="changed" hidden>
    <h2>오늘 달라진 것</h2>
    <ul class="ch-list" id="ch-list"></ul>
    <p class="ch-next" id="ch-next" hidden></p>
  </section>
  <!-- 꾸준함 도장(2026-11-15): 이 산책까지 넣은 이번 주 — 시간만 잰 산책도 들어간다 -->
  <section class="q" id="steady-end" hidden>
    <h2>꾸준함 도장 <span>이번 주</span></h2>
    <div id="steady-end-box"></div>
  </section>

  <section class="q">
    <h2>오늘 산책, 충분했나요?</h2>
    <div class="opts" data-field="feel">
      <button type="button" data-value="enough" aria-pressed="false">충분했어요</button>
      <button type="button" data-value="short" aria-pressed="false">조금 아쉬워요</button>
    </div>
  </section>

  <section class="q">
    <h2>킁킁 지수 <span>냄새를 얼마나 맡았나요</span></h2>
    <div class="opts" data-field="sniff">
      <button type="button" data-value="1" aria-pressed="false">1</button>
      <button type="button" data-value="2" aria-pressed="false">2</button>
      <button type="button" data-value="3" aria-pressed="false">3</button>
      <button type="button" data-value="4" aria-pressed="false">4</button>
      <button type="button" data-value="5" aria-pressed="false">5</button>
    </div>
    <div class="scale-ends"><span>거의 못 맡음</span><span>실컷 맡음</span></div>
  </section>

  <section class="q">
    <h2>응가는요?</h2>
    <div class="opts" data-field="poop">
      <button type="button" data-value="0" aria-pressed="false">안 했어요</button>
      <button type="button" data-value="1" aria-pressed="false">1번</button>
      <button type="button" data-value="2" aria-pressed="false">2번 이상</button>
    </div>
  </section>

  <!-- 오늘의 한 장(2026-11-14): 이 휴대폰 안(IndexedDB)에만 저장. 위치 정보는 빠진다(walk-photos.js) -->
  <section class="q">
    <h2>오늘의 한 장 <span>선택</span></h2>
    <div class="photo" id="photo-box">
      <img id="photo-img" alt="오늘 산책 사진" hidden>
      <button type="button" class="photo-pick" id="photo-pick">
        <span class="plus">+</span>
        <span>사진 남기기</span>
        <small>찍거나 앨범에서 골라요</small>
      </button>
    </div>
    <div class="photo-actions" id="photo-actions" hidden>
      <button type="button" id="photo-change">다른 사진</button>
      <button type="button" id="photo-clear">빼기</button>
    </div>
    <input type="file" id="photo-input" accept="image/*" hidden>
    <p class="photo-note">이 휴대폰에만 저장돼요. 사진에 붙은 위치 정보는 빼고 저장해요.</p>
  </section>

  <button type="button" class="btn-main" id="save-btn">저장하고 영수증 받기</button>
  <a class="btn-text" href="index.html">묻지 않고 넘어가기</a>
</div>

<script src="walk-photos.js?v=1"></script>
<script src="spots-data.js"></script>
<script src="reward-rules.js?v=8"></script>
<script src="steady-stamp.js?v=2"></script>
<script src="mock-server.js?v=1"></script>
<script>
  // 서버 가정 시험판 — 방금 산책을 가짜 서버로 보내고 스친 강아지 수를 띄운다(꺼져 있으면 아무것도 안 함)
  (function () {
    if (!window.WalsonApi || !WalsonApi.isOn()) return;
    var banner = document.getElementById('met-banner'), text = document.getElementById('met-text');
    var walk = null;
    try { var ws = JSON.parse(localStorage.getItem('petwalk_walks')) || []; walk = ws[ws.length - 1]; } catch (e) { walk = null; }
    WalsonApi.server.getSettings().then(function (s) {
      if (!s.visible) return;
      banner.hidden = false; banner.style.display = 'flex';
      return WalsonApi.syncWalks().then(function (r) {
        var timeOnly = walk && walk.mode === 'time';
        text.textContent = r.found ? '오늘 스친 강아지 ' + r.found + '마리'
          : timeOnly ? '스친 강아지는 길 기록 산책에서만 생겨요'
          : '이번엔 스친 강아지가 없어요 · 도감 보기';
      });
    });
  })();
</script>
<script>
(function () {
  var WALKS_KEY = 'petwalk_walks';
  var PROFILE_KEY = 'petwalk_profile';

  function loadJSON(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
  }

  var walks = loadJSON(WALKS_KEY, []);
  var walk = walks.length ? walks[walks.length - 1] : null;
  if (!walk) { location.replace('index.html'); return; }

  var profile = loadJSON(PROFILE_KEY, {});
  document.getElementById('sum-label').textContent = (profile.name ? profile.name + ', ' : '') + (walk.logged === 'after' ? '산책 적었어요' : '산책 끝');
  document.getElementById('sum-min').textContent = walk.durationMin || 0;

  // 오늘 합계 — 방금 것까지 포함
  var todayMin = 0, todayCount = 0;
  walks.forEach(function (w) { if (w.date === walk.date) { todayMin += w.durationMin || 0; todayCount += 1; } });
  var sub = [];
  if (walk.distanceKm) sub.push(walk.distanceKm.toFixed(1) + 'km');
  if (todayCount > 1) sub.push('오늘 모두 ' + todayMin + '분 · ' + todayCount + '번째 산책');
  document.getElementById('sum-sub').textContent = sub.join(' · ');

  // 꾸준함 도장 — 이 산책으로 이번 주 단계가 올랐는지(방금 것 빼고 센 것과 비교)
  if (window.RewardRules && RewardRules.steady && window.SteadyStamp) {
    var stBefore = RewardRules.steady(walks.slice(0, -1)), stAfter = RewardRules.steady(walks);
    var justGot = stAfter.thisWeek.level > stBefore.thisWeek.level;
    document.getElementById('steady-end-box').appendChild(SteadyStamp.week(stAfter, { justGot: justGot }));
    document.getElementById('steady-end').hidden = false;
  }

  // ── 오늘 달라진 것(2026-11-16) — 방금 산책을 넣기 전과 후를 비교해 바뀐 것만 모은다 ──
  // 카드 문구는 게임 말(스킬·특성 칸) 대신 "카드에 새 칸" — 자라는 카드를 "자라는 주민증"으로 바꿀지는 따로 검토 중(11/16)
  function cardWords(t) {
    var JOSA = { '종이': '종이로', '나무': '나무로', '은': '은으로', '금': '금으로' };
    t = String(t || '');
    var m = /^(\S+) 테두리로 올라갔어요$/.exec(t);
    if (m) return '카드 테두리가 ' + (JOSA[m[1]] || m[1] + '(으)로') + ' 바뀌었어요';
    return t.replace(/(스킬|특성) 칸이 열렸어요/, '카드에 새 칸이 열렸어요').replace(/(스킬|특성) 칸이 열려요/, '카드에 새 칸이 열려요')
      .replace(/(\S+) 테두리가 돼요$/, '카드가 $1 테두리가 돼요');
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var receiptLi = null;
  function paintReceiptLine() {
    if (!receiptLi) return;
    var no = 'No.' + ('000' + walks.length).slice(-4);
    var head = answers.feel === 'short' ? '<b>일부 상환</b> (연체 아님)' : answers.feel === 'enough' ? '<b>오늘 산책 빚 상환 완료</b>' : '오늘 산책 빚 1회분';
    receiptLi.querySelector('span:last-child').innerHTML = head + ' · 저장하면 영수증(' + no + ')이 나와요';   // 숫자 뒤 조사가 갈리지 않게 괄호로
  }
  (function () {
    var R = window.RewardRules;
    if (!R || !R.dayGoal) return;
    var listEl = document.getElementById('ch-list'), nextEl = document.getElementById('ch-next');
    var before = walks.slice(0, -1), isRoute = walk.mode !== 'time';
    function add(tag, html, isNew) {
      var li = document.createElement('li');
      if (isNew) li.className = 'is-new';
      li.innerHTML = '<span class="tag">' + tag + '</span><span>' + html + '</span>';
      listEl.appendChild(li);
      return li;
    }
    // 1) 영수증 — "충분했나" 답에 따라 상환 문구가 바뀐다
    receiptLi = add('영수증', '');
    // 2) 오늘 목표 — 크기별(소 30·중 60·대 90분, 크기를 모르면 중형). 모자라도 혼내지 않는다
    var g = R.dayGoal(walks, walk.date), gb = R.dayGoal(before, walk.date);
    var sizeName = { small: '소형', medium: '중형', large: '대형' }[R.dogSize()] || '';
    if (g.reached && !gb.reached) add('목표', '<b>오늘 목표 달성!</b> ' + g.total + '분 · ' + sizeName + ' 목표 ' + g.target + '분', true);
    else if (g.reached) add('목표', '오늘 목표는 이미 달성 · 오늘 ' + g.total + '분');
    else add('목표', '오늘 ' + g.total + '분 · ' + sizeName + ' 목표 ' + g.target + '분까지 ' + g.left + '분');
    // 3) 꾸준함 도장(5분 이상 산책만 센다)
    if (R.steady && (walk.durationMin || 0) >= (R.STEADY_MIN_MINUTES || 5)) {
      var sa = R.steady(walks), sb = R.steady(before);
      if (sa.thisWeek.level > sb.thisWeek.level) add('꾸준함', '<b>이번 주 ' + sa.thisWeek.days + '일 도장 쾅!</b>', true);
      else add('꾸준함', '이번 주 ' + sa.thisWeek.days + '일째' + (sa.thisWeek.next ? ' · ' + sa.thisWeek.left + '일 더 걸으면 ' + sa.thisWeek.next + '일 도장' : ''));
    }
    // 4) 길 기록 — 새 발도장·카드 변화·다음 미션(예전 지도 위 보상 알림에 있던 것)
    var next = '';
    if (isRoute) {
      if (walk.rewardEligible === false) {
        add('길 기록', '5분·200m가 안 돼서 이번엔 발도장·카드에 안 들어갔어요');
      } else if (R.computeProgress && R.newUnlocks) {
        var pb = R.computeProgress(before), pa = R.computeProgress(walks);
        R.newUnlocks(pb, pa).forEach(function (t) {
          var isStamp = t.indexOf('발도장') >= 0;
          // 딱지가 이미 "카드"라 문장 앞의 "카드에/카드"는 뺀다 — [카드] 새 칸이 열렸어요
          var words = isStamp ? t : cardWords(t).replace(/^카드(에|가)? /, '');
          add(isStamp ? '발도장' : '카드', '<b>' + esc(words) + '</b>', true);
        });
        var mi = R.currentMission ? R.currentMission(pa) : null;
        next = (mi ? '다음 미션: ' + mi.place.name + (mi.place.kind === 'building' ? ' 앞까지' : '까지') + ' · ' : '') + '다음: ' + cardWords(R.nextGoalText(pa));
      }
      if (walk.gapMin >= 1) add('길 기록', '기록이 ' + walk.gapMin + '분 끊긴 구간은 걷는 속도면 직선으로 셌어요');
    } else {
      next = '길 기록으로 걸으면 발도장·카드도 자라요.';
    }
    if (next) { nextEl.textContent = next; nextEl.hidden = false; }
    document.getElementById('changed').hidden = false;
  })();

  // 답 고르기 — 같은 버튼을 다시 누르면 선택이 풀린다(전부 선택 사항)
  var answers = {};
  if (walk.feel) answers.feel = walk.feel;
  if (walk.sniff) answers.sniff = String(walk.sniff);
  if (walk.poop !== undefined) answers.poop = String(walk.poop);
  Array.prototype.forEach.call(document.querySelectorAll('.opts'), function (group) {
    var field = group.getAttribute('data-field');
    var buttons = group.querySelectorAll('button');
    function paint() {
      Array.prototype.forEach.call(buttons, function (b) {
        b.setAttribute('aria-pressed', answers[field] === b.getAttribute('data-value') ? 'true' : 'false');
      });
    }
    Array.prototype.forEach.call(buttons, function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-value');
        if (answers[field] === v) delete answers[field]; else answers[field] = v;
        paint();
        if (field === 'feel') paintReceiptLine();
      });
    });
    paint();
  });

  paintReceiptLine();

  // ── 오늘의 한 장 ──
  var photoBlob = null;          // 새로 고른 사진(아직 저장 전)
  var photoRemoved = false;      // 이미 있던 사진을 빼기로 했는지
  var photoImg = document.getElementById('photo-img');
  var photoPick = document.getElementById('photo-pick');
  var photoActions = document.getElementById('photo-actions');
  var photoInput = document.getElementById('photo-input');
  var previewUrl = null;
  function showPhoto(has) {
    photoImg.hidden = !has;
    photoPick.hidden = has;
    photoActions.hidden = !has;
  }
  function pickPhoto() { photoInput.click(); }
  photoPick.addEventListener('click', pickPhoto);
  document.getElementById('photo-change').addEventListener('click', pickPhoto);
  document.getElementById('photo-clear').addEventListener('click', function () {
    photoBlob = null;
    photoRemoved = true;
    showPhoto(false);
  });
  photoInput.addEventListener('change', function () {
    var file = photoInput.files[0];
    photoInput.value = '';
    if (!file || !window.WalkPhotos) return;
    WalkPhotos.shrink(file, 1080).then(function (blob) {
      photoBlob = blob;
      photoRemoved = false;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(blob);
      photoImg.src = previewUrl;
      showPhoto(true);
    }).catch(function (err) { alert('사진을 불러오지 못했어요: ' + err.message); });
  });
  // 이 산책에 이미 사진이 있으면(끝 화면에 다시 들어온 경우) 보여 준다
  if (walk.photoKey && window.WalkPhotos) {
    WalkPhotos.show(walk.photoKey, photoImg).then(function (ok) { showPhoto(ok); });
  }

  var saveBtn = document.getElementById('save-btn');
  saveBtn.addEventListener('click', function () {
    saveBtn.disabled = true;
    // 사진부터 휴대폰 안 저장소에 넣고, 기록에는 열쇠만 적는다
    var key = (walk.photoKey && !photoRemoved) ? walk.photoKey : null;
    var step = Promise.resolve();
    if (photoBlob && window.WalkPhotos) {
      key = walk.photoKey || WalkPhotos.newKey();
      step = WalkPhotos.put(key, photoBlob).catch(function (err) {
        key = null;
        alert('사진은 저장하지 못했어요(' + err.message + '). 나머지는 저장할게요.');
      });
    } else if (photoRemoved && walk.photoKey && window.WalkPhotos) {
      step = WalkPhotos.remove(walk.photoKey).catch(function () { /* 지우지 못해도 기록에서는 뺀다 */ });
    }
    step.then(function () {
      // 다른 탭에서 기록이 바뀌었을 수 있으니 다시 읽어 마지막 기록에 붙인다
      var latest = loadJSON(WALKS_KEY, []);
      var target = latest.length ? latest[latest.length - 1] : null;
      if (target) {
        if (answers.feel) target.feel = answers.feel; else delete target.feel;
        if (answers.sniff) target.sniff = Number(answers.sniff); else delete target.sniff;
        if (answers.poop !== undefined) target.poop = Number(answers.poop); else delete target.poop;
        if (key) target.photoKey = key; else delete target.photoKey;
        try { localStorage.setItem(WALKS_KEY, JSON.stringify(latest)); } catch (e) {
          saveBtn.disabled = false;
          alert('저장하지 못했어요. 저장 공간을 확인해 주세요.');
          return;
        }
      }
      // 방금 산책 영수증으로([기록] 탭이 end=1을 보고 맨 마지막 산책 영수증을 열고 안내 한 줄을 띄운다)
      location.replace('walk-history.html?end=1');
    });
  });
})();
</script>

</html>
