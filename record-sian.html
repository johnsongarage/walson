<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[기록] 리포트 시안</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<meta name="theme-color" content="#fffdfd">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="store.js?v=1"></script>
<style>
  /* [기록] 이달 리포트 시안(2026-11-20, 가르시아 "시안을 그려보자" · "다른 데서 구해 온 걸 보여 줘도 좋아. 그러면서 쌓아 가는 것도 좋아").
     메뉴에 없고 주소로만 연다. 실제 [기록](walk-history.html)은 그대로다.
     비교는 셋: ① 지난달의 나(이 휴대폰 기록) ② 바깥 평균(펫핑 산책 기록 21만 건 · KB경영연구소 2025 — 출처 한 줄) ③ 왈슨 소형견 평균(통계 시트에 쌓이는 중, 모이면).
     바깥 자료는 크기 구분이 없어서 "또래 소형견"이라고 쓰지 않는다(hq notes/petwalk-town-uiux-review.md). 색은 theme.js 변수만. */
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); }
  button { font: inherit; color: inherit; }
  .band { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none;
    padding: calc(env(safe-area-inset-top) + 6px) 10px 6px; background: var(--ink); color: var(--bg); }
  .band::-webkit-scrollbar { display: none; }
  .band b { flex: none; font-size: 12px; font-weight: 800; }
  .band button { flex: none; white-space: nowrap; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor;
    background: transparent; color: var(--bg); opacity: 0.85; cursor: pointer; }
  .band button[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); color: var(--hl-ink); opacity: 1; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 14px 14px 100px; }
  h1 { margin: 6px 2px 12px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .card { border: 1.5px solid var(--line); border-radius: 20px; background: var(--panel); padding: 16px; box-shadow: 0 3px 0 var(--line); margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
  .card h2 small { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .score { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 12px; border-radius: 14px; background: var(--accent-tint); }
  .score div { text-align: center; }
  .score b { display: block; font-size: 24px; font-weight: 900; letter-spacing: -0.02em; }
  .score b small { font-size: 13px; font-weight: 800; margin-left: 1px; }
  .score span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .me { display: flex; align-items: center; gap: 12px; margin: 14px 2px 4px; }
  .me .up { flex: none; min-width: 64px; padding: 6px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--hl); color: var(--hl-ink); text-align: center; font-size: 18px; font-weight: 900; }
  .me .up.down { background: var(--panel); color: var(--ink); }
  .me p { margin: 0; font-size: 14px; line-height: 1.5; word-break: keep-all; }
  .me p b { font-weight: 800; }
  .me p span { color: var(--ink-soft); font-size: 12.5px; }
  .sec { margin: 16px 2px 8px; font-size: 12.5px; font-weight: 800; color: var(--ink-soft); }
  .bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 62px; align-items: center; gap: 8px; margin: 8px 2px; }
  .bar .nm { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .tr { height: 14px; border-radius: 7px; background: var(--bg); border: 1px solid var(--panel-border); overflow: hidden; }
  .bar .tr i { display: block; height: 100%; border-radius: 7px; background: var(--hl); }
  .bar.ref .tr i { background: var(--ink-soft); opacity: 0.55; }
  .bar .v { text-align: right; font-size: 13px; font-weight: 800; white-space: nowrap; }
  .src { margin: 2px 2px 0 102px; font-size: 11.5px; line-height: 1.45; color: var(--ink-soft); }
  .line { margin: 12px 2px 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--panel-border); font-size: 13.5px; line-height: 1.5; word-break: keep-all; }
  .line b { font-weight: 800; }
  .line small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--ink-soft); }
  .wait { margin: 12px 2px 0; padding: 10px 12px; border-radius: 12px; border: 1.5px dashed var(--panel-border); font-size: 13px; line-height: 1.5; color: var(--ink-soft); word-break: keep-all; }
  .wait b { color: var(--ink); }
  .note { margin: 12px 2px 0; font-size: 12px; line-height: 1.55; color: var(--ink-soft); word-break: keep-all; }
  .why { font-size: 12.5px; line-height: 1.6; color: var(--ink-soft); }
  .why b { color: var(--ink); }
</style>
<link rel="stylesheet" href="theme-black.css?v=1"><script src="theme.js?v=14"></script>
<script src="site-config.js?v=10"></script>
</head>
<body>
<div class="band" id="band" role="group" aria-label="시안 숫자 바꾸기">
  <b>[기록] 리포트 시안</b>
  <button type="button" data-m="ex" aria-pressed="true">예시 숫자</button>
  <button type="button" data-m="mine" aria-pressed="false">이 휴대폰 기록</button>
</div>
<div class="wrap">
  <h1 id="title">11월 산책 리포트</h1>
  <section class="card" id="report"></section>
  <section class="card why">
    <b>시안에서 정한 것(제안)</b><br>
    · 맨 위 비교는 <b>지난달의 나</b> — 기록만 있으면 지금 바로 돼요.<br>
    · 바깥 평균은 <b>참고 한 줄 + 출처</b>. 크기 구분이 없는 자료라 "또래 소형견"이라고 쓰지 않아요.<br>
    · 왈슨 소형견 평균은 통계에 이미 쌓이는 것(산책 시간 구간·강아지 크기)으로 계산해서, 모이면 바깥 평균 자리를 대신해요.<br>
    · 거리는 길 기록 산책만 있어서 비교에서 뺐어요.
  </section>
</div>
<script src="tabbar.js?v=10" data-tab="history"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  // 바깥 자료(원문 확인 2026-11-20 — hq notes/petwalk-town-uiux-review.md)
  var REF = {
    appMin: 51, appSrc: '펫핑 산책 기록 21만 건(2021.6~2022.6, 스몰티켓 「2022 반려견 라이프스타일 트렌드 리포트」)',
    week4: 59.3, weekSrc: 'KB경영연구소 「2025 한국 반려동물 보고서」 — 산책·달리기·훈련 같은 실외 활동, 설문'
  };
  var OWN_MIN_DOGS = 30;   // 왈슨 소형견 평균은 이만큼 모이면(최근 4주) 보여 준다 — 제안

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  // 이 휴대폰 기록으로 계산 — 5분 이상 기록만(11/17 주민증 성장 기준과 같음)
  function fromWalks(walks, y, m) {
    var mine = walks.filter(function (w) { return w && w.date && (w.durationMin || 0) >= 5; });
    function monthStats(yy, mm) {
      var pre = yy + '-' + pad(mm + 1) + '-';
      var list = mine.filter(function (w) { return w.date.indexOf(pre) === 0; });
      var days = {}; list.forEach(function (w) { days[w.date] = (days[w.date] || 0) + (w.durationMin || 0); });
      var dk = Object.keys(days).sort(), mins = dk.reduce(function (s, k) { return s + days[k]; }, 0);
      var best = 0, run = 0, prev = null;
      dk.forEach(function (k) {
        var d = new Date(k + 'T00:00:00'); var p = prev ? new Date(prev + 'T00:00:00') : null;
        run = p && (d - p) === 86400000 ? run + 1 : 1; best = Math.max(best, run); prev = k;
      });
      var km = list.reduce(function (s, w) { return s + (w.mode === 'time' || w.logged ? 0 : (w.distanceKm || 0)); }, 0);
      var now = new Date(), last = (yy === now.getFullYear() && mm === now.getMonth()) ? now.getDate() : new Date(yy, mm + 1, 0).getDate();
      return { count: list.length, km: km, streak: best, days: dk.length, perDay: dk.length ? Math.round(mins / dk.length) : 0, perWeek: dk.length ? dk.length / (last / 7) : 0 };
    }
    var cur = monthStats(y, m), pm = m === 0 ? 11 : m - 1, py = m === 0 ? y - 1 : y;
    return { cur: cur, prev: monthStats(py, pm) };
  }
  var EX = { cur: { count: 17, km: 5.4, streak: 5, days: 14, perDay: 38, perWeek: 4.9 }, prev: { count: 13, km: 3.1, streak: 3, days: 11, perDay: 33, perWeek: 3.6 } };

  function render(mode) {
    var now = new Date(), y = now.getFullYear(), m = now.getMonth();
    var walks = (window.WalsonStore && WalsonStore.walks()) || [];
    var s = mode === 'ex' ? EX : fromWalks(walks, y, m);
    var prof = (window.WalsonStore && WalsonStore.profile()) || {};
    var dog = mode === 'ex' ? '초코' : (prof.name || '우리 애');
    $('title').textContent = (m + 1) + '월 산책 리포트';
    var c = s.cur, p = s.prev, html = '';
    html += '<h2>이달의 성적표 <small>' + (m + 1) + '월 1일 ~ ' + (mode === 'ex' ? '20' : now.getDate()) + '일</small></h2>' +
      '<div class="score"><div><b>' + c.count + '<small>회</small></b><span>산책</span></div>' +
      '<div><b>' + (c.km ? c.km.toFixed(1) : '0') + '<small>km</small></b><span>길 기록</span></div>' +
      '<div><b>' + c.streak + '<small>일</small></b><span>연속</span></div></div>';
    // ① 지난달의 나
    if (!c.days) html += '<div class="me"><span class="up down">—</span><p>이번 달 기록이 아직 없어요.<br><span>5분 이상 산책을 적으면 여기 나와요.</span></p></div>';
    else if (!p.days) html += '<div class="me"><span class="up down">첫 달</span><p>산책한 날 하루 평균 <b>' + c.perDay + '분</b><br><span>지난달 기록이 없어서 다음 달부터 비교해요.</span></p></div>';
    else {
      var diff = Math.round((c.perDay - p.perDay) / Math.max(1, p.perDay) * 100);
      html += '<div class="me"><span class="up' + (diff < 0 ? ' down' : '') + '">' + (diff >= 0 ? '▲' : '▼') + Math.abs(diff) + '%</span><p>' +
        (diff >= 0 ? '지난달보다 <b>' + diff + '% 더</b> 걸었어요' : '지난달보다 조금 쉬어 갔어요') +
        '<br><span>산책한 날 하루 평균 ' + c.perDay + '분 · 지난달 ' + p.perDay + '분</span></p></div>';
    }
    // ② 바깥 평균(참고) — 막대 하나 + 출처
    var max = Math.max(REF.appMin, c.perDay, 1);
    html += '<p class="sec">참고 · 다른 강아지들은</p>' +
      '<div class="bar"><span class="nm">' + esc(dog) + '</span><span class="tr"><i style="width:' + Math.round(c.perDay / max * 100) + '%"></i></span><span class="v">' + c.perDay + '분</span></div>' +
      '<div class="bar ref"><span class="nm">산책 앱 평균</span><span class="tr"><i style="width:' + Math.round(REF.appMin / max * 100) + '%"></i></span><span class="v">' + REF.appMin + '분</span></div>' +
      '<p class="src">하루 평균(산책한 날) · ' + esc(REF.appSrc) + '</p>';
    var pw = c.perWeek ? (Math.round(c.perWeek * 10) / 10) : 0;
    html += '<div class="line">이번 달 <b>주 ' + pw + '일</b> 산책 — ' +
      (pw >= 4 ? '주 4일 이상 걷는 반려견 가구(<b>' + REF.week4 + '%</b>) 쪽이에요' : '주 4일 이상 걷는 반려견 가구는 ' + REF.week4 + '%예요') +
      '<small>' + esc(REF.weekSrc) + '</small></div>';
    // ③ 왈슨 소형견 평균 — 쌓이는 중
    html += '<div class="wait"><b>왈슨 소형견 평균</b> — 모이는 중이에요. 소형견 ' + OWN_MIN_DOGS + '마리 기록이 모이면 여기 보여 줘요.</div>';
    html += '<p class="note">바깥 평균은 크기 구분 없는 숫자예요. 소형견은 산책 시간이 더 짧아도 괜찮아요 — 비교보다 지난달의 나를 보세요.</p>';
    $('report').innerHTML = html;
  }
  Array.prototype.forEach.call($('band').querySelectorAll('[data-m]'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call($('band').querySelectorAll('[data-m]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render(b.getAttribute('data-m'));
    });
  });
  render('ex');
})();
</script>
</body>
</html>
