<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프로필</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="왈슨">
<meta name="theme-color" content="#f7ede2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    /* index.html/walk-history.html과 동일한 색 토큰 */
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-tint: #f3ddd2;
    --shadow-rgb: 74, 63, 53;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  body { padding: 16px 16px 32px; }
  .wrap { max-width: 420px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .topbar a {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 12px; text-decoration: none;
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--ink);
    box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.1);
  }
  .topbar h1 { font-weight: 800; font-size: 20px; margin: 0; letter-spacing: -0.01em; }

  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px;
    padding: 24px 20px; box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.1);
  }

  .photo-picker { display: flex; justify-content: center; margin-bottom: 22px; }
  .photo-btn {
    position: relative; width: 108px; height: 108px; border-radius: 50%;
    background: var(--accent-tint); border: 2px dashed var(--panel-border);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    overflow: hidden; padding: 0;
  }
  .photo-btn img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .photo-btn .placeholder { font-size: 30px; color: var(--accent); }
  .photo-btn .edit-badge {
    position: absolute; bottom: 2px; right: 2px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; border: 2px solid var(--panel);
  }
  #photo-input { display: none; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; font-family: 'Pretendard', sans-serif; font-size: 15px; padding: 11px 12px;
    border: 1px solid var(--panel-border); border-radius: 10px; color: var(--ink); background: #fff;
  }

  .btn-save {
    width: 100%; border: none; border-radius: 999px; padding: 14px; margin-top: 6px;
    background: linear-gradient(180deg, #c96b4f 0%, var(--accent) 100%); color: #fff;
    font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.15), 0 6px 16px rgba(var(--shadow-rgb), 0.3);
  }
  .btn-save:active { transform: scale(0.98); }

  .hint { font-size: 12px; color: var(--ink-soft); line-height: 1.6; margin: 14px 2px 0; }
  .saved-toast {
    text-align: center; font-size: 13px; font-weight: 700; color: var(--accent);
    margin-top: 10px; opacity: 0; transition: opacity 0.3s ease;
  }
  .saved-toast.show { opacity: 1; }
  /* 화면 테마 고르기(2026-11-15) — 미리보기 조각은 테마와 상관없이 각 테마 모양 그대로 보여 준다 */
  .theme-card { margin-top: 16px; }
  .theme-card h2 { font-size: 15px; font-weight: 800; margin: 0 0 4px; }
  .theme-card .sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; line-height: 1.5; }
  .theme-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .theme-opt {
    font-family: 'Pretendard', sans-serif; text-align: left; cursor: pointer; padding: 10px;
    background: #fff; border: 2px solid var(--panel-border); border-radius: 14px; color: var(--ink);
  }
  .theme-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-tint); }
  .theme-opt .name { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 800; margin-top: 8px; }
  .theme-opt .name .on { font-size: 11px; font-weight: 800; color: var(--accent); }
  .theme-opt .desc { display: block; font-size: 11px; color: var(--ink-soft); line-height: 1.4; margin-top: 3px; }
  .theme-swatch { height: 64px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
  .theme-swatch i { display: block; height: 14px; }
  .theme-swatch.soft { background: #f7ede2; border-radius: 10px; }
  .theme-swatch.soft i:first-child { width: 70%; background: #fffaf3; border: 1px solid #e6d6c1; border-radius: 6px; box-shadow: 0 2px 6px rgba(74,63,53,0.15); }
  .theme-swatch.soft i:last-child { width: 45%; background: #b8563a; border-radius: 999px; }
  .theme-swatch.brutal { background: #F2B833; border: 2px solid #000; }
  .theme-swatch.brutal i:first-child { width: 70%; background: #fff; border: 2px solid #000; box-shadow: 3px 3px 0 #000; }
  .theme-swatch.brutal i:last-child { width: 45%; background: #FF6BB5; border: 2px solid #000; }
</style>
<script src="theme.js?v=6"></script>
<script src="walk-photos.js?v=1"></script>
<script src="sample-data.js?v=5"></script>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="index.html" title="오늘로 돌아가기">←</a>
    <h1>프로필</h1>
  </div>

  <div class="card">
    <div class="photo-picker">
      <button type="button" class="photo-btn" id="photo-btn">
        <img id="photo-preview" alt="">
        <span class="placeholder" id="photo-placeholder" style="font-size:14px;font-weight:900;">사진</span>
        <span class="edit-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></span>
      </button>
      <input type="file" id="photo-input" accept="image/*">
    </div>

    <div class="field">
      <label for="f-name">이름</label>
      <input id="f-name" placeholder="코코" maxlength="20">
    </div>

    <div class="field">
      <label for="f-size">크기 (추천 루트 예상 시간에 쓰여요)</label>
      <select id="f-size">
        <option value="small">소형견 (말티즈·포메라니안·치와와 등)</option>
        <option value="medium" selected>중형견 (비글·시바견·웰시코기 등)</option>
        <option value="large">대형견 (리트리버·진돗개·허스키 등)</option>
      </select>
    </div>

    <!-- 성향 신호등(2026-11-14, 기획표 V4-04): 주민증 카드·키링 테두리 색으로 쓴다. 지도 노출과는 잇지 않는다. -->
    <div class="field">
      <label for="f-signal">산책 신호등 (다른 강아지를 만났을 때)</label>
      <select id="f-signal">
        <option value="">아직 안 골랐어요</option>
        <option value="green">초록불 · 다가와도 좋아요</option>
        <option value="yellow">노랑불 · 천천히 인사해요</option>
        <option value="red">빨강불 · 눈으로만 예뻐해 주세요</option>
      </select>
    </div>

    <button class="btn-save" id="save-btn">프로필 저장</button>
    <div class="saved-toast" id="toast">저장됐어요!</div>
  </div>


  <!-- 화면 테마(2026-11-15): theme.js가 이 기기에 저장한 값을 읽어 모든 화면에 적용한다 -->
  <div class="card theme-card" id="theme">
    <h2>화면 테마</h2>
    <p class="sub">앱 전체 화면 모양을 바꿔요. 이 기기에만 저장되고, 고르면 바로 다시 그려져요.</p>
    <div class="theme-opts" id="theme-opts">
      <button type="button" class="theme-opt" data-theme-key="soft" aria-pressed="false">
        <span class="theme-swatch soft"><i></i><i></i></span>
        <span class="name">차분 <span class="on" hidden>사용 중</span></span>
        <span class="desc">크림색 바탕, 둥근 모서리</span>
      </button>
      <button type="button" class="theme-opt" data-theme-key="brutal" aria-pressed="false">
        <span class="theme-swatch brutal"><i></i><i></i></span>
        <span class="name">뉴브루탈 <span class="on" hidden>사용 중</span></span>
        <span class="desc">노랑 바탕, 굵은 검정 테두리</span>
      </button>
    </div>
  </div>

  <p class="hint">
    로그인 없이 이 기기에만 저장돼요(다른 기기와는 공유되지 않아요). 견주 이름은 따로 받지
    않고, 반려동물 정보만 등록합니다.
    <a href="start.html" style="color: var(--accent); font-weight: 700;">주민증 카드 만들기</a> ·
    <a href="privacy.html" style="color: var(--ink-soft);">개인정보 안내</a>
  </p>
</div>

<script>
(function () {
  var PROFILE_KEY = 'petwalk_profile'; // index.html이 견종 크기 기본값으로 같이 읽어감

  var photoBtn = document.getElementById('photo-btn');
  var photoInput = document.getElementById('photo-input');
  var photoPreview = document.getElementById('photo-preview');
  var photoPlaceholder = document.getElementById('photo-placeholder');
  var fName = document.getElementById('f-name');
  var fSize = document.getElementById('f-size');
  var fSignal = document.getElementById('f-signal');
  var saveBtn = document.getElementById('save-btn');
  var toast = document.getElementById('toast');

  var photoDataUrl = null;

  function loadProfile() {
    try { return JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch (e) { return null; }
  }

  function showPhoto(dataUrl) {
    if (!dataUrl) {
      photoPreview.style.display = 'none';
      photoPlaceholder.style.display = 'block';
      return;
    }
    photoPreview.src = dataUrl;
    photoPreview.style.display = 'block';
    photoPlaceholder.style.display = 'none';
  }

  var existing = loadProfile();
  if (existing) {
    fName.value = existing.name || '';
    if (existing.size) fSize.value = existing.size;
    if (existing.signal) fSignal.value = existing.signal;
    photoDataUrl = existing.photo || null;
    showPhoto(photoDataUrl);
  }

  photoBtn.addEventListener('click', function () { photoInput.click(); });

  // 원본 사진을 그대로 localStorage에 넣으면 용량이 금방 커지니(localStorage는 보통
  // 5~10MB 한도), 캔버스로 축소해서 저장한다 — 프로필 원형 썸네일 정도로만 쓰이므로
  // 240px면 충분히 선명함.
  function resizeImageFile(file, maxDim) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = function () { reject(new Error('이미지를 읽지 못했습니다')); };
        img.src = e.target.result;
      };
      reader.onerror = function () { reject(new Error('파일을 읽지 못했습니다')); };
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', function () {
    var file = photoInput.files[0];
    if (!file) return;
    resizeImageFile(file, 240).then(function (dataUrl) {
      photoDataUrl = dataUrl;
      showPhoto(photoDataUrl);
    }).catch(function (err) {
      alert('사진을 불러오지 못했습니다: ' + err.message);
    });
  });

  saveBtn.addEventListener('click', function () {
    // 샘플을 보는 중이면 먼저 끄게 한다(2026-11-15) — 샘플을 켠 채 저장한 프로필은 샘플을 끌 때 되돌아가므로
    if (window.PetwalkSample && PetwalkSample.isOn()) {
      PetwalkSample.leaveForRealRecord('프로필을 저장하면').then(function (ok) { if (ok) saveProfileNow(); });
      return;
    }
    saveProfileNow();
  });
  function saveProfileNow() {
    // start.html이 같이 저장해 둔 값(카드 번호·발급일)을 지우지 않게 기존 프로필 위에 덮어쓴다
    var profile = loadProfile() || {};
    profile.name = fName.value.trim();
    profile.size = fSize.value;
    // 샘플 강아지(왈슨) 그림이 그대로 남아 있으면 내 강아지 사진으로 저장하지 않는다
    profile.photo = (photoDataUrl && photoDataUrl.indexOf('icons/sample-') === 0) ? null : photoDataUrl;
    if (fSignal.value) profile.signal = fSignal.value; else delete profile.signal;
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 1800);
    } catch (e) {
      alert('저장에 실패했습니다(사진 용량이 너무 클 수 있어요): ' + e.message);
    }
  }
})();
</script>

<script>
// 화면 테마 고르기 — 실제 적용·저장은 theme.js(WalsonTheme.set)가 한다
(function () {
  var T = window.WalsonTheme;
  var opts = document.querySelectorAll('#theme-opts .theme-opt');
  Array.prototype.forEach.call(opts, function (btn) {
    var key = btn.getAttribute('data-theme-key');
    var on = !!T && T.name === key;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.querySelector('.on').hidden = !on;
    btn.addEventListener('click', function () { if (T) T.set(key); });
  });
})();
</script>
</body>
</html>
