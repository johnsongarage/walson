<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방문 도장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<meta name="theme-color" content="#f7ede2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  /* 가게 방문 도장(2026-11-15, ② 방문 연결). 가게 카운터의 체크인 QR(checkin-qr.html이 인쇄)을 찍으면 이 화면이 열린다.
     주소: visit.html?s=<스팟 id>. 스팟 편집으로 올린 동반 스팟만 받는다.
     - 이 휴대폰에 방문 기록(petwalk_visits)을 남긴다 — 같은 가게는 하루 한 번만.
     - 사용 통계(track.js)로 store_visit(가게 번호)을 보낸다 → 시트 "가게 방문"에서 가게별 방문 기기 수를 본다.
       위치(GPS)는 읽지 않는다. 손님이 직접 가게의 QR을 찍었다는 사실만 남는다. */
  :root {
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-tint: #f3ddd2; --ok: #3f7d4a;
    --shadow-rgb: 74, 63, 53;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); }
  body { padding: 20px 16px 32px; }
  .wrap { max-width: 420px; margin: 0 auto; text-align: center; }
  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 20px; padding: 26px 20px; box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.1); }
  .shop { font-size: 15px; font-weight: 800; color: var(--ink-soft); margin: 0; }
  .stamp {
    width: 170px; height: 170px; margin: 16px auto 12px; border-radius: 50%; border: 7px solid #d2493f; color: #d2493f;
    display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-8deg);
    box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 6px #d2493f; animation: stamp-in 0.45s cubic-bezier(.2,1.6,.4,1) both;
  }
  .stamp b { font-family: 'Black Han Sans', 'Pretendard', sans-serif; font-size: 34px; line-height: 1; }
  .stamp span { font-size: 13px; font-weight: 800; margin-top: 6px; }
  @keyframes stamp-in { from { transform: rotate(-8deg) scale(1.8); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stamp { animation: none; } }
  h1 { font-size: 22px; font-weight: 900; margin: 6px 0 4px; }
  .sub { font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin: 0; }
  .count { font-size: 13px; font-weight: 800; color: var(--ok); margin: 12px 0 0; }
  .app-hint { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-tint); word-break: keep-all; text-align: left; }
  .btn-main {
    display: block; width: 100%; border: none; border-radius: 999px; padding: 15px; margin-top: 16px; text-decoration: none;
    background: linear-gradient(180deg, #c96b4f 0%, var(--accent) 100%); color: #fff; font-family: inherit; font-weight: 800; font-size: 16px;
    box-shadow: 0 6px 16px rgba(var(--shadow-rgb), 0.3);
  }
  .btn-sub { display: block; width: 100%; border-radius: 999px; padding: 13px; margin-top: 10px; text-decoration: none; background: var(--panel); color: var(--ink); border: 1px solid var(--panel-border); font-weight: 800; font-size: 15px; }
  .fine { font-size: 12px; color: var(--ink-soft); line-height: 1.6; margin: 16px 4px 0; }
  .fine a { color: var(--ink-soft); }
  [hidden] { display: none !important; }
</style>
<script src="theme.js?v=9"></script>
<script src="site-config.js?v=4"></script>
<script src="inapp.js?v=2"></script>
<script src="track.js?v=6"></script>
<script src="spots-data.js"></script>
<script src="infra-pins.js?v=20"></script>
<script src="shop-visits.js?v=3"></script>
</head>
<body>

<div class="wrap">
  <div class="card" id="ok-card" hidden>
    <p class="shop" id="shop"></p>
    <div class="stamp" aria-hidden="true"><b>방문</b><span id="stamp-date"></span></div>
    <h1 id="title">방문 도장을 찍었어요</h1>
    <p class="sub" id="sub"></p>
    <p class="count" id="count"></p>
    <p class="app-hint" id="app-hint" hidden>왈슨을 홈 화면 앱으로 쓰고 있다면 이 도장이 앱에는 안 보일 수 있어요. 휴대폰 카메라로 찍으면 브라우저 쪽에 남거든요. 앱을 열어 [동네] → <b>QR 찍기</b>로 한 번 더 찍어 주세요.</p>
  </div>

  <div class="card" id="bad-card" hidden>
    <h1>등록되지 않은 가게 QR이에요</h1>
    <p class="sub">QR이 오래됐거나 잘못 찍혔을 수 있어요. 가게에 알려 주세요.</p>
  </div>

  <a class="btn-main" id="cta-card" href="start.html" hidden>30초 만에 우리 강아지 주민증 만들기</a>
  <a class="btn-sub" href="town.html">동네 지도 보기</a>
  <a class="btn-sub" href="index.html">왈슨 처음 화면</a>
  <p class="fine">방문 도장은 이 휴대폰에만 남고, 위치는 읽지 않아요. 몇 명이 다녀갔는지는 익명 사용 통계로만 셉니다.
    <a href="privacy.html#stats">개인정보 안내</a></p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var now = new Date();

  // 카톡으로 QR을 찍어 바깥 브라우저로 넘기는 중이면 여기(카톡 창)엔 도장을 남기지 않는다 — 넘어간 쪽에서 찍힌다(inapp.js)
  if (window.WalsonInApp && WalsonInApp.escaped) return;
  var m = location.search.match(/[?&]s=([^&#]+)/);
  var id = m ? decodeURIComponent(m[1]) : '';
  var spot = ShopVisits.findShop(id);
  if (!spot) { $('bad-card').hidden = false; return; }

  // 도장 찍기·통계(가게 번호만, 하루 한 번)는 shop-visits.js 한 곳에서 — 앱 안 QR 찍기와 같은 셈(2026-11-16)
  var r = ShopVisits.stamp(id);

  $('ok-card').hidden = false;
  $('shop').textContent = spot.name || '우리 동네 가게';
  $('stamp-date').textContent = (now.getMonth() + 1) + '.' + now.getDate();
  $('title').textContent = r.already ? '오늘 도장은 이미 찍었어요' : '방문 도장을 찍었어요';
  $('sub').textContent = '강아지와 함께 들러 주셔서 고마워요.';
  // 단골 Lv(2026-11-15) — [동네] 지도의 가게 팝업·목록과 같은 셈(shop-visits.js): 처음 1번 Lv1, 5번마다 Lv↑
  $('count').textContent = ShopVisits.countText(r);

  var profile = {};
  try { profile = JSON.parse(localStorage.getItem('petwalk_profile')) || {}; } catch (e) { profile = {}; }
  var sampleOn = false;
  try { sampleOn = localStorage.getItem('petwalk_sample_mode') === '1'; } catch (e) { sampleOn = false; }
  if (!profile.cardNo || sampleOn) $('cta-card').hidden = false;   // 처음 온 손님은 주민증 만들기로
  // 홈 화면 앱이 아닌 곳(휴대폰 카메라 → 사파리·크롬)에서 열렸고 이 브라우저엔 주민증이 없으면 —
  // 앱을 따로 쓰는 사람일 수 있다(저장 공간이 따로라 도장이 앱에 안 보임). 앱 안에서 다시 찍게 알려 준다(2026-11-16)
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (!standalone && !profile.cardNo && !sampleOn) $('app-hint').hidden = false;
})();
</script>
</body>
</html>
