<style>
  /* [동네] 개편 시안(2026-11-20, 가르시아 "시안을 그려보자") — 가르시아 개편안 + Claude 검토(hq notes/petwalk-town-uiux-review.md)의 1단계.
     메뉴에 없고 주소로만 연다. 실제 [동네](town.html)는 그대로다. 지도·핀·데이터는 진짜(spots-data.js · reward-rules.js PLACES).
     바꿔 본 것: 위 한 줄 칩(전체 · 지킴이·가게 · 공원·코스 · 급할 때), 같은 장소는 카드 하나(미션 장소 + 동반 가게),
     핀을 누르면 아래 시트가 그 장소 카드로, 오른쪽 아래에 내 위치 · QR · 산책, 면책 문구는 급할 때에만,
     지킴이 0곳일 때 빈 화면(위 띠로 예시 보기), "미션" 대신 "동네 스팟"(선물 상자 / 사진 핀 비교).
     라이브 배너("지금 ○마리가 기다려요")는 넣지 않았다 — 확인할 수 없는 말이라(검토 노트).
     내 위치는 읽지 않는다 — 거리는 시트 위로 보이는 지도의 가운데에서 잰다. 색은 theme.js 변수만 쓴다(젤리 블랙에서도 보이게). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); }
  body { overflow: hidden; }
  button { font: inherit; color: inherit; }
  #map { position: fixed; top: 0; left: 0; right: 0; bottom: var(--tabbar-h, 58px); background: var(--bg); }
  .leaflet-container { font-family: inherit; background: var(--bg); }
  .leaflet-bottom { bottom: var(--sheet-h, 0px); }

  /* ── 시안 띠(맨 위) — 상태를 바꿔 본다 ── */
  .band { position: fixed; top: 0; left: 0; right: 0; z-index: 1300; display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none;
    padding: calc(env(safe-area-inset-top) + 6px) 10px 6px; background: var(--ink); color: var(--bg); }
  .band::-webkit-scrollbar { display: none; }
  .band b { flex: none; font-size: 12px; font-weight: 800; }
  .band button { flex: none; white-space: nowrap; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor;
    background: transparent; color: var(--bg); opacity: 0.85; cursor: pointer; }
  .band button[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); color: var(--hl-ink); opacity: 1; }

  /* ── 위 한 줄 칩 ── */
  /* 보통 폰(390px)에서 넷이 한 줄에 다 들어가게 — 더 좁은 폰은 옆으로 밀어서 */
  .chips { position: fixed; left: 0; right: 0; z-index: 1000; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding: 2px 12px 8px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 10px 0 8px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font-size: 13px; font-weight: 800; letter-spacing: -0.01em; box-shadow: 0 2px 0 var(--line); cursor: pointer; }
  .chip svg { width: 15px; height: 15px; flex: none; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .chip.sos { color: var(--accent); }
  .chip.sos[aria-pressed="true"] { background: var(--accent); border-color: var(--line); color: var(--panel); }
  .chip:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--line); }

  /* ── 오른쪽 아래: 내 위치 · QR · 산책(엄지 자리) ── */
  .fabs { position: fixed; right: 12px; z-index: 1050; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; transition: bottom 0.22s ease; }
  .rb { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 var(--line), 0 4px 12px rgba(var(--shadow-rgb), 0.16); cursor: pointer; }
  .rb svg { width: 22px; height: 22px; }
  .walk { width: 66px; height: 66px; border-radius: 50%; border: 2px solid var(--line); background: var(--hl); color: var(--hl-ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 13px; font-weight: 900;
    box-shadow: 0 3px 0 var(--line), 0 6px 16px rgba(var(--shadow-rgb), 0.22); cursor: pointer; }
  .walk svg { width: 24px; height: 24px; }

  /* ── 아래 시트: 접힘(가까운 곳 하나) · 반(목록) · 카드(장소 하나) ── */
  .sheet { position: fixed; left: 0; right: 0; bottom: var(--tabbar-h, 58px); z-index: 1100; display: flex; flex-direction: column;
    background: var(--panel); border-top: 1.5px solid var(--line); border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(var(--shadow-rgb), 0.16);
    overflow: hidden; transition: height 0.22s ease; }
  @media (min-width: 700px) { .sheet { left: 50%; right: auto; width: 480px; transform: translateX(-50%); border-left: 1.5px solid var(--line); border-right: 1.5px solid var(--line); } }
  .grab { flex: none; display: flex; justify-content: center; padding: 8px 0 6px; cursor: pointer; }
  .grab i { width: 40px; height: 5px; border-radius: 3px; background: var(--panel-border); }
  .sh-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px 8px; }
  .sh-head b { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--accent-tint); color: var(--ink); font-size: 12.5px; font-weight: 800; cursor: pointer; }
  .pill svg { width: 14px; height: 14px; color: var(--accent); }
  .x { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--panel-border); background: var(--panel); font-size: 18px; line-height: 1; cursor: pointer; }
  .sh-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 14px 16px; }

  /* 장소 줄(접힘의 '가까운 곳'·목록) */
  .pc { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 10px 12px; margin: 0 0 8px;
    border: 1.5px solid var(--line); border-radius: 16px; background: var(--panel); text-align: left; cursor: pointer; box-shadow: 0 2px 0 var(--line); }
  .pc:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--line); }
  .pc.flat { border: none; border-bottom: 1px solid var(--panel-border); border-radius: 0; box-shadow: none; margin: 0; padding: 10px 2px; }
  .ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .ic svg { width: 22px; height: 22px; }
  .ic.spot { background: var(--hl); color: var(--hl-ink); border: 1.5px solid var(--line); }
  .ic.round { border-radius: 50%; color: #fff; }
  .pc b { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--panel-border); color: var(--ink); white-space: nowrap; }
  .tag i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .tag.got { background: var(--accent-tint); border-color: var(--accent-tint); color: var(--accent); }
  .tag.ex { border-style: dashed; color: var(--ink-soft); }
  .sub { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dist { text-align: right; font-size: 13px; font-weight: 800; white-space: nowrap; }
  .dist small { display: block; font-size: 11px; font-weight: 600; color: var(--ink-soft); }
  .sec-t { margin: 14px 2px 4px; font-size: 12.5px; font-weight: 800; color: var(--ink-soft); }
  .foot { margin: 12px 2px 0; font-size: 12px; line-height: 1.55; color: var(--ink-soft); word-break: keep-all; }
  .foot.caveat { padding: 9px 11px; border-radius: 12px; background: var(--accent-tint); color: var(--ink); font-weight: 700; }

  /* 장소 카드(핀을 눌렀을 때) */
  .cd-dist { margin: -2px 0 10px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .cd-sec { padding: 12px 0; border-top: 1px solid var(--panel-border); }
  .cd-sec h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 13.5px; font-weight: 800; }
  .cd-sec h4 i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .cd-sec p { margin: 3px 0; font-size: 13.5px; line-height: 1.55; word-break: keep-all; }
  .cd-sec .soft { color: var(--ink-soft); font-size: 12.5px; }
  .cd-act { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--panel-border); }
  .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 14px; font-weight: 800; text-decoration: none; box-shadow: 0 2px 0 var(--line); cursor: pointer; }
  .btn.main { background: var(--hl); color: var(--hl-ink); }
  .btn svg { width: 18px; height: 18px; }

  /* 지킴이 빈 화면 · 예시 카드 */
  .empty-g { text-align: center; padding: 14px 10px 6px; }
  .empty-g .eg { width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 50%; border: 1.5px dashed var(--panel-border); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; }
  .empty-g .eg svg { width: 28px; height: 28px; }
  .empty-g b { display: block; font-size: 15px; font-weight: 800; }
  .empty-g p { margin: 6px 0 12px; font-size: 13px; line-height: 1.55; color: var(--ink-soft); word-break: keep-all; }
  .empty-g .btn { display: inline-flex; flex: none; padding: 0 18px; }
  .gcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
  .gcard { position: relative; display: grid; gap: 3px; padding: 10px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--panel); text-align: left; cursor: pointer; box-shadow: 0 2px 0 var(--line); }
  .gcard img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 3px solid #dfa21f; }
  .gcard b { font-size: 14px; font-weight: 800; }
  .gcard span { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
  .gcard .crown { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 26px; height: 26px; color: #f2b52f; filter: drop-shadow(0 1px 0 var(--line)); }

  /* 지도 위 동네 스팟 핀(선물 상자 / 사진) */
  .sp { position: relative; width: 44px; height: 44px; }
  .sp .box { position: absolute; inset: 2px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 2px solid #121215;
    background: #ff5c9d; color: #121215; box-shadow: 0 2px 0 #121215; }
  .sp.photo .box { border-radius: 50%; }
  .sp .box svg { width: 22px; height: 22px; }
  .sp .spark { position: absolute; top: -7px; right: -6px; font-size: 13px; color: #f2b52f; text-shadow: 0 0 2px #fff; }
  .sp .badge { position: absolute; right: -6px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #121215; background: #fff; color: #121215; display: flex; align-items: center; justify-content: center; }
  .sp .badge svg { width: 12px; height: 12px; }
  .sp .paw { position: absolute; left: -7px; bottom: -5px; width: 20px; height: 20px; border-radius: 50%; background: #ffe4ef; color: #c2185b; border: 1.5px solid #c2185b; display: flex; align-items: center; justify-content: center; }
  .sp .paw svg { width: 11px; height: 11px; }
  .sp .lb { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px;
    background: #fff; color: #121215; border: 1px solid #121215; }
  .sp.is-on .box { outline: 3px solid #ff5c9d; outline-offset: 3px; }
  .gp { position: relative; width: 50px; height: 50px; }
  .gp img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 3px solid #dfa21f; box-shadow: 0 2px 0 #121215; background: #fff; }
  .gp .crown { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; color: #f2b52f; filter: drop-shadow(0 1px 0 #121215); }
  .gp .lb { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: #fff; color: #121215; border: 1px dashed #121215; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h, 58px) + 24px); z-index: 1400; transform: translateX(-50%); max-width: 88%; padding: 11px 15px; border-radius: 14px;
    background: var(--ink); color: var(--bg); font-size: 13.5px; font-weight: 700; line-height: 1.45; text-align: center; word-break: keep-all; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .toast[hidden] { display: none; }
</style>

<div class="band" id="band" role="group" aria-label="시안 상태 바꾸기">

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  var RR = window.RewardRules, IP = window.InfraPins, SV = window.ShopVisits;

  // ── 그림(선 아이콘) ──
  var I = {
    all: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>',
    crown: '<path d="M3 18h18l-1.6-10-4.7 4.4L12 5l-2.7 7.4L4.6 8z" fill="currentColor" stroke="none"/>',
    leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/>',
    sos: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>',
    gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
    camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
    cup: '<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v3M10 2v3M14 2v3"/>',
    paw: '<circle cx="11" cy="4" r="2" fill="currentColor" stroke="none"/><circle cx="18" cy="8" r="2" fill="currentColor" stroke="none"/><circle cx="20" cy="16" r="2" fill="currentColor" stroke="none"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.8 1C6.5 17.5 4.5 16.8 4.5 16.8A3.5 3.5 0 0 1 5.5 10Z" fill="currentColor" stroke="none"/>',
    locate: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM21 14v.01M14 21h.01M17 21h4M21 17v.01"/>',
    nav: '<path d="m3 11 19-9-9 19-2-8-8-2z"/>'
  };
  function svg(k, extra) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + I[k] + '</svg>'; }
  $('locate').innerHTML = svg('locate'); $('qr').innerHTML = svg('qr'); $('walk').innerHTML = svg('paw') + '산책';

  // ── 데이터: 진짜 장소 ──
  // 미션 장소(PLACES)와 150m 안의 동반 가게·공원은 장소 하나로 합친다 — 지금 [동네]에선 깃발과 가게 핀이 한 자리에 겹친다
  var ALL = IP.all().filter(function (p) { return IP.category(p.cat); });
  var walks = (window.WalsonStore && WalsonStore.walks()) || [];
  var prog = RR.computeProgress(walks);
  function km(a, b) { return SV.distanceM([a.lat, a.lng], [b.lat, b.lng]); }
  var places = RR.PLACES.filter(function (p) { return !p.pending; }).map(function (pl) {
    return { id: pl.id, name: pl.name, lat: pl.center[0], lng: pl.center[1], spot: pl, shop: null, park: pl.kind === 'park' || pl.kind === 'water',
      got: prog.visitedAt ? prog.visitedAt[pl.id] : undefined };
  });
  var merged = {};
  ALL.forEach(function (p) {
    if (p.cat !== 'spot' && p.cat !== 'park') return;
    var near = places.filter(function (pl) { return km(pl, p) < 150; }).sort(function (a, b) { return km(a, p) - km(b, p); })[0];
    if (!near) return;
    merged[p.id] = true;

  $('pin-style').addEventListener('click', function () {
    pinStyle = pinStyle === 'gift' ? 'photo' : 'gift';
    this.textContent = '스팟 핀: ' + (pinStyle === 'gift' ? '선물 상자' : '사진');
    this.setAttribute('aria-pressed', String(pinStyle === 'photo'));
    draw();
    if (state === 'peek') renderPeek(); else if (state === 'card') openCard(cardOf); else renderList(listMode);
  });

  // 띠 아래로 칩 줄을 내린다
  function place() {
    var bh = $('band').offsetHeight;
    $('chips').style.top = (bh + 6) + 'px';
    fit();
  }
  window.addEventListener('resize', place);
  window.addEventListener('load', place);
  paintChips(); draw(); renderPeek(); place();
  window.__sian = { places: places, pins: pins, state: function () { return { state: state, chip: chip, list: listMode, open: openId, pinStyle: pinStyle, demo: showDemoG }; } };
})();
</script>
</body>
</html>
