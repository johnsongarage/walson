<style>
  /* 산책 중 화면 — 위치를 쓰는 산책(2026-11-16 2단계, 가르시아 "시안대로 2단계 바로 진행해줘", 시안 캔버스 ⑪·⑫).
     예전엔 지도가 바탕인 화면이었다. 이제 11/13 C안대로 큰 시간이 주인공이고, 위치를 쓰면 미션 카드·알림 띠가 더해진다.
     지도는 기본으로 숨기고 [지도 보기]를 누를 때 처음 만든다(그때만 지도 그림을 받음) — 펼치면 내 위치와 미션 장소가 같이 보이게.
     시설 핀·추천 루트·발자국은 뺐다(시설은 [동네]에서). 산책 전 화면은 없다 — 시작은 산책 나가기(go.html)에서 한다. */
  :root {
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-ink: #9c4530; --accent-tint: #f3ddd2;
    --locate: #2f7fd8; --shadow-rgb: 74, 63, 53;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); }
  body { display: flex; flex-direction: column; }

  /* 지도 보기(펼침) */
  .map-view { position: fixed; inset: 0; z-index: 50; background: #efe3d2; }
  .map-view[hidden] { display: none; }
  body.map-open { overflow: hidden; }   /* 지도를 펼친 동안 뒤 화면이 같이 밀리지 않게 */
  #map { position: absolute; inset: 0; z-index: 0; }
  /* 지도 컬러톤: 라벤더 파스텔(예전 산책 화면·[동네]와 같은 값) */
  .leaflet-tile-pane { filter: saturate(55%) hue-rotate(220deg) brightness(112%) contrast(92%); }
  .map-top { position: absolute; z-index: 500; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none; }
  .map-top > * { pointer-events: auto; }
  .map-sheet { position: absolute; z-index: 500; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px;
    padding: 18px 20px calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-radius: 24px 24px 0 0;
    box-shadow: 0 -6px 20px rgba(var(--shadow-rgb), 0.14); }
  .map-sheet b { font-size: 17px; font-weight: 800; }
  .map-sheet p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-soft); word-break: keep-all; }
  .map-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .map-actions button { height: 52px; border-radius: 16px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  #pin-btn { border: 1.5px solid #c9b59d; background: var(--panel); color: var(--ink); }
  #map-close { border: 0; background: var(--accent); color: #fff; }

  /* 지도 위 표시 — 출발점(흰 점) · 지금 위치(파란 점) · 미션 장소(깃발) · 내가 꽂은 핀 */
  .wm-start { border-radius: 50%; background: #fff; border: 3px solid var(--ink); box-sizing: border-box; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .wm-me { position: relative; border-radius: 50%; background: var(--locate); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--locate), 0 2px 10px rgba(0,0,0,0.35); }
  .wm-me::after { content: ''; position: absolute; inset: -11px; border-radius: 50%; background: var(--locate); opacity: 0.3; }
  .wm-flag { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
    color: #fff; border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 3px 10px rgba(var(--shadow-rgb), 0.35); }
  .pin-marker { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--ink); border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.35); }
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--ink); border-radius: 12px; box-shadow: 0 10px 28px rgba(var(--shadow-rgb), 0.2); }
  .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup-content { font-family: 'Pretendard', sans-serif; font-size: 13px; line-height: 1.6; margin: 12px 14px; }
  .pin-popup { display: flex; flex-direction: column; gap: 8px; min-width: 120px; }
  .pin-popup-memo { color: var(--ink); }
  .pin-popup-empty { color: var(--ink-soft); font-style: italic; }
  .pin-delete-btn { align-self: flex-start; border: none; background: none; padding: 2px 0; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; color: #b3392b; }
</style>

<div class="ws-screen" id="screen">
  <header class="ws-top">
    <div class="ws-chip"><span class="ws-dot" aria-hidden="true"></span><span>길 기록 중 · 위치 사용</span></div>
    <div class="ws-menu-wrap">
      <button type="button" class="ws-icon-btn" id="menu-btn" aria-label="메뉴" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="ws-menu" id="menu" hidden>
        <!-- 가게 QR 찍기(2026-11-16) — 산책 중 들른 가게의 체크인 QR을 이 화면을 떠나지 않고 찍는다(qr-scan.js) -->
        <button type="button" id="qr-scan-link" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2z"/></svg>
          <span>가게 QR 찍기</span>
        </button>
        <!-- 화면 켜 두기(2026-11-16 0단계, 기본 꺼짐) — 켜면 화면이 저절로 꺼지지 않아 길이 자세히 남는다 -->
        <button type="button" id="keep-screen-toggle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg>
          <span id="keep-screen-label">화면 켜 두기 · 꺼짐</span>
        </button>
        <!-- 시연 모드(가짜 위치) — 시험·시연용. 데모 산책은 통계로 보내지 않고 키링 조건에서 뺀다(demo-geo.js) -->
        <button type="button" id="demo-toggle" class="is-tool">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
          <span id="demo-toggle-label">시연 모드(가짜 위치) 켜기</span>
        </button>
      </div>
    </div>
  </header>
  <p class="ws-tip" id="pocket-tip">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <span id="pocket-tip-text">화면을 꺼서 주머니에 넣어도 돼요</span>
  </p>
  <main class="ws-clock-area">
    <span class="ws-who" id="who">산책 중</span>
    <div class="ws-clock"><span id="clock">0</span><small>분</small></div>
    <span class="ws-since" id="since"></span>
  </main>
  <section class="ws-mission" id="mission-card" aria-label="미션" hidden></section>
  <div class="ws-notice" id="walk-notice" role="status" hidden><span class="ws-notice-icon" aria-hidden="true"></span><span class="ws-notice-text" id="walk-notice-text"></span></div>
  <footer class="ws-bottom">
    <button type="button" class="ws-map-btn" id="map-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3.5 6.5v13L9 17l6 2.5 5.5-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg>
      <span>지도 보기</span>
    </button>
    <button type="button" class="ws-end" id="walk-btn"><span class="ws-end-label">끝내기</span></button>
    <p class="ws-hint">주머니 속에서 잘못 눌려도 끝나지 않게 두 번 눌러요</p>
  </footer>
</div>

<!-- 지도 보기(펼침, 시안 ⑫) — 처음 열 때 지도를 만든다 -->
<div class="map-view" id="map-view" hidden>
  <div id="map"></div>
  <div class="map-top">
    <div class="ws-chip is-dark"><span class="ws-dot" aria-hidden="true"></span><span id="map-chip-text">0분 · 길 기록 중</span></div>
    <button type="button" class="ws-icon-btn" id="map-close-x" aria-label="지도 닫기">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <section class="map-sheet" aria-label="지금까지 걸은 길">
    <b id="map-mission">지금까지 걸은 길</b>
    <p>펼칠 때 내 위치와 미션 장소가 같이 보이게 맞춰요. 점선은 화면이 꺼져 있던 동안이에요. 시설 핀은 [동네]에서 봐요.</p>
    <div class="map-actions">
      <button type="button" id="pin-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-6.2-6-11a6 6 0 0 1 12 0c0 4.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
        <span>핀 꽂기</span>
      </button>
      <button type="button" id="map-close">지도 닫기</button>
    </div>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var WALKS_KEY = 'petwalk_walks';
  var LAST_WALK_KEY = 'petwalk_last_walk';
  var PINS_KEY = 'petwalk_pins';          // 산책 중 꽂은 핀(메모) — 지도 보기 안에서 꽂고 지운다
  var PROFILE_KEY = 'petwalk_profile';
  var LOCATION_EXPLAINED_KEY = 'petwalk_location_explained';
  var DEFAULT_CENTER = [37.6212, 127.1525]; // 아울렛·다산중앙공원·다산수변공원의 가운데(공용 장소)

  // 최소한의 조작 방지(2026-09-25) — 완벽히 막는 게 아니라 "명백히 산책이 아닌 것"만 거른다.
  var WALK_RULES = {
    maxAccuracyM: 50,      // 이보다 부정확한 GPS 점은 버림(튀는 점 때문에 거리가 부풀려지는 것 방지)
    maxWalkSpeedKmh: 15,   // 이보다 빠른 구간(차/자전거)은 산책 거리·발도장에서 뺌
    minRewardMinutes: 5,   // 이보다 짧은 산책은 기록만 남고 보상 횟수엔 안 들어감
    minRewardKm: 0.2
  };
  // 화면 꺼짐(2026-09-26) · 주머니 산책(2026-11-16): 모바일 브라우저는 화면이 꺼지거나 다른 앱으로 가면 위치를 못 받는다.
  // 끊긴 구간은 앞뒤 점을 직선으로 잇고, 걷는 속도면 거리·바로 판정에 넣는다(산책 끝 판정 analyzeWalk와 같은 기준).
  var GAP_MS = 60 * 1000;
  // 앱이 아예 닫혀도(아이폰이 숨겨 둔 앱을 정리) 이어지게 진행 중인 산책을 이 휴대폰에만 저장한다. 시연 모드 산책은 저장 안 함.
  var ACTIVE_ROUTE_KEY = 'petwalk_active_route';   // { v:1, startedAt, samples:[[lat,lng,ms]], liveKm, visited, gapMs, savedAt }
  var ROUTE_STALE_MS = 3 * 60 * 60 * 1000;
  // 화면 켜 두기는 기본 꺼짐(0단계) — 켠 사람만 Wake Lock
  var KEEP_SCREEN_KEY = 'petwalk_keep_screen';
  var POCKET_TIP = '화면을 꺼서 주머니에 넣어도 돼요. 발도장 장소에서 한 번만 꺼내 열면 그 사이는 직선으로 이어져요.';
  var KEEP_TIP = '화면을 켜 둘게요 — 길이 자세히 남아요. 주머니에 넣을 땐 전원 버튼으로 꺼 주세요.';
  var REST_RADIUS_KM = 0.05, REST_ASK_MS = 20 * 60 * 1000;

  function isDemo() { return !!(window.PetwalkDemoGeo && PetwalkDemoGeo.on); }
  function nowMs() { return isDemo() ? PetwalkDemoGeo.now() : Date.now(); }
  function loadJSON(key, fb) { try { return JSON.parse(localStorage.getItem(key)) || fb; } catch (e) { return fb; } }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function loadWalks() { return loadJSON(WALKS_KEY, []); }
  function keepScreen() { try { return localStorage.getItem(KEEP_SCREEN_KEY) === '1'; } catch (e) { return false; } }
  function haversineKm(a, b) {
    var R = 6371, t = Math.PI / 180;
    var dLat = (b[0] - a[0]) * t, dLng = (b[1] - a[1]) * t;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function bearingDeg(a, b) {
    var t = Math.PI / 180, y = Math.sin((b[1] - a[1]) * t) * Math.cos(b[0] * t);
    var x = Math.cos(a[0] * t) * Math.sin(b[0] * t) - Math.sin(a[0] * t) * Math.cos(b[0] * t) * Math.cos((b[1] - a[1]) * t);
    return (Math.atan2(y, x) / t + 360) % 360;
  }
  function kmText(km) { return km < 1 ? Math.round(km * 100) * 10 + 'm' : km.toFixed(1) + 'km'; }
  function isFastSegment(a, b) {
    var hours = (b.t - a.t) / 3600000;
    return hours > 0 && haversineKm(a.c, b.c) / hours > WALK_RULES.maxWalkSpeedKmh;
  }
  // samples: [{ c: [lat,lng], t: ms }] → 걷는 속도 구간만 합친 거리와 그 구간의 점들(발도장 판정용)
  function analyzeWalk(samples) {
    var walkKm = 0, fastKm = 0, walkingPoints = [];
    for (var i = 1; i < samples.length; i++) {
      var a = samples[i - 1], b = samples[i];
      var km = haversineKm(a.c, b.c), hours = (b.t - a.t) / 3600000;
      if (hours <= 0) continue;
      if (km / hours > WALK_RULES.maxWalkSpeedKmh) fastKm += km;
      else { walkKm += km; walkingPoints.push(a.c, b.c); }
    }
    return { walkKm: walkKm, fastKm: fastKm, walkingPoints: walkingPoints };
  }
  // [기록] 썸네일용으로 듬성듬성 줄인다(최대 60개 점)
  function simplifyRoute(coords, maxPoints) {
    if (coords.length <= maxPoints) return coords.slice();
    var step = Math.ceil(coords.length / maxPoints), out = [];
    for (var i = 0; i < coords.length; i += step) out.push(coords[i]);
    var last = coords[coords.length - 1];
    if (out[out.length - 1][0] !== last[0] || out[out.length - 1][1] !== last[1]) out.push(last);
    return out;
  }
  // 마지막 점에서 REST_RADIUS_KM 안에 처음 들어온 시각 = 멈춰 선 시각. 한 번도 그 밖에 나간 적이 없으면 null
  function estimateRestStart(samples) {
    if (!samples || samples.length < 2) return null;
    var last = samples[samples.length - 1].c;
    for (var i = samples.length - 2; i >= 0; i--) {
      if (haversineKm(samples[i].c, last) > REST_RADIUS_KM) return samples[i + 1].t;
    }
    return null;
  }

  // ── 상태 ──
  var walking = false, leaving = false, walkStartTime = null, watchId = null;
  var routeCoords = [], routeSamples = [], liveKm = 0, liveVisited = {}, walkGapMs = 0, lastFix = null;
  var wakeLock = null, routeSavedAt = 0;
  var locationExplained = false;
  try { locationExplained = localStorage.getItem(LOCATION_EXPLAINED_KEY) === '1'; } catch (e) { /* 다시 묻는다 */ }

  var showWalkNotice = WalkScreen.notice($('walk-notice'));
  var menuCtl = WalkScreen.menu($('menu-btn'), $('menu'));
  $('who').textContent = WalkScreen.walkerLine(loadJSON(PROFILE_KEY, {}).name);

  // ── 큰 시간 ──
  function tick() {
    if (!walkStartTime) return;
    var m = Math.max(0, Math.floor((nowMs() - walkStartTime) / 60000));
    $('clock').textContent = m;
    $('map-chip-text').textContent = m + '분 · 길 기록 중';
  }
  function paintSince() {
    var s = new Date(walkStartTime);
    $('since').textContent = s.getHours() + '시 ' + pad2(s.getMinutes()) + '분에 출발';
  }
  setInterval(tick, 5000);

  // ── 미션 카드(2026-11-15 지도 미션) ── 다음 미션 = 발도장 장소 중 순서대로 안 간 첫 곳(reward-rules.js)
  var FLAG_SVG = WalkScreen.ICONS.stamp;
  var ARROW_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l6 9h-4v9h-4v-9H6z" fill="currentColor"/></svg>';
  // 지난 산책들의 진행도는 산책 중에 바뀌지 않으니 한 번만 센다(위치를 받을 때마다 기록 전체를 다시 훑지 않게)
  var baseProgress = null;
  function missionProgress() {
    if (!baseProgress) baseProgress = window.RewardRules.computeProgress(loadWalks());
    var visited = {};
    Object.keys(baseProgress.visited).forEach(function (id) { visited[id] = true; });
    Object.keys(liveVisited).forEach(function (id) { if (liveVisited[id] === 'got') visited[id] = true; });
    return { walks: baseProgress.walks, km: baseProgress.km, visited: visited };
  }
  function missionNow() {
    var R = window.RewardRules;
    if (!R || !R.missions) return null;
    var p = missionProgress();
    return { all: R.missions(p), now: R.currentMission(p) };
  }
  function targetText(pl) { return pl.name + (pl.kind === 'building' ? ' 앞까지' : '까지'); }
  function paintMission() {
    var card = $('mission-card'), M = missionNow();
    if (!M || !M.all.length) { card.hidden = true; return; }
    var done = M.all.filter(function (m) { return m.done; }).length, now = M.now;
    var html = '<span class="ws-flag" aria-hidden="true">' + FLAG_SVG + '</span><span class="ws-mbody">';
    var dir = '';
    if (!now) {
      card.className = 'ws-mission is-done';
      html += '<span class="ws-m1">발도장 ' + done + '/' + M.all.length + '</span><span class="ws-m2">미션을 다 했어요</span>';
    } else {
      var here = lastFix && window.RewardRules.distanceKm(lastFix, now.place.center) <= now.place.radiusKm;
      var pending = liveVisited[now.place.id] === 'pending';
      card.className = 'ws-mission' + (here ? ' is-here' : '');
      html += '<span class="ws-m1">미션 ' + now.no + ' · 발도장 ' + done + '/' + M.all.length + '</span>' +
        '<span class="ws-m2"></span>' +
        '<span class="ws-m3">' + (pending ? '도착! 5분·200m 넘게 걸으면 찍혀요' : here ? '도착했어요' : '도착하면 한 번만 꺼내 열어 주세요') + '</span>';
      if (lastFix) {
        var km = window.RewardRules.distanceKm(lastFix, now.place.center);
        dir = here ? '<span class="ws-mdir">도착</span>'
          : '<span class="ws-mdir"><span style="display:flex;transform:rotate(' + Math.round(bearingDeg(lastFix, now.place.center)) + 'deg)">' + ARROW_SVG + '</span>' + kmText(km) + '</span>';
      }
    }
    card.innerHTML = html + '</span>' + dir;
    if (now) card.querySelector('.ws-m2').textContent = targetText(now.place);   // 장소 이름은 글자로만 넣는다
    card.hidden = false;
  }

  // 걷는 속도로 들어온 점 하나를 보고 발도장 장소 안이면 알린다. eligible: 지금까지 5분·200m를 넘었는지
  function checkLiveStamp(coord, eligible) {
    var R = window.RewardRules;
    if (!R || !R.placeAt) return;
    Object.keys(liveVisited).forEach(function (id) {   // 도착했지만 5분·200m 전이라 미뤄 둔 도장 — 기준을 넘는 순간 받는다
      if (liveVisited[id] === 'pending' && eligible) { liveVisited[id] = 'got'; announceStamp(id); }
    });
    var pl = R.placeAt(coord);
    if (!pl || liveVisited[pl.id]) return;
    if (missionProgress().visited[pl.id]) { liveVisited[pl.id] = 'old'; return; }   // 예전에 이미 받은 곳
    if (eligible) { liveVisited[pl.id] = 'got'; announceStamp(pl.id); }
    else {
      liveVisited[pl.id] = 'pending';
      showWalkNotice(pl.name + ' 도착! ' + WALK_RULES.minRewardMinutes + '분·' + Math.round(WALK_RULES.minRewardKm * 1000) + 'm 넘게 걸으면 발도장이 찍혀요.', 'info');
    }
  }
  function announceStamp(id) {
    var R = window.RewardRules;
    var pl = R.PLACES.filter(function (x) { return x.id === id; })[0];
    if (!pl) return;
    var p = missionProgress(), all = R.missions(p);
    var done = all.filter(function (m) { return m.done; }).length, next = R.currentMission(p);
    showWalkNotice(pl.name + ' 발도장 받았어요 (' + done + '/' + all.length + ')' + (next ? ' · 다음 미션: ' + next.place.name : ' · 미션을 다 했어요'), 'stamp');
    // 진동은 이 화면을 한 번이라도 누른 뒤에만 된다(브라우저 규칙) — 주머니에서 막 꺼내 연 화면은 조용히 넘어간다
    try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([90, 60, 90]); } catch (e) { /* 진동 없는 기기(아이폰 등) */ }
  }

  // ── 화면 켜 두기 ──
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return Promise.resolve(false);
    return navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { if (wakeLock === lock) wakeLock = null; });
      return true;
    }).catch(function () { return false; });
  }
  function releaseWakeLock() {
    if (wakeLock) wakeLock.release().catch(function () {});
    wakeLock = null;
  }
  function paintKeepScreen() {
    $('keep-screen-label').textContent = '화면 켜 두기 · ' + (keepScreen() ? '켬' : '꺼짐');
    $('pocket-tip-text').textContent = keepScreen() ? '화면을 켜 두는 중 · 주머니에 넣을 땐 전원 버튼으로' : '화면을 꺼서 주머니에 넣어도 돼요';
  }
  paintKeepScreen();
  $('keep-screen-toggle').addEventListener('click', function () {
    var on = !keepScreen();
    try { if (on) localStorage.setItem(KEEP_SCREEN_KEY, '1'); else localStorage.removeItem(KEEP_SCREEN_KEY); } catch (err) { /* 저장 못 하면 바뀌지 않는다 */ }
    paintKeepScreen();
    menuCtl.close();
    if (keepScreen()) { if (walking) requestWakeLock(); showWalkNotice(KEEP_TIP, 'info'); }
    else { releaseWakeLock(); showWalkNotice(POCKET_TIP, 'info'); }
  });

  // ── 가게 QR 찍기 ──
  if (window.WalsonQR && window.ShopVisits) {
    $('qr-scan-link').hidden = false;
    $('qr-scan-link').addEventListener('click', function () { menuCtl.close(); WalkScreen.scanShop(showWalkNotice); });
  }

  // ── 시연 모드 ──
  (function () {
    var t = $('demo-toggle'), label = $('demo-toggle-label');
    if (!window.PetwalkDemoGeo) { t.hidden = true; return; }
    label.textContent = isDemo() ? '시연 모드 끄기(진짜 위치로)' : '시연 모드(가짜 위치) 켜기';
    t.addEventListener('click', function () {
      if (walking && !confirm('산책 기록 중이에요. 시연 모드를 바꾸면 지금 산책은 저장되지 않아요. 계속할까요?')) return;
      // 버린 산책을 다음에 열 때 이어 하지 않게 — 먼저 산책을 멈춰야 화면이 넘어가는 순간(pagehide) 다시 저장되지 않는다
      if (walking) {
        walking = false;
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        releaseWakeLock();
        clearActiveRoute();
      }
      leaving = true;
      // 켜면 가짜 위치로 바로 새 산책(시연하려고 켜는 것이므로), 끄면 산책 나가기로(산책 중이 아닌 화면은 거기)
      if (isDemo()) PetwalkDemoGeo.disable(); else location.replace('walk.html?start=1&demo=1');
    });
  })();

  // ── 진행 중인 산책 저장(이어 하기) ──
  function saveActiveRoute(now) {
    if (!walking || leaving || isDemo()) return;   // 끝내거나 버리고 떠나는 중이면 다시 저장하지 않는다
    var t = Date.now();
    if (!now && t - routeSavedAt < 10000) return;   // 위치를 받을 때마다 쓰지 않고 10초에 한 번(숨겨질 때는 바로)
    routeSavedAt = t;
    var samples = routeSamples.map(function (p) { return [Math.round(p.c[0] * 1e6) / 1e6, Math.round(p.c[1] * 1e6) / 1e6, p.t]; });
    try {
      localStorage.setItem(ACTIVE_ROUTE_KEY, JSON.stringify({
        v: 1, startedAt: walkStartTime, samples: samples, liveKm: liveKm, visited: liveVisited, gapMs: walkGapMs, savedAt: t
      }));
    } catch (e) { /* 저장 공간이 모자라도 산책은 계속된다 — 이어 하기만 안 될 뿐 */ }
  }
  function loadActiveRoute() {
    var a = loadJSON(ACTIVE_ROUTE_KEY, null);
    return a && a.v === 1 && typeof a.startedAt === 'number' ? a : null;
  }
  function clearActiveRoute() { try { localStorage.removeItem(ACTIVE_ROUTE_KEY); } catch (e) { /* 무시 */ } }

  // ── 위치 받기 ──
  function enterWalking() {
    walking = true;
    if (keepScreen()) requestWakeLock();
    paintSince();
    tick();
    watchId = navigator.geolocation.watchPosition(onWalkFix, function (err) {
      // 위치 권한이 꺼져 있고 아직 한 점도 못 받았으면 시간만 재기로 이어 간다(1단계 — 출발 시각 그대로)
      if (err && err.code === 1 && walking && !routeSamples.length && !isDemo()) { fallbackToTime(); return; }
    }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
  }
  function fallbackToTime() {
    var started = Math.round(walkStartTime || Date.now());
    walking = false;
    leaving = true;
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    releaseWakeLock();
    clearActiveRoute();
    location.replace('go.html?fallback=' + started);
  }
  // 위치 한 점 — watchPosition과, 다시 열었을 때 바로 읽는 위치(freshFix)가 같이 쓴다
  function onWalkFix(pos) {
    if (!walking) return;
    var coord = [pos.coords.latitude, pos.coords.longitude];
    lastFix = coord;   // 정확도가 낮은 점도 지금 위치·미션 거리에는 쓰되, 길(선)에는 넣지 않는다
    if (pos.coords.accuracy > WALK_RULES.maxAccuracyM) { paintMission(); if (mapOpen) drawMap(false); return; }
    var t = pos.timestamp || Date.now();
    var last = routeSamples[routeSamples.length - 1];
    if (last && t <= last.t) { paintMission(); return; }   // 이미 받은 시각의 위치(브라우저가 기억해 둔 것)는 길에 넣지 않는다
    routeCoords.push(coord);
    routeSamples.push({ c: coord, t: t });
    if (routeSamples.length >= 2) {
      var prev = routeSamples[routeSamples.length - 2], cur = routeSamples[routeSamples.length - 1];
      var gap = cur.t - prev.t, fast = isFastSegment(prev, cur), segKm = haversineKm(prev.c, cur.c);
      if (gap > GAP_MS) {
        walkGapMs += gap;
        var gapMin = Math.max(1, Math.round(gap / 60000));
        showWalkNotice(fast
          ? '다시 이어서 기록해요 · 그 사이 ' + gapMin + '분은 걷는 속도보다 빨라서 거리에서 뺐어요.'
          : '다시 이어서 기록해요 · 그 사이 ' + gapMin + '분(' + kmText(segKm) + ')은 직선으로 셌어요.', fast ? 'warn' : 'info');
      }
      // 산책 중 바로 판정 — 차·자전거 속도 구간만 뺀다. 끊긴 구간도 걷는 속도면 직선으로 넣는다(주머니 산책)
      if (!fast) {
        liveKm += segKm;
        var eligibleNow = (nowMs() - walkStartTime) / 60000 >= WALK_RULES.minRewardMinutes && liveKm >= WALK_RULES.minRewardKm;
        checkLiveStamp(coord, eligibleNow);
      }
    }
    paintMission();
    if (mapOpen) drawMap(false);
    saveActiveRoute(false);
  }
  function freshFix() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(onWalkFix, function () { /* 못 읽으면 watchPosition이 이어서 준다 */ },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  }
  document.addEventListener('visibilitychange', function () {
    if (!walking) return;
    if (document.visibilityState === 'visible') {
      if (!wakeLock && keepScreen()) requestWakeLock();
      tick();
      freshFix();   // 주머니에서 꺼내 열었을 때 — 기다리지 않고 지금 위치를 바로 읽어 발도장을 판정한다
    } else {
      saveActiveRoute(true);   // 숨겨지는 순간 저장 — 이대로 앱이 닫혀도 다시 열면 이어진다
    }
  });
  window.addEventListener('pagehide', function () { if (walking) saveActiveRoute(true); });

  // ── 기록 저장 · 끝내기 ──
  // endMs: 끝난 시각을 따로 정할 때(이어 하기에서 지난 산책을 정리할 때) — 없으면 지금
  function saveWalkRecord(distanceKm, durationMin, route, stampRoute, rewardEligible, gapMin, endMs) {
    var walks = loadWalks();
    var ended = endMs ? new Date(endMs) : new Date();
    walks.push({
      date: dateKey(ended), distanceKm: distanceKm, durationMin: durationMin,
      route: simplifyRoute(route, 60),
      stampRoute: stampRoute.length ? simplifyRoute(stampRoute, 60) : [],
      rewardEligible: rewardEligible,
      gapMin: gapMin || 0,
      endedAt: ended.getTime(),  // 서버 가정 시험판(mock-server.js)이 시간대만 뽑아 쓴다. 이 폰 안에만 있다
      startedAt: walkStartTime   // 끝 화면의 "○시 ○분 출발"(2026-11-16 2단계). 이 폰 안에만 있다
    });
    if (isDemo()) walks[walks.length - 1].demo = true;   // 시연 모드 산책 — 키링(실제 보상)과 통계에서 뺀다
    localStorage.setItem(WALKS_KEY, JSON.stringify(walks));
    var total = walks.reduce(function (sum, w) { return sum + (w.distanceKm || 0); }, 0);
    try { localStorage.setItem(LAST_WALK_KEY, JSON.stringify({ distanceKm: distanceKm, totalDistanceKm: total, durationMin: durationMin })); } catch (e) { /* 무시 */ }
  }
  // opts.endMs: 끝난 시각을 정해 저장할 때(오래된 산책 정리 — 마지막 위치 시각)
  function stopWalk(opts) {
    opts = opts || {};
    walking = false;
    leaving = true;
    clearActiveRoute();
    releaseWakeLock();
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    var endMs = opts.endMs || nowMs();
    if (routeCoords.length < 2) {
      // 길이 안 남았어도(위치를 거의 못 받음 — 실내·높은 건물 사이) 걸은 시간은 남긴다.
      // 시간만 잰 산책과 같은 모양(보상 제외)에 noRoute를 붙여 끝 화면이 왜 길이 없는지 알려 준다
      var mins = Math.round((endMs - walkStartTime) / 60000);
      if (mins < 1) { alert('1분이 안 된 산책이라 저장하지 않았어요.'); location.replace('go.html'); return; }
      var walks = loadWalks(), ended = new Date(opts.endMs || Date.now());
      walks.push({ date: dateKey(ended), distanceKm: 0, durationMin: mins, route: [], stampRoute: [], rewardEligible: false, gapMin: 0, mode: 'time', noRoute: true, endedAt: ended.getTime(), startedAt: walkStartTime });
      if (isDemo()) walks[walks.length - 1].demo = true;
      try { localStorage.setItem(WALKS_KEY, JSON.stringify(walks)); } catch (e) { alert('기록을 저장하지 못했어요. 저장 공간을 확인해 주세요.'); }
      if (window.WalsonTrack && !isDemo()) WalsonTrack.send('walk_complete', { mode: 'time', min_bucket: WalsonTrack.minBucket(mins), eligible: 0 });
      location.replace('walk-end.html');
      return;
    }
    var progressBefore = window.RewardRules.computeProgress(loadWalks());
    var analysis = analyzeWalk(routeSamples);
    var distanceKm = analysis.walkKm;
    var durationMin = Math.max(1, Math.round((endMs - walkStartTime) / 60000));
    // 끝내기를 깜빡했을 때(2026-11-15): 마지막으로 움직인 뒤 한 자리에 오래 머물렀으면 그때 끝난 걸로 할지 묻는다
    var restEnd = opts.endMs ? null : estimateRestStart(routeSamples);
    if (restEnd && nowMs() - restEnd >= REST_ASK_MS) {
      var movedMin = Math.max(1, Math.round((restEnd - walkStartTime) / 60000));
      var t = new Date(restEnd);
      if (confirm('끝내기를 깜빡하셨나요?\n' + t.getHours() + '시 ' + pad2(t.getMinutes()) + '분부터 ' +
          Math.round((nowMs() - restEnd) / 60000) + '분 동안 같은 자리에 있었어요.\n\n' +
          '확인: 그때 끝난 걸로 저장(' + movedMin + '분)\n취소: 지금까지(' + durationMin + '분) 그대로 저장')) {
        durationMin = movedMin;
      }
    }
    var rewardEligible = durationMin >= WALK_RULES.minRewardMinutes && distanceKm >= WALK_RULES.minRewardKm;
    saveWalkRecord(distanceKm, durationMin, routeCoords, analysis.walkingPoints, rewardEligible, Math.round(walkGapMs / 60000), opts.endMs);
    // 통계: 걸은 시간은 구간만, 발도장은 새로 찍힌 개수만(어느 장소인지는 보내지 않는다)
    if (window.WalsonTrack && !isDemo()) {
      WalsonTrack.send('walk_complete', { mode: 'gps', min_bucket: WalsonTrack.minBucket(durationMin), eligible: rewardEligible ? 1 : 0 });
      var progressAfter = window.RewardRules.computeProgress(loadWalks());
      var newStamps = Object.keys(progressAfter.visited).filter(function (k) { return !progressBefore.visited[k]; }).length;
      if (newStamps) WalsonTrack.send('stamp_new', { count: newStamps });
    }
    // 끝 화면 하나로(2단계) — 보상(새 발도장·카드 성장·다음 미션)은 끝 화면에서 보여 준다
    location.replace('walk-end.html');
  }
  WalkScreen.twoTap($('walk-btn'), '끝내기', function () { stopWalk(); });

  // ── 지도 보기(시안 ⑫) — 처음 열 때 만든다 ──
  var map = null, routeLayer = null, markLayer = null, pinLayer = null, mapOpen = false;
  function initMap() {
    map = L.map('map', { zoomControl: false }).setView(DEFAULT_CENTER, 15);
    WalsonMapTiles(map);   // 지도 그림 주소는 site-config.js mapTiles 한곳에서 정한다
    routeLayer = L.layerGroup().addTo(map);
    markLayer = L.layerGroup().addTo(map);
    pinLayer = L.layerGroup().addTo(map);
    loadJSON(PINS_KEY, []).forEach(function (p) { addPinMarker(p.id, p.lat, p.lng, p.memo); });
  }
  // 걸은 길: 걷는 구간은 실선, 화면이 꺼져 있던 동안(GAP_MS 넘게 끊김)은 점선으로
  function drawMap(fit) {
    routeLayer.clearLayers();
    markLayer.clearLayers();
    var solid = { color: '#b8563a', weight: 5, opacity: 0.9 }, dashed = { color: '#b8563a', weight: 4, opacity: 0.85, dashArray: '2 10', lineCap: 'round' };
    var run = [];
    for (var i = 1; i < routeSamples.length; i++) {
      var a = routeSamples[i - 1], b = routeSamples[i];
      if (b.t - a.t > GAP_MS) {
        if (run.length > 1) L.polyline(run, solid).addTo(routeLayer);
        L.polyline([a.c, b.c], dashed).addTo(routeLayer);
        run = [b.c];
      } else {
        if (!run.length) run.push(a.c);
        run.push(b.c);
      }
    }
    if (run.length > 1) L.polyline(run, solid).addTo(routeLayer);
    if (routeCoords.length) L.marker(routeCoords[0], { icon: L.divIcon({ className: 'wm-start', iconSize: [14, 14], iconAnchor: [7, 7] }), interactive: false }).addTo(markLayer);
    var M = missionNow(), now = M && M.now;
    if (now) {
      L.circle(now.place.center, { radius: now.place.radiusKm * 1000, color: '#b8563a', weight: 2, dashArray: '6 6', fillColor: '#b8563a', fillOpacity: 0.07, interactive: false }).addTo(markLayer);
      L.marker(now.place.center, { icon: L.divIcon({ className: '', html: '<div class="wm-flag">' + FLAG_SVG + '</div>', iconSize: [36, 36], iconAnchor: [18, 18] }), interactive: false, zIndexOffset: 500 }).addTo(markLayer);
    }
    if (lastFix) L.marker(lastFix, { icon: L.divIcon({ className: 'wm-me', iconSize: [20, 20], iconAnchor: [10, 10] }), interactive: false, zIndexOffset: 1000 }).addTo(markLayer);
    // 아래 판: 미션까지 거리(직선 1.3배 · 분당 60m로 어림 — shop-visits.js와 같은 셈)
    var line = '지금까지 걸은 길';
    if (now && lastFix) {
      var m = Math.round(window.RewardRules.distanceKm(lastFix, now.place.center) * 1000);
      line = m <= now.place.radiusKm * 1000 ? now.place.name + '에 와 있어요' : '미션까지 ' + kmText(m / 1000) + (window.ShopVisits ? ' · ' + ShopVisits.walkText(m) : '');
    } else if (M && M.all.length && !now) line = '미션을 다 했어요';
    $('map-mission').textContent = line;
    if (fit) fitMap(now);
  }
  // 펼칠 때 내 위치와 미션 장소가 같이 보이게(2026-11-16 결정). 없으면 걸은 길, 그것도 없으면 동네 가운데.
  // 위 칩과 아래 판에 가리지 않게 그만큼 비워 두고 맞춘다
  function fitMap(now) {
    var pts = [];
    if (lastFix) pts.push(lastFix);
    if (now) pts.push(now.place.center);
    var top = document.querySelector('.map-top'), sheet = document.querySelector('.map-sheet');
    var opts = { paddingTopLeft: [28, (top ? top.offsetTop + top.offsetHeight : 70) + 24], paddingBottomRight: [28, (sheet ? sheet.offsetHeight : 200) + 24], maxZoom: 17, animate: false };
    if (pts.length === 2) map.fitBounds(L.latLngBounds(pts), opts);
    else if (pts.length === 1) map.setView(pts[0], 16, { animate: false });
    else if (routeCoords.length > 1) map.fitBounds(L.latLngBounds(routeCoords), opts);
  }
  function openMap() {
    $('map-view').hidden = false;
    document.body.classList.add('map-open');
    mapOpen = true;
    if (!map) initMap(); else map.invalidateSize();
    drawMap(true);
  }
  function closeMap() { $('map-view').hidden = true; document.body.classList.remove('map-open'); mapOpen = false; }
  $('map-btn').addEventListener('click', openMap);
  $('map-close').addEventListener('click', closeMap);
  $('map-close-x').addEventListener('click', closeMap);

  // 핀 꽂기 — 지금 위치에 메모 핀(이 휴대폰에만 저장). 팝업의 "이 핀 삭제"로 지운다
  function addPinMarker(id, lat, lng, memo) {
    var marker = L.marker([lat, lng], { icon: L.divIcon({ className: 'pin-marker', iconSize: [28, 28], iconAnchor: [14, 28] }) }).addTo(pinLayer);
    var wrap = document.createElement('div');
    wrap.className = 'pin-popup';
    var memoEl = document.createElement('div');
    memoEl.className = memo ? 'pin-popup-memo' : 'pin-popup-empty';
    memoEl.textContent = memo || '메모 없음';
    wrap.appendChild(memoEl);
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'pin-delete-btn';
    del.textContent = '이 핀 삭제';
    del.addEventListener('click', function () {
      pinLayer.removeLayer(marker);
      var pins = loadJSON(PINS_KEY, []).filter(function (p) { return p.id !== id; });
      try { localStorage.setItem(PINS_KEY, JSON.stringify(pins)); } catch (e) { /* 화면에서는 이미 지워짐 */ }
    });
    wrap.appendChild(del);
    marker.bindPopup(wrap);
    return marker;
  }
  $('pin-btn').addEventListener('click', function () {
    if (!walking || !lastFix) { alert('아직 지금 위치를 못 받았어요. 잠시 뒤 다시 눌러 주세요.'); return; }
    var memo = prompt('이 지점에 남길 메모가 있나요? (선택)');
    if (memo === null) return;
    var pins = loadJSON(PINS_KEY, []), id = Date.now();
    pins.push({ id: id, lat: lastFix[0], lng: lastFix[1], memo: memo || null });
    try { localStorage.setItem(PINS_KEY, JSON.stringify(pins)); } catch (e) { /* 화면엔 표시됨 */ }
    var marker = addPinMarker(id, lastFix[0], lastFix[1], memo);
    if (memo) marker.openPopup();
  });

  // ── 시작 ──
  function startWalk() {
    if (!navigator.geolocation) { alert('이 브라우저에서는 위치 정보를 사용할 수 없어요.'); leaving = true; location.replace('go.html'); return; }
    if (!isDemo()) window.WalsonTrack && WalsonTrack.send('walk_start', { mode: 'gps' });
    routeCoords = []; routeSamples = []; liveVisited = {}; liveKm = 0; walkGapMs = 0;
    walkStartTime = nowMs();
    enterWalking();
    paintMission();
    showWalkNotice(keepScreen() ? KEEP_TIP : POCKET_TIP, 'info');
    saveActiveRoute(true);
  }

  // ── 앱이 닫혔다 다시 열렸을 때 이어 하기 ──
  (function resumeActiveRoute() {
    var a = loadActiveRoute();
    if (!a) return;
    if (isDemo()) {
      // 시연 모드 중엔 진짜 산책을 건드리지 않는다 — 끄고 이어 갈지 묻는다
      // (여기서 산책 나가기로 보내면 산책 나가기가 진행 중인 산책을 보고 다시 여기로 보내서 멈추지 않는다)
      leaving = true;
      if (confirm('길 기록 중인 진짜 산책이 있어요.\n시연 모드를 끄고 이어서 기록할까요?\n\n취소: 시연 모드를 그대로 두고 [오늘]로')) PetwalkDemoGeo.disable();
      else location.replace('index.html');
      return;
    }
    var samples = (Array.isArray(a.samples) ? a.samples : []).filter(function (p) {
      return Array.isArray(p) && isFinite(p[0]) && isFinite(p[1]) && isFinite(p[2]);
    }).map(function (p) { return { c: [p[0], p[1]], t: p[2] }; });
    var lastT = samples.length ? samples[samples.length - 1].t : a.startedAt;
    routeSamples = samples;
    routeCoords = samples.map(function (p) { return p.c; });
    lastFix = routeCoords.length ? routeCoords[routeCoords.length - 1] : null;
    liveKm = +a.liveKm || 0;
    liveVisited = a.visited && typeof a.visited === 'object' ? a.visited : {};
    walkGapMs = +a.gapMs || 0;
    walkStartTime = a.startedAt;
    // 마지막 위치 뒤로 오래 지났으면(끝내기를 잊은 산책) 이어 하지 않고, 그때 끝난 걸로 저장할지 묻는다
    if (Date.now() - Math.max(lastT, a.savedAt || 0) > ROUTE_STALE_MS) {
      if (routeSamples.length < 2) { clearActiveRoute(); return; }
      var t = new Date(lastT);
      var when = (t.getMonth() + 1) + '월 ' + t.getDate() + '일 ' + t.getHours() + '시 ' + pad2(t.getMinutes()) + '분';
      if (confirm('끝내지 않은 길 기록 산책이 있어요.\n마지막으로 위치를 받은 ' + when + '에 끝난 걸로 저장할까요?\n\n' +
          '확인: 그때 끝난 걸로 저장\n취소: 저장하지 않고 지우기')) {
        walking = true;
        stopWalk({ endMs: lastT });
      } else {
        clearActiveRoute();
      }
      return;
    }
    enterWalking();
    freshFix();
    paintMission();
    showWalkNotice('산책을 이어서 기록해요. 닫혀 있던 동안은 직선으로 이어져요.', 'info');
    saveActiveRoute(true);
  })();

  // ── 산책 나가기의 "산책 시작"(위치 사용)이나 [동네] 미션 카드로 왔으면 바로 시작(?start=1, 1단계) ──
  (function autoStart() {
    if (walking || leaving || !/[?&]start=1/.test(location.search)) return;
    try { history.replaceState(null, '', location.pathname); } catch (e) { /* 새로 고침하면 산책 나가기로 간다 */ }
    if (window.PetwalkSample && PetwalkSample.isOn()) return;   // 샘플을 보는 중이면 산책 나가기에서 끄기를 먼저 묻는다
    if (!locationExplained && !isDemo()) {   // 시연 모드는 가짜 위치라 권한을 묻지 않는다(2026-11-16)
      // CLAUDE.md — 위치 권한을 묻기 전에 왜 필요한지 먼저 설명한다(산책 나가기를 거치지 않고 온 경우)
      if (!confirm('길을 기록하려면 위치 정보가 필요해요.\n위치는 이 휴대폰 안에서만 쓰고 어디로도 보내지 않아요. 허용할까요?')) return;
      locationExplained = true;
      try { localStorage.setItem(LOCATION_EXPLAINED_KEY, '1'); } catch (e) { /* 다음에 다시 묻는다 */ }
    }
    startWalk();
  })();

  // 산책 중이 아니면 이 화면은 할 일이 없다 — 산책 나가기로(시작은 거기서 한다)
  if (!walking && !leaving) { leaving = true; location.replace('go.html'); }

  // "홈 화면에 추가"(PWA) 조건 때문에 서비스워커를 둔다(캐싱은 안 함)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* 무시 */ });
})();
</script>
</body>
