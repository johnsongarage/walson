<style>
  /* 산책 중 화면 — 위치를 쓰는 산책(2026-11-16 2단계, 가르시아 "시안대로 2단계 바로 진행해줘", 시안 캔버스 ⑪·⑫).
     예전엔 지도가 바탕인 화면이었다. 이제 11/13 C안대로 큰 시간이 주인공이고, 위치를 쓰면 미션 카드·알림 띠가 더해진다.
     지도는 기본으로 숨기고 [지도 보기]를 누를 때 처음 만든다(그때만 지도 그림을 받음) — 펼치면 내 위치와 미션 장소가 같이 보이게.
     시설 핀·추천 루트·발자국은 뺐다(시설은 [동네]에서). 산책 전 화면은 없다 — 시작은 산책 나가기(go.html)에서 한다. */
  :root {
    --bg: #f7ede2; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --accent-ink: #9c4530; --accent-tint: #f3ddd2;
    --locate: #2f7fd8; --shadow-rgb: 74, 63, 53;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); }
  body { display: flex; flex-direction: column; }

  /* 지도 보기(펼침) */
  .map-view { position: fixed; inset: 0; z-index: 50; background: #efe3d2; }
  .map-view[hidden] { display: none; }
  body.map-open { overflow: hidden; }   /* 지도를 펼친 동안 뒤 화면이 같이 밀리지 않게 */
  #map { position: absolute; inset: 0; z-index: 0; }
  /* 지도 컬러톤: 라벤더 파스텔(예전 산책 화면·[동네]와 같은 값) */
  .leaflet-tile-pane { filter: saturate(55%) hue-rotate(220deg) brightness(112%) contrast(92%); }
  /* 도트 지도(2026-11-22, pixel-map.js) — 기본은 위 그림 지도, 위 톱니(설정 판)의 지도 모양에서 바꾼다. 라벤더 필터를 끄고 칸이 뭉개지지 않게 */
  body.map-pixel .leaflet-tile-pane { filter: none !important; image-rendering: pixelated; }   /* !important: 블랙 화면의 지도 뒤집기(theme-black.css)보다 앞서게 */
  .map-top-right { display: flex; align-items: center; gap: 8px; }
  /* 지도 위 설정(2026-11-23 가르시아 "산책 지도에도 달아줘" + "모아줘"): 위쪽 띠 톱니 → 설정 판(quick-set.js — [동네] 지도와 같이 씀)에서
     화면 색·지도 모양([기본]/[도트])·길·장소 이름. 예전 [도트]·[이름] 버튼은 판으로 옮김. 열린 동안 톱니에 고리 */
  #map-set-btn[aria-expanded="true"] { color: var(--accent); box-shadow: 0 0 0 2.5px var(--hl); }
  .map-top { position: absolute; z-index: 500; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none; }
  .map-top > * { pointer-events: auto; }
  .map-sheet { position: absolute; z-index: 500; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px;
    padding: 18px 20px calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-radius: 24px 24px 0 0;
    box-shadow: 0 -6px 20px rgba(var(--shadow-rgb), 0.14); }
  .map-sheet b { font-size: 17px; font-weight: 800; }
  .map-sheet p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-soft); word-break: keep-all; }
  .map-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .map-actions button { height: 52px; border-radius: 16px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  #pin-btn { border: 1.5px solid #c9b59d; background: var(--panel); color: var(--ink); }
  #map-close { border: 0; background: var(--accent); color: #fff; }

  /* 지도 위 표시 — 출발점(흰 점) · 지금 위치(파란 점) · 미션 장소(깃발) · 내가 꽂은 핀 */
  .wm-start { border-radius: 50%; background: #fff; border: 3px solid var(--ink); box-sizing: border-box; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .wm-me { position: relative; border-radius: 50%; background: var(--locate); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--locate), 0 2px 10px rgba(0,0,0,0.35); }
  .wm-me::after { content: ''; position: absolute; inset: -11px; border-radius: 50%; background: var(--locate); opacity: 0.3; }
  .wm-flag { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
    color: #fff; border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 3px 10px rgba(var(--shadow-rgb), 0.35); }
  .pin-marker { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--ink); border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.35); }
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--ink); border-radius: 12px; box-shadow: 0 10px 28px rgba(var(--shadow-rgb), 0.2); }
  .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup-content { font-family: 'Pretendard', sans-serif; font-size: 13px; line-height: 1.6; margin: 12px 14px; }
  .pin-popup { display: flex; flex-direction: column; gap: 8px; min-width: 120px; }
  .pin-popup-memo { color: var(--ink); }
  .pin-popup-empty { color: var(--ink-soft); font-style: italic; }
  /* 대략적인 위치일 때 미션 카드 안 '켜는 법' 링크(2026-11-18) */
  .ws-mlink { display: inline-block; margin-left: 4px; font-weight: 800; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
  .pin-delete-btn { align-self: flex-start; border: none; background: none; padding: 2px 0; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; color: #b3392b; }
</style>

<body>

<div class="ws-screen" id="screen">
  <header class="ws-top">
    <div class="ws-chip"><span class="ws-dot" aria-hidden="true"></span><span>길 기록 중 · 위치 사용</span></div>
    <div class="ws-menu-wrap">
      <button type="button" class="ws-icon-btn" id="menu-btn" aria-label="메뉴" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="ws-menu" id="menu" hidden>
        <!-- QR 찍기(2026-11-16 가게 · 11/24 친구 카드 받아 두기) — 산책 중 들른 가게의 체크인 QR과 만난 친구 QR을 이 화면을 떠나지 않고 찍는다(qr-scan.js) -->
        <button type="button" id="qr-scan-link" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2z"/></svg>
          <span>QR 찍기 · 친구·가게</span>
        </button>
        <!-- 화면 켜 두기(2026-11-16 0단계, 기본 꺼짐) — 켜면 화면이 저절로 꺼지지 않아 길이 자세히 남는다 -->
        <button type="button" id="keep-screen-toggle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg>
          <span id="keep-screen-label">화면 켜 두기 · 꺼짐</span>
        </button>
        <!-- 시연 모드(가짜 위치) 켜기는 11/23 밤 [오늘]·[기록] 톱니 판 '시연용'으로 옮겼다(가르시아 "시연 모드도 옮겨", quick-set.js).
             켜져 있으면 demo-geo.js 배지(배속·경로·끄기)가 이 화면에 그대로 뜬다 -->
      </div>
    </div>
  </header>
  <p class="ws-tip" id="pocket-tip">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <span id="pocket-tip-text">화면을 꺼서 주머니에 넣어도 돼요</span>
  </p>
  <main class="ws-clock-area">
    <span class="ws-who" id="who">산책 중</span>
    <div class="ws-clock"><span id="clock">0</span><small>분</small></div>
    <span class="ws-since" id="since"></span>
  </main>
  <section class="ws-mission" id="mission-card" aria-label="미션" hidden></section>
  <div class="ws-notice" id="walk-notice" role="status" hidden><span class="ws-notice-icon" aria-hidden="true"></span><span class="ws-notice-text" id="walk-notice-text"></span></div>
  <footer class="ws-bottom">
    <!-- 여기 찍기 · 응가 찍기(2026-11-17 가르시아) — 누른 자리를 길에 넣는다. 꺼져 있던 사이는 직선으로 잇는다 -->
    <div class="ws-marks">
      <button type="button" class="ws-mark" id="mark-here">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-6.2-6-11a6 6 0 0 1 12 0c0 4.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
        <span>여기 찍기</span>
      </button>
      <button type="button" class="ws-mark" id="mark-poop">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 19h10a3 3 0 0 0 .6-5.9A3 3 0 0 0 15 9.2 3 3 0 0 0 12.5 5c.3 1.2-.4 2-1.5 2.2A3 3 0 0 0 9 9.2a3 3 0 0 0-2.6 3.9A3 3 0 0 0 7 19z"/></svg>
        <span>응가 찍기</span>
      </button>
    </div>
    <button type="button" class="ws-map-btn" id="map-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3.5 6.5v13L9 17l6 2.5 5.5-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg>
      <span>지도 보기</span>
    </button>
    <button type="button" class="ws-end" id="walk-btn"><span class="ws-end-label">끝내기</span></button>
    <p class="ws-hint">주머니 속에서 잘못 눌려도 끝나지 않게 두 번 눌러요</p>
  </footer>
</div>

<!-- 지도 보기(펼침, 시안 ⑫) — 처음 열 때 지도를 만든다 -->
<div class="map-view" id="map-view" hidden>
  <div id="map"></div>
  <div class="map-top">
    <div class="ws-chip is-dark"><span class="ws-dot" aria-hidden="true"></span><span id="map-chip-text">0분 · 길 기록 중</span></div>
    <div class="map-top-right">
      <button type="button" class="ws-icon-btn" id="map-set-btn" aria-label="설정 — 화면 색·지도 모양" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button type="button" class="ws-icon-btn" id="map-close-x" aria-label="지도 닫기">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <section class="map-sheet" aria-label="지금까지 걸은 길">
    <b id="map-mission">지금까지 걸은 길</b>
    <p>펼칠 때 내 위치가 보이게 맞춰요. 점선은 화면이 꺼져 있던 동안이에요. 시설 핀은 [동네]에서 봐요.</p>
    <div class="map-actions">
      <button type="button" id="pin-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-6.2-6-11a6 6 0 0 1 12 0c0 4.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
        <span>핀 꽂기</span>
      </button>
      <button type="button" id="map-close">지도 닫기</button>
    </div>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // 길 기록 자체(위치 받기·거르기·발도장 바로 판정·진행 중 저장·이어 하기·시작·끝내기)는 walk-engine.js(WalkEngine)가 한다(2026-11-17 나눔).
  // 이 화면은 그리기만 — 엔진이 알려 주면(아래 "엔진 연결") 미션 카드·알림 띠·지도·시계를 다시 그린다. 산책 상태는 E.state()로 읽기만 한다.
  // 핀(산책 중 꽂은 메모 — 지도 보기 안에서 꽂고 지운다)·주민증·화면 켜 두기 설정은 store.js(WalsonStore)로 읽고 쓴다
  // 화면 켜 두기(Wake Lock)·진동은 device.js(WalsonDevice)가 한다 — 이 화면은 언제 켜 두고 언제 울릴지만 정한다
  var E = window.WalkEngine;
  // 위치를 아직 모를 때 지도 처음 자리 = 서울(11/25 가르시아 "너무 줌아웃, 일단 서울 줌인" — 11/24엔 남한 전체, 예전엔 다산동 공원들의 가운데). town.html과 같은 값
  var START = { center: [37.5665, 126.978], zoom: 12 };
  // 화면 켜 두기는 기본 켜짐(2026-11-17 가르시아 "앱을 켜고 산책하게 만들어, 앱을 켜야 보상되게") — 끈 사람만 꺼짐
  // (설정 petwalk_keep_screen_off = '1'), 산책 중일 때만 잡는다. 웹앱은 화면이 꺼지거나 다른 앱으로 가면 위치를 못 받는다.
  var KEEP_SCREEN_OFF_KEY = WalsonStore.KEYS.keepScreenOff;
  var keepAwake = WalsonDevice.keepAwake;
  var POCKET_TIP = '화면을 끄면 그동안 길이 안 그려져요. 응가 자리나 쉬는 곳에서 꺼내 "여기 찍기"를 누르면 그 사이는 직선으로 이어요.';
  var KEEP_TIP = '화면을 켜 둘게요 — 앱을 켜 둔 채 걸어야 길이 그려져요.';
  var kmText = E.kmText, pad2 = E.pad2;
  function keepScreen() { return !WalsonStore.flag(KEEP_SCREEN_OFF_KEY); }

  var showWalkNotice = WalkScreen.notice($('walk-notice'));
  var menuCtl = WalkScreen.menu($('menu-btn'), $('menu'));
  $('who').textContent = WalkScreen.walkerLine((WalsonStore.profile() || {}).name);

  // ── 큰 시간 ──
  function tick() {
    var walkStartTime = E.state().startedAt;
    if (!walkStartTime) return;
    var m = Math.max(0, Math.floor((E.now() - walkStartTime) / 60000));
    $('clock').textContent = m;
    $('map-chip-text').textContent = m + '분 · 길 기록 중';
  }
  function paintSince() {
    var s = new Date(E.state().startedAt);
    $('since').textContent = s.getHours() + '시 ' + pad2(s.getMinutes()) + '분에 출발';
  }
  setInterval(tick, 5000);

  // ── 미션 카드(2026-11-15 지도 미션) ── 다음 미션 = 발도장 장소 중 순서대로 안 간 첫 곳(reward-rules.js, 진행도는 엔진이 센다)
  var FLAG_SVG = WalkScreen.ICONS.stamp;
  var ARROW_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l6 9h-4v9h-4v-9H6z" fill="currentColor"/></svg>';
  function targetText(pl) { return pl.name + (pl.kind === 'building' ? ' 앞까지' : '까지'); }
  function paintMission() {
    var card = $('mission-card'), M = E.missionNow(), s = E.state(), lastFix = s.lastFix;
    if (!M || !M.all.length) { card.hidden = true; return; }
    var done = M.all.filter(function (m) { return m.done; }).length, now = M.now;
    var html = '<span class="ws-flag" aria-hidden="true">' + FLAG_SVG + '</span><span class="ws-mbody">';
    var dir = '';
    if (!now) {
      card.className = 'ws-mission is-done';
      html += '<span class="ws-m1">발도장 ' + done + '/' + M.all.length + '</span><span class="ws-m2">미션을 다 했어요</span>';
    } else {
      // 오차가 100m를 넘는 위치(대략적인 위치·실내)로는 '도착'이라 하지 않는다 — 발도장도 오차 50m 안쪽 점으로만 찍힌다(엔진)
      var weak = s.lastAcc != null && s.lastAcc > 100;
      var here = !weak && lastFix && window.RewardRules.distanceKm(lastFix, now.place.center) <= now.place.radiusKm;
      var pending = s.liveVisited[now.place.id] === 'pending';
      card.className = 'ws-mission' + (here ? ' is-here' : '');
      html += '<span class="ws-m1">미션 ' + now.no + ' · 발도장 ' + done + '/' + M.all.length + '</span>' +
        '<span class="ws-m2"></span>' +
        '<span class="ws-m3">' + (weak && !pending ? (s.lastAcc >= 1000 ? '‘대략적인 위치’라 도착을 알 수 없어요' : '위치가 흐려서 도착을 아직 몰라요') +
          '<a class="ws-mlink" href="location-guide.html?back=walk">켜는 법</a>'
          : pending ? '도착! 5분·200m 넘게 걸으면 찍혀요' : here ? '도착했어요' : (keepScreen() ? '도착하면 발도장이 찍혀요' : '도착하면 꺼내서 "여기 찍기"를 눌러 주세요')) + '</span>';
      if (lastFix && !(s.lastAcc >= 1000)) {   // 2km 넘게 틀린 위치로는 방향·거리를 안 보여 준다
        var km = window.RewardRules.distanceKm(lastFix, now.place.center);
        dir = here ? '<span class="ws-mdir">도착</span>'
          : '<span class="ws-mdir"><span style="display:flex;transform:rotate(' + Math.round(E.bearingDeg(lastFix, now.place.center)) + 'deg)">' + ARROW_SVG + '</span>' + kmText(km) + '</span>';
      }
    }
    card.innerHTML = html + '</span>' + dir;
    if (now) card.querySelector('.ws-m2').textContent = targetText(now.place);   // 장소 이름은 글자로만 넣는다
    card.hidden = false;
  }

  // ── 대략적인 위치 알림(2026-11-18 가르시아 "미션 하려면 정교한 위치 기능을 켜도록 가이드") ──
  // 오차 1km 넘는 위치만 15초 넘게 들어오면 정확한 위치가 꺼진 폰이다 — 이대로면 길도 발도장도 안 남는다. 산책마다 한 번만 가운데 카드로.
  // (GPS가 막 잡히는 동안 첫 점이 넓게 오는 건 흔해서 바로 띄우지 않는다. 오차 100m 안쪽 점이 한 번이라도 오면 알리지 않는다)
  var APPROX_KEY = 'petwalk_approx_warned', approxTimer = null, sawGoodFix = false;
  function accText(m) { return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.round(m / 10) * 10 + 'm'; }
  function rememberAcc() {
    var a = E.state().lastAcc;
    if (a == null) return;
    try { sessionStorage.setItem('walson_loc_hint', JSON.stringify({ acc: Math.round(a), at: Date.now(), src: 'walk' })); } catch (e) { /* 안내 화면이 다시 잰다 */ }
  }
  $('mission-card').addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.ws-mlink')) rememberAcc(); });
  function watchAccuracy(s) {
    var acc = s.lastAcc;
    if (acc == null || !s.walking) return;
    if (acc <= 100) { sawGoodFix = true; if (approxTimer) { clearTimeout(approxTimer); approxTimer = null; } return; }
    if (acc < 1000 || sawGoodFix || approxTimer) return;
    var started = String(s.startedAt || '');
    try { if (localStorage.getItem(APPROX_KEY) === started) return; } catch (e) { /* 아래로 */ }
    approxTimer = setTimeout(function () {
      approxTimer = null;
      var s2 = E.state();
      if (sawGoodFix || !s2.walking || !(s2.lastAcc >= 1000) || !window.WalsonMissionAlert || WalsonMissionAlert.isOpen()) return;
      try { localStorage.setItem(APPROX_KEY, started); } catch (e) { /* 이번만 */ }
      WalsonMissionAlert.show({
        icon: 'pin', badge: '위치 오차 약 ' + accText(s2.lastAcc),
        title: '‘대략적인 위치’로 잡혀요',
        lines: ['이대로는 걸은 길이 안 그려져요.', '시간은 계속 재요.'],
        primary: { label: '정확한 위치 켜는 법', href: 'location-guide.html?back=walk', onClick: rememberAcc },
        secondary: { label: '닫기' }
      });
    }, 15000);
  }

  // 바로 판정으로 받은 발도장(엔진 onStamp 'got')을 알린다 — 화면 가운데 카드 + 진동
  // (11/18 가르시아 "가야 할 구역을 갔을 때 알림 형식으로 … 미션이 진행이 된 거니, 가운데 화면을 띄운다던가" — 예전엔 위쪽 알림 띠)
  function announceStamp(pl) {
    var R = window.RewardRules;
    var p = E.missionProgress(), all = R.missions(p);
    var done = all.filter(function (m) { return m.done; }).length, next = R.currentMission(p);
    var text = pl.name + ' 발도장 받았어요 (' + done + '/' + all.length + ')' + (next ? ' · 다음 미션: ' + next.place.name : ' · 미션을 다 했어요');
    if (window.WalsonMissionAlert) {
      WalsonMissionAlert.show({
        icon: 'paw',
        badge: '발도장 ' + done + '/' + all.length,
        title: '발도장 받았어요!',
        place: pl.name,
        lines: [next ? '다음 미션: ' + next.place.name : '미션을 다 했어요. 수고했어요!'],
        primary: { label: '확인' }
      });
    } else showWalkNotice(text, 'stamp');
    // 진동은 이 화면을 한 번이라도 누른 뒤에만 된다(브라우저 규칙) — 주머니에서 막 꺼내 연 화면은 조용히 넘어간다. 진동 없는 기기(아이폰 등)도 조용히
    WalsonDevice.vibrate([90, 60, 90], { onlyAfterTap: true });
  }
  // 도착했지만 아직 5분·200m 전(엔진 onStamp 'pending') — 이것도 가운데 카드로(기준을 넘는 순간 'got'으로 한 번 더 알린다)
  function announceArrival(pl) {
    var text = pl.name + ' 도착! ' + E.RULES.minRewardMinutes + '분·' + Math.round(E.RULES.minRewardKm * 1000) + 'm 넘게 걸으면 발도장이 찍혀요.';
    if (!window.WalsonMissionAlert) { showWalkNotice(text, 'info'); return; }
    WalsonMissionAlert.show({
      icon: 'flag',
      title: '미션 장소 도착!',
      place: pl.name,
      lines: ['산책을 ' + E.RULES.minRewardMinutes + '분·' + Math.round(E.RULES.minRewardKm * 1000) + 'm 넘게 걸으면', '그 순간 발도장이 찍혀요.'],
      primary: { label: '확인' }
    });
    WalsonDevice.vibrate([60], { onlyAfterTap: true });
  }

  // ── 화면 켜 두기 ── 잡고 푸는 일은 device.js(keepAwake), 언제 잡을지(켠 사람 · 산책 중 · 다시 보일 때)는 여기서
  function paintKeepScreen() {
    $('keep-screen-label').textContent = '화면 켜 두기 · ' + (keepScreen() ? '켬' : '꺼짐');
    $('pocket-tip-text').textContent = keepScreen() ? '앱을 켜 둔 채 걸어요 · 통화·유튜브 중엔 기록이 끊길 수 있어요' : '화면을 끄면 길이 끊겨요 · 장소에서 "여기 찍기"';
  }
  paintKeepScreen();
  $('keep-screen-toggle').addEventListener('click', function () {
    WalsonStore.setFlag(KEEP_SCREEN_OFF_KEY, keepScreen());   // 켜져 있으면 끈 사람으로(저장 못 하면 바뀌지 않는다)
    paintKeepScreen();
    menuCtl.close();
    if (keepScreen()) { if (E.state().walking) keepAwake.request(); showWalkNotice(KEEP_TIP, 'info'); }
    else { keepAwake.release(); showWalkNotice(POCKET_TIP, 'info'); }
  });

  // ── 가게 QR 찍기 ──
  if (window.WalsonQR && window.ShopVisits) {
    $('qr-scan-link').hidden = false;
    $('qr-scan-link').addEventListener('click', function () { menuCtl.close(); WalkScreen.scanShop(showWalkNotice); });
  }

  // ── 시연 모드 ── 켜기는 [오늘]·[기록] 톱니 판 '시연용'(walk.html?start=1&demo=1로 온다, 11/23 밤). 끄기는 demo-geo.js 배지의 [끄기]

  // ── 끝내기 ── 두 번 눌러야 끝난다(walk-screen.js). 기록 저장·끝 화면으로 넘기기는 엔진이
  WalkScreen.twoTap($('walk-btn'), '끝내기', function () { E.stop(); });

  // ── 지도 보기(시안 ⑫) — 처음 열 때 만든다 ──
  var map = null, routeLayer = null, markLayer = null, pinLayer = null, mapOpen = false;
  var basicTiles = null, pixelTiles = null, pixelRoute = null, pixelLabels = null, mapStyle = 'basic';
  function initMap() {
    map = L.map('map', { zoomControl: false }).setView(START.center, START.zoom, { animate: false });
    basicTiles = WalsonMapTiles(map);   // 지도 그림 주소는 site-config.js mapTiles 한곳에서 정한다
    // 도트 지도(2026-11-22): 기본은 위 그림 지도, 설정 판의 지도 모양으로 바꾸고 고른 것은 이 휴대폰에 기억한다([동네]와 같이 씀).
    // 도트 칸 색은 OpenStreetMap 그림 색을 기준으로 나누므로 pixel-map.js는 OSM 타일을 직접 받는다.
    if (window.PixelMap) {
      pixelTiles = PixelMap.createLayer({ pixelSize: 4 });
      pixelRoute = PixelMap.createRoute(map, { color: '#b8563a' });
      pixelLabels = PixelMap.createLabels(map);   // 도트 지도 위 길·하천·공원 이름 — 설정 판의 길·장소 이름, 기본은 꺼짐
      setMapStyle(PixelMap.getStyle());
    }
    routeLayer = L.layerGroup().addTo(map);
    markLayer = L.layerGroup().addTo(map);
    pinLayer = L.layerGroup().addTo(map);
    WalsonStore.pins().forEach(function (p) { addPinMarker(p.id, p.lat, p.lng, p.memo); });
  }
  // 걸은 길: 걷는 구간은 실선, 화면이 꺼져 있던 동안(GAP_MS 넘게 끊김)은 점선으로
  function drawMap(fit) {
    var s = E.state(), routeSamples = s.routeSamples, routeCoords = s.routeCoords, lastFix = s.lastFix;
    routeLayer.clearLayers();
    markLayer.clearLayers();
    var solid = { color: '#b8563a', weight: 5, opacity: 0.9 }, dashed = { color: '#b8563a', weight: 4, opacity: 0.85, dashArray: '2 10', lineCap: 'round' };
    var run = [], lines = [];
    for (var i = 1; i < routeSamples.length; i++) {
      var a = routeSamples[i - 1], b = routeSamples[i];
      if (b.t - E.seenT(a) > E.GAP_MS) {
        if (run.length > 1) lines.push({ latlngs: run, dashed: false });
        lines.push({ latlngs: [a.c, b.c], dashed: true });
        run = [b.c];
      } else {
        if (!run.length) run.push(a.c);
        run.push(b.c);
      }
    }
    if (run.length > 1) lines.push({ latlngs: run, dashed: false });
    // 도트 지도면 같은 길을 지도 칸에 맞춘 칸으로(pixel-map.js), 아니면 원래 선으로
    if (mapStyle === 'pixel' && pixelRoute) pixelRoute.setLines(lines);
    else lines.forEach(function (l) { L.polyline(l.latlngs, l.dashed ? dashed : solid).addTo(routeLayer); });
    if (routeCoords.length) L.marker(routeCoords[0], { icon: L.divIcon({ className: 'wm-start', iconSize: [14, 14], iconAnchor: [7, 7] }), interactive: false }).addTo(markLayer);
    // 응가 찍은 자리(이 휴대폰 안에만)
    (s.poopMarks || []).forEach(function (p) {
      L.circleMarker(p.c, { radius: 7, color: '#fff', weight: 2, fillColor: '#8a5a2b', fillOpacity: 1 }).bindTooltip('응가').addTo(markLayer);
    });
    var M = E.missionNow(), now = M && M.now;
    if (now) {
      L.circle(now.place.center, { radius: now.place.radiusKm * 1000, color: '#b8563a', weight: 2, dashArray: '6 6', fillColor: '#b8563a', fillOpacity: 0.07, interactive: false }).addTo(markLayer);
      L.marker(now.place.center, { icon: L.divIcon({ className: '', html: '<div class="wm-flag">' + FLAG_SVG + '</div>', iconSize: [36, 36], iconAnchor: [18, 18] }), interactive: false, zIndexOffset: 500 }).addTo(markLayer);
    }
    if (lastFix) L.marker(lastFix, { icon: L.divIcon({ className: 'wm-me', iconSize: [20, 20], iconAnchor: [10, 10] }), interactive: false, zIndexOffset: 1000 }).addTo(markLayer);
    // 아래 판: 미션까지 거리(직선 1.3배 · 분당 60m로 어림 — shop-visits.js와 같은 셈)
    var line = '지금까지 걸은 길';
    if (now && lastFix) {
      var m = Math.round(window.RewardRules.distanceKm(lastFix, now.place.center) * 1000);
      line = m <= now.place.radiusKm * 1000 ? now.place.name + '에 와 있어요' : '미션까지 ' + kmText(m / 1000) + (window.ShopVisits ? ' · ' + ShopVisits.walkText(m) : '');
    } else if (M && M.all.length && !now) line = '미션을 다 했어요';
    $('map-mission').textContent = line;
    if (fit) fitMap(now);
  }
  // 펼칠 때 내 위치와 미션 장소가 같이 보이게(2026-11-16 결정). 없으면 걸은 길, 그것도 없으면 동네 가운데.
  // 위 칩과 아래 판에 가리지 않게 그만큼 비워 두고 맞춘다
  function fitMap(now) {
    var s = E.state(), lastFix = s.lastFix, routeCoords = s.routeCoords;
    var pts = [];
    if (lastFix) pts.push(lastFix);
    if (now) pts.push(now.place.center);
    var top = document.querySelector('.map-top'), sheet = document.querySelector('.map-sheet');
    var opts = { paddingTopLeft: [28, (top ? top.offsetTop + top.offsetHeight : 70) + 24], paddingBottomRight: [28, (sheet ? sheet.offsetHeight : 200) + 24], maxZoom: 17, animate: false };
    if (pts.length === 2) map.fitBounds(L.latLngBounds(pts), opts);
    else if (pts.length === 1) map.setView(pts[0], 16, { animate: false });
    else if (routeCoords.length > 1) map.fitBounds(L.latLngBounds(routeCoords), opts);
  }
  function openMap() {
    $('map-view').hidden = false;
    document.body.classList.add('map-open');
    mapOpen = true;
    if (!map) initMap(); else map.invalidateSize();
    drawMap(true);
  }
  function setMapStyle(v) {
    mapStyle = v === 'pixel' ? 'pixel' : 'basic';
    if (mapStyle === 'pixel') { map.removeLayer(basicTiles); pixelTiles.addTo(map); }
    else { map.removeLayer(pixelTiles); basicTiles.addTo(map); }
    document.body.classList.toggle('map-pixel', mapStyle === 'pixel');
    pixelRoute.setEnabled(mapStyle === 'pixel');
    // 길·장소 이름은 도트 지도에서만(그림 지도엔 이름이 원래 있다)
    setLabels(mapStyle === 'pixel' && PixelMap.getLabels());
  }
  var labelsOn = false;
  function setLabels(on) {
    labelsOn = on;
    if (!pixelLabels) return null;
    // 지도 데이터를 못 받으면 이름 없이 도트 지도만 — 꺼진 것으로 돌린다(설정 판도 다시 그림)
    return pixelLabels.setEnabled(on).catch(function () { labelsOn = false; });
  }
  // ── 지도 위 설정(2026-11-23 "산책 지도에도 달아줘" + "모아줘") — 톱니 → 설정 판(quick-set.js, [동네] 지도와 같이 씀):
  // 화면 색(프로필 "화면 색"과 같은 설정 — 이 화면은 그림 지도라 색 변수·theme-black.css로 바로 바뀜) · 지도 모양 · 길·장소 이름
  var quickSet = window.WalsonQuickSet ? WalsonQuickSet.attach($('map-set-btn'), {
    side: 'below',
    map: window.PixelMap ? {
      get: function () { return mapStyle; },
      set: function (v) { if (!map) return; setMapStyle(v); PixelMap.setStyle(mapStyle); drawMap(false); },
      labels: function () { return labelsOn; },
      setLabels: function (on) { if (!map) return null; PixelMap.setLabels(on); return setLabels(on); }
    } : null
  }) : null;
  function closeMap() { $('map-view').hidden = true; document.body.classList.remove('map-open'); mapOpen = false; if (quickSet) quickSet.close(); }
  $('map-btn').addEventListener('click', openMap);
  $('map-close').addEventListener('click', closeMap);
  $('map-close-x').addEventListener('click', closeMap);

  // 핀 꽂기 — 지금 위치에 메모 핀(이 휴대폰에만 저장). 팝업의 "이 핀 삭제"로 지운다
  function addPinMarker(id, lat, lng, memo) {
    var marker = L.marker([lat, lng], { icon: L.divIcon({ className: 'pin-marker', iconSize: [28, 28], iconAnchor: [14, 28] }) }).addTo(pinLayer);
    var wrap = document.createElement('div');
    wrap.className = 'pin-popup';
    var memoEl = document.createElement('div');
    memoEl.className = memo ? 'pin-popup-memo' : 'pin-popup-empty';
    memoEl.textContent = memo || '메모 없음';
    wrap.appendChild(memoEl);
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'pin-delete-btn';
    del.textContent = '이 핀 삭제';
    del.addEventListener('click', function () {
      pinLayer.removeLayer(marker);
      var pins = WalsonStore.pins().filter(function (p) { return p.id !== id; });
      WalsonStore.savePins(pins);   // 저장 못 해도 화면에서는 이미 지워짐
    });
    wrap.appendChild(del);
    marker.bindPopup(wrap);
    return marker;
  }
  // ── 여기 찍기 · 응가 찍기 ── 위치를 바로 읽어 길에 점을 넣는다(엔진). 발도장·도착은 엔진이 onStamp로 알려 화면 가운데 카드로 띄운다
  function markBtn(id, kind) {
    var btn = $(id);
    btn.addEventListener('click', function () {
      if (btn.disabled || !E.state().walking) return;
      btn.disabled = true;
      btn.classList.add('is-busy');
      E.markHere(kind).then(function (r) {
        btn.disabled = false;
        btn.classList.remove('is-busy');
        if (!r.ok) { showWalkNotice('아직 위치를 못 받았어요. 하늘이 트인 곳에서 다시 눌러 주세요.', 'warn'); return; }
        WalsonDevice.vibrate(40, { onlyAfterTap: true });
        if (kind === 'poop') showWalkNotice('응가 자리를 찍었어요 · 이번 산책 ' + r.poopCount + '번' + (r.weak ? ' (위치가 흐려서 대략이에요)' : ''), 'info');
        else showWalkNotice(r.weak ? '위치가 흐려서 길에는 못 넣었어요. 하늘이 트인 곳에서 다시 눌러 주세요.' : '여기를 찍었어요 · 화면이 꺼져 있던 사이는 직선으로 이었어요', r.weak ? 'warn' : 'info');
        if (mapOpen) drawMap(false);
      });
    });
  }
  markBtn('mark-here', 'here');
  markBtn('mark-poop', 'poop');

  $('pin-btn').addEventListener('click', function () {
    var s = E.state();
    if (!s.walking || !s.lastFix) { alert('아직 지금 위치를 못 받았어요. 잠시 뒤 다시 눌러 주세요.'); return; }
    var memo = prompt('이 지점에 남길 메모가 있나요? (선택)');
    if (memo === null) return;
    var lastFix = E.state().lastFix, pins = WalsonStore.pins(), id = Date.now();
    pins.push({ id: id, lat: lastFix[0], lng: lastFix[1], memo: memo || null });
    WalsonStore.savePins(pins);   // 저장 못 해도 화면엔 표시됨
    var marker = addPinMarker(id, lastFix[0], lastFix[1], memo);
    if (memo) marker.openPopup();
  });

  // ── 주머니에서 꺼내 열었을 때(화면 쪽) ── 화면 켜 두기를 다시 잡고 시계를 맞춘다.
  // 지금 위치를 바로 읽는 것과 숨겨질 때 저장은 엔진이 한다(엔진보다 먼저 걸어서 예전처럼 화면 켜 두기 → 시계 → 위치 순서)
  document.addEventListener('visibilitychange', function () {
    if (!E.state().walking || document.visibilityState !== 'visible') return;
    if (!keepAwake.held() && keepScreen()) keepAwake.request();
    tick();
  });

  // ── 엔진 연결(walk-engine.js) ──
  E.init({
    // 산책 중/아님이 바뀜 — 산책 중이면 화면 켜 두기(켠 사람만)·출발 시각·시계, 새로 시작했으면 주머니 안내. 끝나면 화면 켜 두기를 푼다
    // (주머니·화면 켜 두기 안내는 화면 켜 두기 설정을 아는 화면이 띄운다 — 예전 startWalk 끝에서 띄우던 것과 같은 글)
    onState: function (s, why) {
      if (s.walking) {
        if (keepScreen()) keepAwake.request();
        paintSince();
        tick();
        // 시작할 때 가운데 안내 상자는 띄우지 않는다 — 위 알약(#pocket-tip)이 같은 말을 늘 보여 줘서 두 번 나왔다(2026-11-23 밤 출시 점검).
        // 화면 켜 두기를 바꿀 때의 안내(위 keep-screen 토글)는 그대로
      } else {
        keepAwake.release();
      }
    },
    // 위치가 들어와 바뀜 — 미션 카드, 지도를 펼쳐 둔 중이면 지도도(mapToo가 false면 지도는 그대로)
    onFix: function (s, mapToo) {
      paintMission();
      watchAccuracy(s);
      if (mapToo && mapOpen) drawMap(false);
    },
    // 바로 판정한 발도장 — 받음·도착 모두 화면 가운데 카드(mission-alert.js)와 진동. 도착했지만 5분·200m 전이면 "도착" 카드만(기준을 넘는 순간 받는다)
    onStamp: function (pl, kind) {
      if (kind === 'got') { announceStamp(pl); return; }
      announceArrival(pl);
    },
    // 엔진이 보여 달라는 안내(끊겼다 다시 이어서 기록 · 이어 하기)
    onNotice: function (text, kind) { showWalkNotice(text, kind); }
  });
  // 앱이 닫혔다 다시 열렸으면 이어 하기 → 산책 나가기·[동네]에서 ?start=1로 왔으면 바로 시작 → 그래도 산책 중이 아니면 산책 나가기로
  E.resume();
  E.autoStart();
  E.exitIfIdle();

  // "홈 화면에 추가"(PWA) 조건 때문에 서비스워커를 둔다(캐싱은 안 함)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* 무시 */ });
})();
</script>
</body>
</html>
