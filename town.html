<style>
  /* [동네] — 지도가 주인공인 곳(2026-11-14, 화면 구조 C안: SPEC_STAGE0.md 4절).
     보여 주는 것: 동네 시설 핀, 주의 구역, 내 발도장(공원·아울렛), 산책 중에 내가 찍어 둔 핀.
     산책을 기록하는 화면이 아니다 — 기록은 walk.html.
     지도는 전국에서 연다(11/24 전국판 — 예전엔 다산동 산책 벨트에 고정). 열 때 내 위치로 옮기지 않는다(집 근처가 저절로 뜨지 않게).
     내 위치는 오른쪽 버튼을 눌렀을 때만, 이유를 먼저 설명하고 읽는다. 밖으로 보내는 것은 지도 타일 요청뿐. */
  :root {
    --bg: #f7ede2; --bg-deep: #efe0cd; --panel: #fffaf3; --panel-border: #e6d6c1;
    --ink: #4a3f35; --ink-soft: #6b5d4e; --accent: #b8563a; --locate: #3b7dc4;
    --shadow-rgb: 74, 63, 53; --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); }
  /* tabbar.js가 body에 아래 여백을 넣는데, 이 화면은 지도가 직접 탭 위까지만 차도록 잡는다 */
  body { padding: 0 !important; overflow: hidden; }
  #map { position: fixed; top: 0; left: 0; right: 0; bottom: var(--tabbar-h, 58px); background: var(--bg-deep); }
  .leaflet-container { font-family: inherit; }
  /* OSM 기본 지도를 앱의 파스텔 톤으로 눌러 준다 — walk.html과 같은 값 */
  .leaflet-tile-pane { filter: saturate(55%) hue-rotate(220deg) brightness(112%) contrast(92%); }
  /* 벡터 지도(map-vector.js)일 땐 색을 지도 쪽에서 정하니 그림 필터(위·theme-black.css 뒤집기)를 끈다 */
  html.walson-vector-map .leaflet-tile-pane { filter: none !important; }
  /* 도트 지도(2026-11-22, pixel-map.js — [산책]과 같은 선택): 필터(파스텔·블랙 뒤집기) 없이, 칸이 뭉개지지 않게 */
  body.map-pixel .leaflet-tile-pane { filter: none !important; image-rendering: pixelated; }

  .title-chip {
    position: fixed; top: 14px; left: 14px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius-pill);
    padding: 9px 16px; font-size: 15px; font-weight: 800;
    box-shadow: 0 4px 14px rgba(var(--shadow-rgb), 0.15);
  }
  /* 제목 칩은 뺐다(2026-11-15 가르시아 "동네가 꼭 써 있어야 하나" — 아래 탭이 이미 [동네]). 위에서부터 쌓이는 것들: 묶음 칩 → (펼친 묶음의) 레이어 칩 → 주의 문구 → 운영자 버튼.
     펼치면 아래 것들이 저절로 밀리게 한 덩어리로 둔다(2026-11-15 묶음·우선순위). */
  .top-stack {
    position: fixed; top: 14px; left: 14px; right: 60px; z-index: 1000;
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; pointer-events: none;
  }
  .top-stack > * { pointer-events: auto; }
  /* 이 지역 탐색(2026-11-24 가르시아 "다른 구역을 지도만 옮겨서 구경할 수도 있잖아? 그 지역 탐색이라고 기능 넣으면") —
     지도를 동네 크기로 다른 곳에 옮기면 칩 줄 아래에 뜨는 알약. 누르면 그 지역의 동반 가게·급할 때·지킴이를 지도 가운데 기준으로 */
  .explore-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; margin: 6px 0 2px; padding: 0 14px 0 11px;
    border-radius: 999px; border: 1.5px solid var(--accent); background: var(--panel); color: var(--accent);
    font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(var(--shadow-rgb), 0.18); }
  .explore-btn.is-on { background: var(--accent); color: var(--panel); }
  .explore-btn svg { flex-shrink: 0; }
  /* 빈 동네 안내(11/24 전국판) — 기준점(내 위치·탐색한 곳) 근처에 등록된 곳이 없을 때 목록 버튼 아래 한 줄 */
  .area-note { margin: 8px 2px 0; font-size: 12px; line-height: 1.5; color: var(--ink-soft); word-break: keep-all; }
  .area-note a { color: var(--accent); font-weight: 800; text-decoration: none; white-space: nowrap; }
  .chips {
    align-self: stretch; display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chips[hidden] { display: none; }
  /* 펼친 줄은 칩이 많아서 옆으로 밀지 않고 여러 줄로 */
  #sub-chips { flex-wrap: wrap; overflow-x: visible; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; display: flex; align-items: center; gap: 5px;
    min-height: 32px; padding: 0 9px 0 7px; border-radius: var(--radius-pill);
    border: 1px solid var(--panel-border); background: var(--panel); color: var(--ink-soft);
    font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.1);
  }
  .chip:active { transform: scale(0.96); }
  .chip .dot { width: 18px; height: 18px; border-radius: 50%; color: #fff; opacity: 0.45; display: flex; align-items: center; justify-content: center; }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-soft); }
  .chip[aria-pressed="true"] .dot { opacity: 1; }
  .chip .count { font-weight: 500; color: var(--ink-soft); }
  /* 묶음 칩: 여러 레이어가 든 묶음은 누르면 아래 줄이 펼쳐진다 */
  .chip .caret { font-size: 9px; color: var(--ink-soft); transition: transform 0.15s; }
  /* 글자색(--ink) 칸 위 글씨는 바탕색 변수(--bg)로 — #fff로 박으면 블랙에선 --ink가 흰색이라 흰 칸에 흰 글씨가 된다
     (2026-11-23 가르시아 캡처: 지도 얼굴 발도장의 숫자 배지. 이 화면 일곱 곳을 같이 고침) */
  .chip[aria-expanded="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip[aria-expanded="true"] .count, .chip[aria-expanded="true"] .caret { color: #fff; }
  .chip[aria-expanded="true"] .caret { transform: rotate(180deg); }
  .chip.is-all { border-style: dashed; padding: 0 10px; }
  /* 켜져 있지만 지금은 너무 넓게 봐서 안 보이는 레이어 */
  .chip.is-far { border-style: dashed; }
  .chip.is-far .dot { opacity: 0.45; }
  .draft-note { font-size: 11px; font-weight: 800; color: #fff; background: #3f7d4a; padding: 4px 10px; border-radius: var(--radius-pill); margin-bottom: 4px; }
  .draft-note[hidden] { display: none; }

  /* 상시 주의 문구(기획표 V1-21) — 핀이 없는 곳을 "안전하다"고 읽지 않게 */
  .acc-note { white-space: normal !important; color: #2f6aa8 !important; background: rgba(255,255,255,0.85); border-radius: 8px; padding: 3px 6px; }
  .acc-note[hidden] { display: none; }
  /* 휴대폰에서 대략적인 위치면 '정확한 위치 켜는 법'(location-guide.html)으로 — 이 줄만 눌린다 */
  .caveat.acc-note { pointer-events: auto !important; }
  .acc-note a { color: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 2px; }
  .ls-warn { margin: 0 0 8px; padding: 12px 14px; border-radius: 12px; background: #fdeee9; border: 1.5px solid #e9b4a6; font-size: 13px; line-height: 1.55; color: var(--ink); }
  .ls-warn strong { display: block; font-size: 14px; font-weight: 800; }
  .ls-warn a { display: inline-block; margin-top: 4px; font-weight: 800; color: var(--accent-ink, #9c4530); }
  .caveat {
    align-self: flex-start; max-width: 100%; margin: 0 0 4px 4px; pointer-events: none !important;
    font-size: 11.5px; font-weight: 700; color: var(--ink-soft); pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    /* 2026-11-23 밤 출시 점검: 지도 그림 위에서 글씨가 묻혀서 반투명 바탕(11/17 기준 C4) */
    background: color-mix(in srgb, var(--panel) 84%, transparent); border-radius: 8px; padding: 2px 7px;
  }

  .side { position: fixed; top: 14px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
  .side button {
    width: 38px; height: 38px; padding: 0; border: none; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #fffefb 0%, #fdf6ea 100%); color: var(--ink);
    font-family: inherit; font-size: 20px; font-weight: 700; line-height: 1;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 14px rgba(var(--shadow-rgb), 0.18);
  }
  .side button:active { transform: scale(0.94); }
  /* 내 위치 찾는 중 — 아이콘이 천천히 돈다 */
  .side button.is-busy svg { animation: locate-spin 1s linear infinite; }
  @keyframes locate-spin { to { transform: rotate(360deg); } }
  /* 지도 위 설정(2026-11-23 가르시아 "테마 변경을 좀 쉽게… 지도에 설정 버튼 달아봐" → "모아줘"): 오른쪽 버튼 줄 맨 위 톱니 →
     설정 판(quick-set.js — [산책] 지도와 같이 씀)에서 화면 색·지도 모양([기본]/[도트])·길·장소 이름. 열린 동안 톱니에 고리 */
  .side .set-btn svg { width: 21px; height: 21px; }
  .side .set-btn[aria-expanded="true"] { color: var(--accent); box-shadow: 0 0 0 2.5px var(--hl), 0 4px 14px rgba(var(--shadow-rgb), 0.18); }

  /* 동네 스타 — 사진이 있는 동반 스팟(가게 수호지킴이)을 지도 아래에 줄 세워 먼저 보여 준다(2026-11-14) */
  .stars {
    position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h, 58px) + 10px); z-index: 1000;
    display: flex; gap: 10px; overflow-x: auto; padding: 4px 14px 6px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .stars[hidden] { display: none; }
  .stars::-webkit-scrollbar { display: none; }
  .star {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px; width: 210px;
    padding: 8px 12px 8px 8px; border-radius: 18px; border: 1px solid var(--panel-border);
    background: var(--panel); color: var(--ink); font-family: inherit; text-align: left; cursor: pointer;
    box-shadow: 0 4px 14px rgba(var(--shadow-rgb), 0.18);
  }
  .star:active { transform: scale(0.98); }
  .star img { flex-shrink: 0; width: 56px; height: 56px; border-radius: 14px; object-fit: cover; border: 3px solid var(--accent); }
  .star .t1 { font-size: 11px; font-weight: 800; color: var(--accent); }
  .star .t2 { font-size: 16px; font-weight: 800; line-height: 1.25; }
  .star .t3 { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .leaflet-popup-content { margin: 12px 12px 10px; }

  .tool-link {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 800; color: #fff; background: var(--accent);
    padding: 8px 14px; border-radius: var(--radius-pill); text-decoration: none;
    box-shadow: 0 4px 12px rgba(var(--shadow-rgb), 0.25);
  }
  .tool-link[hidden] { display: none; }
  /* ── 목록 시트(2026-11-18, 가르시아 "공원 홍보 전에 1단계 적용해줘" — hq notes/petwalk-map-list-view-plan.md A안 1단계,
     시안 map-sheet-proto.html) ──
     예전 아래쪽 덩어리(미션 카드 + 급할 때·동반 가게·QR·수호견 버튼 줄)와 따로 뜨던 목록 판 둘(급할 때·동반 가게)을 시트 하나로 합쳤다.
     접힘(기본): 요약 줄("이 화면 N곳 · 종류별 개수") + 볼 것 버튼 + 미션 카드 / 반: 고른 것의 목록 / 펼침: 같은 목록을 크게.
     손잡이·요약 줄을 끌거나 눌러서 바꾸고, 지도나 핀을 누르면 접힌다. 시트 높이만 바뀌고 지도는 그대로다. */
  .list-sheet {
    position: fixed; left: 0; right: 0; bottom: var(--tabbar-h, 58px); z-index: 1001;
    display: flex; flex-direction: column; word-break: keep-all; overflow: hidden;
    background: var(--panel); border-top: 1px solid var(--panel-border); border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 24px rgba(var(--shadow-rgb), 0.2);
    transition: height 0.22s ease;
  }
  /* PC처럼 넓은 화면에선 가운데 한 칸만(예전 미션 카드처럼) — 양옆 지도는 그대로 보이게 */
  @media (min-width: 700px) { .list-sheet { left: 50%; right: auto; width: 480px; transform: translateX(-50%); border-left: 1px solid var(--panel-border); border-right: 1px solid var(--panel-border); } }
  .list-sheet.is-dragging { transition: none; }
  @media (prefers-reduced-motion: reduce) { .list-sheet { transition: none; } }
  .ls-grab { flex: none; display: flex; justify-content: center; padding: 8px 0 6px; cursor: grab; touch-action: none; }
  .ls-grab .bar { width: 40px; height: 5px; border-radius: 3px; background: #d8c8b3; }
  .ls-head { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 0 14px 10px; }
  .ls-top { display: flex; align-items: center; gap: 8px; }
  .ls-summary {
    flex: 1; min-width: 0; min-height: 32px; display: flex; align-items: center; gap: 8px;
    padding: 0; border: none; background: none; color: var(--ink); font-family: inherit; text-align: left; cursor: pointer; touch-action: none;
  }
  /* 요약은 한 줄 — 넘치면 … (종류별 개수가 많아져도 시트 높이가 들쭉날쭉하지 않게) */
  .ls-summary .sum { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ls-summary b { font-size: 14px; font-weight: 800; }
  .ls-summary .cnt { margin-left: 8px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .ls-summary .cnt i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .ls-summary .more { flex: none; font-size: 12px; font-weight: 800; color: var(--accent); white-space: nowrap; }
  .list-sheet[data-state="peek"] .ls-close { display: none; }
  .ls-modes { display: flex; flex-wrap: wrap; gap: 6px; }
  /* 2026-11-23 밤 출시 점검: 키가 작은 폰(높이 720 이하)에선 아래 판이 지도를 3분의 1쯤 가려서 단추를 한 줄로(옆으로 밀기),
     친구와 서로 찍는 QR 찍기를 맨 앞에. 오른쪽 끝이 흐려져 더 있다는 게 보이게 */
  @media (max-height: 720px) {
    .ls-modes { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 2px;
      -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
    .ls-modes::-webkit-scrollbar { display: none; }

    <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232,120H215.63A88.13,88.13,0,0,0,136,40.37V24a8,8,0,0,0-16,0V40.37A88.13,88.13,0,0,0,40.37,120H24a8,8,0,0,0,0,16H40.37A88.13,88.13,0,0,0,120,215.63V232a8,8,0,0,0,16,0V215.63A88.13,88.13,0,0,0,215.63,136H232a8,8,0,0,0,0-16Zm-104,80a72,72,0,1,1,72-72A72.08,72.08,0,0,1,128,200Zm0-112a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152Z"/></svg>
  </button>
</div>
<div class="stars" id="stars" hidden aria-label="동네 스타"></div>
<!-- 목록 시트(2026-11-18) — 지도 위에 끌어 올리는 목록. 접힘: 요약 줄 + 볼 것 버튼 + 미션 카드 / 반·펼침: 고른 것의 목록.
     예전 아래쪽 덩어리(미션 카드·버튼 줄)와 급할 때·동반 가게 판 둘을 합쳤다. 산책 버튼(walk-fab.js)은 접혔을 때 이 시트 바로 위에 붙는다 -->
<section class="list-sheet" id="list-sheet" data-state="peek" aria-label="지도 목록">
  <div class="ls-grab" id="ls-grab" role="button" tabindex="0" aria-label="목록 크기 바꾸기"><span class="bar"></span></div>
  <div class="ls-head" id="ls-head">

      <button type="button" class="ls-mode is-sos" id="sos-link" aria-pressed="false" hidden>급할 때</button>
      <button type="button" class="ls-mode" id="shop-link" aria-pressed="false" hidden>동반 가게</button>

    <p class="sheet-note" id="ls-note"></p>
  </div>
</section>

<script src="tabbar.js?v=11" data-tab="town"></script>
<script>
(function () {
  // 처음 보이는 곳 = 서울(11/25 가르시아 "지도가 너무 줌아웃된 상태로 나와, 일단 서울 줌인하고" — 11/24 전국판 땐 남한 전체 네모,
  // 그 전엔 아울렛·다산중앙공원·다산수변공원의 가운데). 위치를 허용한 기기는 열자마자 내 위치로(아래 autoLocate) — walk.html과 같은 값
  var START = { center: [37.5665, 126.978], zoom: 12 };
  // 산책 기록·산책 중에 내가 찍은 핀(walk.html이 저장)·주민증·진행 중 산책은 store.js(WalsonStore)로 읽는다
  var LOCATION_EXPLAINED_KEY = 'petwalk_location_explained';  // 위치 쓰는 이유를 이미 설명했는지

  // 스팟 편집 버튼은 운영자 기기에서만 — 여기서 고친 내용은 커밋되어 모든 사람에게 반영된다
  document.getElementById('tool-link').hidden = !InfraPins.isAdminDevice();
  document.getElementById('draft-note').hidden = !InfraPins.DRAFT_PREVIEW;

  var map = L.map('map', { zoomControl: false }).setView(START.center, START.zoom, { animate: false });
  // 수호견 예시 화면(2026-11-17): 예시가 모두 바로 보이게 옮기고, 아래에 '예시 화면' 띠를 단다
  // 예시는 스팟 편집에서 늘리거나 줄일 수 있어 몇 마리든 다 들어오게 맞춘다(한 마리면 그 자리로, 최대 확대 16)
  if (InfraPins.GUARDIAN_DEMO && InfraPins.DEMO_GUARDIANS.length) {
    var dg = InfraPins.DEMO_GUARDIANS;
    map.fitBounds(L.latLngBounds(dg.map(function (p) { return [p.lat, p.lng]; })),
      { maxZoom: 16, paddingTopLeft: [40, 150], paddingBottomRight: [40, 200], animate: false });
    window.addEventListener('load', function () {
      var wrap = document.querySelector('.tabbar-wrap');
      if (!wrap) return;
      var band = document.createElement('div');
      band.className = 'sample-band';
      band.setAttribute('role', 'status');
      band.appendChild(document.createTextNode('지킴이 예시 화면 · 실제 지도에는 없어요'));
      var off = document.createElement('a');
      off.href = 'town.html';
      off.textContent = '예시 끄기';
      band.appendChild(off);
      wrap.insertBefore(band, wrap.firstChild);
      // 띠만큼 지도와 목록 시트를 올린다(--tabbar-h에는 이 띠가 안 들어 있다 — 안 올리면 시트가 띠를 덮는다)
      document.documentElement.style.setProperty('--tabbar-h', wrap.offsetHeight + 'px');
      map.invalidateSize();
      relayoutSheet();
    });
  }
  // 시험: [동네] 지도만 벡터 지도(길·건물·글자 색을 따로 정함, map-vector.js). 못 받으면 원래 그림 지도로.
  // 도트 지도(2026-11-22, pixel-map.js): 고른 것은 [산책] 지도와 같이 쓴다(localStorage). 11/23 "모아줘" — 지도 위 [도트]·[이름] 버튼을 빼고
  // 설정 판(quick-set.js)의 지도 모양·길·장소 이름에서 바꾼다(mapCtl).
  var mapCtl = null;
  (function () {
    var fallbackTiles = null, vectorStarted = false;
    function startVector() {
      vectorStarted = true;
      WalsonVectorTiles(map, function (m) { fallbackTiles = WalsonMapTiles(m); });
    }
    if (!window.PixelMap) { startVector(); return; }
    var pixelTiles = PixelMap.createLayer({ pixelSize: 4 });
    var labels = PixelMap.createLabels(map);
    var mode = 'basic', labelsOn = false;
    function baseLayers() { return [window.WalsonVectorLayer, fallbackTiles].filter(Boolean); }
    // 벡터 지도는 늦게 도착한다 — 그사이 도트로 바꿨으면 도착하는 대로 뺀다
    map.on('layeradd', function (e) {
      if (mode === 'pixel' && baseLayers().indexOf(e.layer) >= 0) map.removeLayer(e.layer);
    });
    // 길·장소 이름 층 — 지도 데이터를 못 받으면 꺼진 것으로 돌린다(설정 판도 다시 그림)
    function setLabels(on) {
      labelsOn = on;
      return labels.setEnabled(on).catch(function () { labelsOn = false; });
    }
    function setMode(v) {
      mode = v === 'pixel' ? 'pixel' : 'basic';
      if (mode === 'pixel') {
        baseLayers().forEach(function (l) { if (map.hasLayer(l)) map.removeLayer(l); });
        pixelTiles.addTo(map);
      } else {
        if (map.hasLayer(pixelTiles)) map.removeLayer(pixelTiles);
        var base = baseLayers();
        if (base.length) base.forEach(function (l) { l.addTo(map); });
        else if (!vectorStarted) startVector();
      }
      document.body.classList.toggle('map-pixel', mode === 'pixel');
      setLabels(mode === 'pixel' && PixelMap.getLabels());   // 기본 지도엔 이름이 원래 있다
    }
    setMode(PixelMap.getStyle());
    mapCtl = {
      get: function () { return mode; },
      set: function (v) { setMode(v); PixelMap.setStyle(mode); },
      labels: function () { return labelsOn; },
      setLabels: function (on) { PixelMap.setLabels(on); return setLabels(on); }
    };
  })();
  // 지도 출처 표기는 왼쪽 아래로 — 오른쪽 아래엔 산책 버튼이 붙는다(목록 시트 위로 올리는 건 CSS --ls-h)
  if (map.attributionControl) map.attributionControl.setPosition('bottomleft');
  document.getElementById('zoom-in').addEventListener('click', function () { map.zoomIn(); });
  document.getElementById('zoom-out').addEventListener('click', function () { map.zoomOut(); });

  // ── 지도 위 설정(2026-11-23 가르시아 "지도에 설정 버튼 달아봐 거기서 하게 해" → "모아줘") ──
  // 톱니 → 설정 판(quick-set.js, [산책] 지도와 같이 씀): 화면 색(프로필 "화면 색"과 같은 설정) · 지도 모양 · 길·장소 이름.
  // 화면은 색 변수라 바로 바뀌고, 벡터 지도는 밤(블랙)·낮 색이 따로라 블랙을 오갈 때 다시 칠한다(map-vector.js repaint). 도트·그림 지도는 그대로.
  if (window.WalsonQuickSet) WalsonQuickSet.attach(document.getElementById('set-btn'), {
    side: 'left',
    map: mapCtl,
    onPalette: function (was, k) {
      if ((was === 'black') !== (k === 'black') && window.WalsonVectorTiles && WalsonVectorTiles.repaint) WalsonVectorTiles.repaint();
    }
  });

  // ── 레이어: 시설 종류별 + 내 발도장 + 내 핀 + 그림 강아지 ──
  // 묶음·순서(우선순위)·보이는 확대 단계·처음엔 꺼 둠은 운영자가 스팟 편집에서 정한다(infra-pins.js layout).
  // 순서가 위일수록 칩이 앞에 오고, 핀이 겹치면 위에 그려진다(lay.byKey[key].z).
  var lay = InfraPins.layout();
  var filter = InfraPins.filterState(lay);   // 사용자가 켜고 끈 것 — 이 휴대폰에만, walk.html과 같이 쓴다
  var layers = {};   // key → L.layerGroup
  var counts = {};
  function zOf(key, extra) { return (lay.byKey[key] ? lay.byKey[key].z : 0) + (extra || 0); }
  function addTo(key, marker) {
    if (!layers[key]) layers[key] = L.layerGroup();
    counts[key] = (counts[key] || 0) + 1;
    marker.addTo(layers[key]);
  }

  // ── 동반 가게: 걸어서 N분 · 방문 도장의 단골 Lv(2026-11-15, 기획표 B-49 · B-34) ──
  // 내 위치는 버튼을 눌렀을 때만 읽고(이유를 먼저 설명), 이 화면 메모리에만 둔다. 저장하거나 보내지 않는다.
  // 단골 Lv는 가게 카운터 QR로 찍은 방문 도장(visit.html이 남긴 petwalk_visits)으로 센다(shop-visits.js). 이 화면은 읽기만 한다.
  var myPos = null;     // { lat, lng, accuracy } — 이 화면을 닫으면 사라진다
  // 정확한 위치 켜기 안내(location-guide.html, 2026-11-18) — 넘어갈 때 방금 읽은 위치의 오차(숫자 하나)만 이 창에 넘긴다(sessionStorage, 서버로 안 감)
  var PHONE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || '') || (/Macintosh/.test(navigator.userAgent || '') && navigator.maxTouchPoints > 1);
  var GUIDE_HREF = 'location-guide.html?back=town';
  function accText(m) { return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.round(m / 10) * 10 + 'm'; }
  function rememberAcc() {
    if (!myPos) return;
    try { sessionStorage.setItem('walson_loc_hint', JSON.stringify({ acc: Math.round(myPos.accuracy), at: Date.now(), src: 'town' })); } catch (e) { /* 넘기지 못해도 안내 화면이 다시 잰다 */ }
  }
  function guideLink(text) {
    var a = document.createElement('a');
    a.href = GUIDE_HREF;
    a.textContent = text;
    a.addEventListener('click', rememberAcc);
    return a;
  }
  // 동반 가게 목록 = 같이 갈 수 있는 곳(동반 됨·확인 전)만. 동반이 안 되는 수호견 가게는 빠진다(2026-11-17 가르시아 "같은 레벨")
  var shops = InfraPins.category('spot') ? InfraPins.all().filter(function (p) { return InfraPins.isCompanionShop(p); }) : [];
  var shopUi = {};      // 가게 id → { pin, walkEl, regEl } — 칸을 끈 것은 null
  var shopPins = {};    // 지도에 올린 가게 id → pin(마커 Lv 배지를 다시 그릴 때)
  // 목록 시트 '지금 화면'에 올릴 것 — 지도에 올린 마커마다 { kind, key(레이어), marker, ... }. 그림 강아지는 누를 수 없어서 뺀다
  var viewItems = [];
  function lvBadge(id) { var v = ShopVisits.info(id); return v.level ? 'Lv' + v.level : ''; }
  function shopDist(pin) { return myPos ? ShopVisits.distanceM([myPos.lat, myPos.lng], [pin.lat, pin.lng]) : null; }
  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // 팝업 아래 칸: 걸어서 몇 분 · QR 단골 안내. 무엇을 넣을지는 InfraPins.extraParts(수호견 팝업은 스팟 편집 6번 칸 설정,
  // 동반이 안 되는 가게는 QR 안내 없이 걸어서 몇 분만 — 11/17 가르시아 "보이면 걸어서 몇 분 정도는 해 주자")
  function shopExtraEl(pin) {
    var parts = InfraPins.extraParts(pin);
    if (!parts.walk && !parts.qr) return null;
    var box = mk('div', 'shop-extra');
    var walkEl = parts.walk ? mk('div') : null, regEl = parts.qr ? mk('div', 'reg') : null;
    if (walkEl) box.appendChild(walkEl);
    if (regEl) box.appendChild(regEl);
    shopUi[pin.id] = { pin: pin, walkEl: walkEl, regEl: regEl };
    paintShopExtra(pin.id);
    return box;
  }
  function paintShopExtra(id) {
    var ui = shopUi[id];
    if (!ui) return;
    var pin = ui.pin, d = shopDist(pin);
    if (ui.walkEl) paintWalk(ui, d);
    if (ui.regEl) paintReg(ui, id);
  }
  function paintWalk(ui, d) {
    ui.walkEl.innerHTML = '';
    if (d != null && d > 10000) {   // 다른 동네에서 구경하는 중(11/24 전국판) — 걸어서 몇백 분은 빼고 거리만
      ui.walkEl.className = 'walk-line';
      ui.walkEl.appendChild(document.createTextNode('내 위치에서 직선 ' + ShopVisits.distText(d)));
    } else if (d != null) {
      ui.walkEl.className = 'walk-line';
      ui.walkEl.appendChild(document.createTextNode('여기서 ' + ShopVisits.walkText(d) + ' '));
      ui.walkEl.appendChild(mk('small', '', '직선 ' + ShopVisits.distText(d) +
        (myPos.accuracy > 300 ? ' · 내 위치 오차 약 ' + ShopVisits.distText(myPos.accuracy) : '')));
    } else {
      ui.walkEl.className = '';
      var wb = mk('button', 'walk-btn', '내 위치에서 걸어서 몇 분?');
      wb.type = 'button';
      wb.addEventListener('click', function () { locate().then(refreshShops, function () {}); });
      ui.walkEl.appendChild(wb);
    }
  }
  function paintReg(ui, id) {
    var v = ShopVisits.info(id);
    ui.regEl.innerHTML = '';
    if (!v.count) {
      // 아직 없으면 상자 없이 한 줄만 — QR을 둔 가게인지 이 화면은 모르니 약속하지 않는다
      ui.regEl.className = 'reg-hint';
      ui.regEl.textContent = '카운터에 왈슨 QR이 있는 가게라면 찍어서 방문 도장을 받아요. 처음 1번 단골 Lv1, ' + ShopVisits.LEVEL_STEP + '번마다 Lv가 올라요.';
      return;
    }
    ui.regEl.className = 'reg';
    var top = mk('div', 'reg-top', '방문 도장');
    top.appendChild(mk('span', 'reg-lv', '단골 Lv' + v.level));
    ui.regEl.appendChild(top);
    ui.regEl.appendChild(mk('div', 'reg-text', v.count + '번 다녀갔어요 · Lv' + (v.level + 1) + '까지 ' + v.toNext + '번' + (v.today ? ' · 오늘 찍었어요' : '')));
    ui.regEl.appendChild(mk('div', 'reg-hint', '가게 카운터의 왈슨 QR을 찍으면 하루 한 번 쌓여요.'));
  }
  // 위치를 읽은 뒤: 팝업 칸(걸어서 N분)·마커 Lv 배지·목록을 다시 그린다
  function refreshShops() {
    Object.keys(shopUi).forEach(paintShopExtra);
    Object.keys(shopPins).forEach(function (id) {
      [['shop', shopMarkers[id]], ['guard', guardMarkers[id]], ['cheer', cheerMarkers[id]]].forEach(function (x) {
        var marker = x[1];
        if (!marker) return;
        marker.setIcon(L.divIcon(InfraPins.markerFor(shopPins[id], { as: x[0], badge: lvBadge(id) }).icon));
        if (marker.isPopupOpen()) marker.getPopup().update();
      });
    });
    if (typeof paintMission === 'function' && missionCard) paintMission();
    paintAreaBtns();   // 근처 것만(동반 가게·지킴이 버튼·빈 동네 안내·이 지역 탐색 알약)
    renderSheet();   // 목록 시트(걸어서 몇 분·가까운 순·Lv가 바뀜)
  }

  // 마커와 팝업 모양은 infra-pins.js가 정한다: 동반 스팟(특히 사진 있는 가게 강아지)이 크고 앞에,
  // 나머지 시설은 작고 옅게. 팝업은 사진을 가운데 크게. 동반 스팟 팝업엔 걸어서 N분·방문 도장(단골 Lv) 칸을 붙인다.
  // 아래쪽엔 목록 시트가 있어서 그만큼 비켜 연다(동네 스타 줄은 내림). POPUP_PAD는 모든 팝업이 같이 쓰는 배열이라
  // 시트(접혔을 때) 높이가 바뀌면 [1]만 고친다(fitSheet) — 핀을 누르면 시트가 접히므로 늘 접힌 높이 기준.
  var POPUP_PAD = [16, 190];
  var POPUP_OPTS = L.extend({}, InfraPins.POPUP_OPTS, { autoPanPaddingBottomRight: POPUP_PAD });
  var PAD_OPTS = { autoPanPaddingTopLeft: [16, 120], autoPanPaddingBottomRight: POPUP_PAD };   // 발도장·내 핀 팝업(크기는 기본)
  var spotMarkers = {}; // 스팟 id → 마커(가게가 아닌 시설 — 급할 때 목록에서 그 자리로 가서 연다)
  // 가게(2026-11-17 가르시아 "동반 가게와 수호견 가게는 같은 레벨"): 동반 가게 레이어엔 가게 핀(네모·컵), 수호견 가게 레이어엔 강아지 핀.
  // 둘 다인 가게(A)는 두 레이어에 다 넣고, 수호견 가게가 보이는 동안엔 가게 핀을 숨겨 한 자리에 핀 하나만 둔다(sync).
  // 동반도 안 되고 수호견도 없지만 사장님이 참여한 가게는 응원 가게 레이어(하트 핀, 11/17 가르시아 "응원 가게 만들어").
  // 참여도 안 한 가게(D)는 올리지 않는다.
  var shopMarkers = {}, guardMarkers = {}, cheerMarkers = {}, bothIds = [];
  InfraPins.all().forEach(function (pin) {

    // 팝업은 하나를 두 핀이 같이 쓴다(한 번에 하나만 지도에 있음)
    var popup = InfraPins.popupEl(pin, { extraEl: shopExtraEl(pin) });
    function place(as, key) {
      var m = InfraPins.markerFor(pin, { as: as, badge: lvBadge(pin.id) });
      var marker = L.marker([pin.lat, pin.lng], { icon: L.divIcon(m.icon), title: pin.name || '', zIndexOffset: zOf(key, m.zIndexOffset / 20) })
        .bindPopup(popup, POPUP_OPTS);
      addTo(key, marker);
      viewItems.push({ kind: 'shop', key: key, as: as, pin: pin, marker: marker });   // 둘 다인 가게도 지도엔 핀 하나라 목록에도 하나
      return marker;
    }
    if (asShop) shopMarkers[pin.id] = place('shop', 'spot');
    if (asGuard) guardMarkers[pin.id] = place('guard', 'guard');
    if (asCheer) cheerMarkers[pin.id] = place('cheer', 'cheer');
    if (asShop && asGuard) bothIds.push(pin.id);
  });
  // 지금 이 가게를 나타내는 핀 — 수호견 가게 레이어가 보이면 강아지 핀, 아니면 가게 핀
  function shopMarkerOf(id) {
    var gm = guardMarkers[id], sm = shopMarkers[id];
    if (gm && (!sm || (layers.guard && map.hasLayer(layers.guard)))) return gm;
    return sm || gm || cheerMarkers[id] || null;
  }

  // 수호견 — 있을 때만 목록 시트에 '수호견 N' 버튼(얼굴 카드 2열). 시트 안이라 예시 화면에서도 예시가 사라지지 않는다.
  // 지역별로 모아 보기(guardians.html)는 그 카드 아래 링크로(예시 화면에선 넘어가면 예시가 사라져서 빼 둔다)
  var guardPins = InfraPins.all().filter(function (p) { return p.cat === 'spot' && InfraPins.hasGuardian(p); });
  var guardLink = document.getElementById('guard-link');   // 보일지·몇 마리인지는 근처 것만(아래 paintAreaBtns — 11/24 전국판)

  // ── 동네 스타: 사진이 있는 동반 스팟을 지도 아래에 줄 세운다 ──
  // 2026-11-15 가르시아: 일단 내림 — 수호지킴이는 지도 위 핀으로만 보이고, 목록은 나중에 따로 만든다.
  // 다시 켜려면 SHOW_STAR_LIST를 true로.
  var SHOW_STAR_LIST = false;
  var starsEl = document.getElementById('stars');
  var stars = !SHOW_STAR_LIST ? [] : InfraPins.all().filter(function (p) { return p.cat === 'spot' && InfraPins.mainPhoto(p); });
  stars.forEach(function (pin) {
    var g = InfraPins.hasGuardian(pin) ? pin.guardian : null;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'star';
    var img = document.createElement('img');
    img.src = InfraPins.mainPhoto(pin);
    img.alt = '';
    var sig = g ? InfraPins.SIGNALS[g.signal] : null;
    if (sig) img.style.borderColor = sig.color;
    var text = document.createElement('span');
    var t1 = document.createElement('span'); t1.className = 't1'; t1.textContent = g ? InfraPins.guardianKind(g).badge : '동반 가게';
    var t2 = document.createElement('span'); t2.className = 't2'; t2.textContent = g ? g.name : (pin.name || '');
    var t3 = document.createElement('span'); t3.className = 't3'; t3.textContent = g ? (pin.name || '') : (pin.tags || []).join(' · ');
    [t1, t2, t3].forEach(function (t) { t.style.display = 'block'; text.appendChild(t); });
    btn.appendChild(img);
    btn.appendChild(text);
    btn.addEventListener('click', function () {
      // 동반 가게를 꺼 두었더라도 누르면 다시 켠다
      filter.set(guardMarkers[pin.id] ? 'guard' : 'spot', true); refreshChips();
      // 바로 옮기고 연다 — 팝업이 위쪽 버튼·아래쪽 줄에 가리지 않게 Leaflet이 알아서 지도를 더 옮긴다(autoPan)
      map.setView([pin.lat, pin.lng], Math.max(map.getZoom(), 16), { animate: false });
      sync();
      var sm = shopMarkerOf(pin.id);
      if (sm) sm.openPopup();
    });
    starsEl.appendChild(btn);
  });
  starsEl.hidden = !stars.length;

  // 내 발도장 — 자라는 카드의 장소 도장(reward-rules.js PLACES)과 같은 판정.
  // A(2026-11-15): 다녀간 곳에는 우리 개 얼굴(프로필 사진)과 다녀간 횟수를 띄운다. 발도장 장소 말고
  // 공원(spots-data.js의 공원·쉼터)도 다녀가면 얼굴이 뜬다. 아직 안 간 발도장 장소는 예전처럼 회색 도장.
  var STAMP_SVG = '<svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M212,80a28,28,0,1,0,28,28A28,28,0,0,0,212,80ZM72,108a28,28,0,1,0-28,28A28,28,0,0,0,72,108ZM92,88A28,28,0,1,0,64,60,28,28,0,0,0,92,88Zm72,0a28,28,0,1,0-28-28A28,28,0,0,0,164,88Zm23.12,60.86a35.3,35.3,0,0,1-16.87-21.14,44,44,0,0,0-84.5,0A35.25,35.25,0,0,1,69,148.82,40,40,0,0,0,88,224a39.48,39.48,0,0,0,15.52-3.13,64.09,64.09,0,0,1,48.87,0,40,40,0,0,0,34.73-72Z"/></svg>';
  var myDog = WalsonStore.profile() || {};
  var dogName = myDog.name || '우리 개';
  var FACE_RING = { green: '#3f9b5b', yellow: '#dfa21f', red: '#d2493f' }[myDog.signal] || '#b8563a';
  var stampPlaces = RewardRules.PLACES.filter(function (pl) { return !pl.pending; })
    .map(function (pl) { return { id: pl.id, name: pl.name, center: pl.center, radiusKm: pl.radiusKm, reward: true }; });
  InfraPins.all().forEach(function (p) {
    if (p.cat !== 'park') return;
    var c = [p.lat, p.lng];
    var near = stampPlaces.some(function (pl) { return MapDecoKm(pl.center, c) < 0.2; });
    if (!near) stampPlaces.push({ id: p.id, name: p.name || '공원', center: c, radiusKm: 0.12, reward: false });
  });
  function MapDecoKm(a, b) {
    var t = Math.PI / 180, x = (b[1] - a[1]) * t * Math.cos((a[0] + b[0]) / 2 * t), y = (b[0] - a[0]) * t;
    return Math.sqrt(x * x + y * y) * 6371;
  }
  var visitMap = MapDeco.visits(WalsonStore.walks(), stampPlaces);
  // 지도 미션(2026-11-15): 발도장 장소를 순서대로 하나씩. 진행은 산책 기록으로(reward-rules.js, 산책 끝 판정과 같은 셈)
  var progress = RewardRules.computeProgress(WalsonStore.walks());
  var missionAll = RewardRules.missions(progress);
  var missionNow = RewardRules.currentMission(progress);
  var stampMarkers = {};   // 발도장 장소 id → 마커(미션 카드에서 그 자리로 가서 연다)
  var missionWalkEl = null;
  var FLAG_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M7 4h11l-2.6 4.2L18 12.4H7z" fill="currentColor"/></svg>';
  function missionTarget(m) { return m.place.name + (m.place.kind === 'building' ? ' 앞까지' : '까지'); }
  // 받침에 따라 와/과(왈슨과, 코코와)
  function withJosa(name) {
    var c = name.charCodeAt(name.length - 1);
    if (c < 0xAC00 || c > 0xD7A3) return name + '와(과)';
    return name + ((c - 0xAC00) % 28 ? '과' : '와');
  }
  function shortDate(k) { return k ? Number(k.slice(5, 7)) + '월 ' + Number(k.slice(8, 10)) + '일' : ''; }
  stampPlaces.forEach(function (pl) {
    var v = visitMap[pl.id];
    if (!v && !pl.reward) return;            // 안 간 공원은 비워 둔다(그림 강아지가 채운다)
    var wrap = document.createElement('div');
    wrap.className = 'popup';
    var nameEl = document.createElement('div');
    nameEl.className = 'popup-name';
    nameEl.textContent = pl.name;
    var stateEl = document.createElement('div');
    stateEl.className = 'popup-source';
    wrap.appendChild(nameEl);
    wrap.appendChild(stateEl);
    var icon;
    var isMission = !!(missionNow && pl.reward && pl.id === missionNow.place.id);
    if (isMission) {
      // 지금 미션: 깃발 핀 + 판정 반경 원. 건물이면 "앞까지" — 매장 안 동반은 매장마다 달라서 들어가라고 하지 않는다
      nameEl.textContent = '미션 ' + missionNow.no + ' · ' + pl.name;
      stateEl.textContent = '길 기록 산책으로 이 원 안을 지나가면 발도장이 찍혀요.' +
        (pl.kind === 'building' ? ' 건물 앞까지면 돼요 — 매장 안 동반은 매장마다 달라요.' : '');
      missionWalkEl = document.createElement('div');
      missionWalkEl.className = 'popup-source';
      wrap.appendChild(missionWalkEl);
      icon = L.divIcon({ className: '', html: '<div class="mission-pin"><span class="mp-ring"></span><span class="mp-flag">' + FLAG_SVG + '</span><span class="mp-label">미션 ' + missionNow.no + '</span></div>',
        iconSize: [44, 44], iconAnchor: [22, 70], popupAnchor: [0, -70] });   // 깃발을 그 자리 위로 띄운다 — 같은 곳의 가게 핀에 가리지 않게
      if (!layers.stamp) layers.stamp = L.layerGroup();
      L.circle(pl.center, { radius: pl.radiusKm * 1000, color: '#b8563a', weight: 2, dashArray: '6 6', fillColor: '#b8563a', fillOpacity: 0.07, interactive: false }).addTo(layers.stamp);
    } else if (v) {
      stateEl.textContent = withJosa(dogName) + ' ' + v.count + '번 다녀갔어요 · 처음 ' + shortDate(v.first) + (pl.reward ? ' · 발도장 받음' : '');
      icon = L.divIcon({ className: '', html: MapDeco.faceHtml(myDog.photo, FACE_RING, v.count), iconSize: [46, 46], iconAnchor: [23, 23], popupAnchor: [0, -22] });
    } else {
      stateEl.textContent = '발도장 장소예요. 아직이에요 — 길 기록 산책 중 여기서 산책 화면을 열면 ' + dogName + ' 얼굴이 찍혀요.';
      icon = L.divIcon({ className: '', html: '<div class="stamp">' + STAMP_SVG + '</div>', iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -14] });
    }
    var sm = L.marker(pl.center, { icon: icon, title: pl.name, zIndexOffset: isMission ? 6000 : zOf('stamp', v ? 60 : 0) }).bindPopup(wrap, PAD_OPTS);
    stampMarkers[pl.id] = sm;
    addTo('stamp', sm);
    viewItems.push({ kind: 'stamp', key: 'stamp', place: pl, visit: v, mission: isMission, marker: sm });
  });

  // B. 그림 강아지 — 공원마다 1~2마리. 실제 강아지가 아니라 지도 꾸밈 그림이다(누를 수 없음, 확대했을 때만)
  var decoPlaces = RewardRules.PLACES.filter(function (pl) { return !pl.pending && pl.kind !== 'building'; })
    .map(function (pl) { return { id: pl.id, center: pl.center }; })
    .concat(InfraPins.all().filter(function (p) { return p.cat === 'park'; }).map(function (p) { return { id: p.id, center: [p.lat, p.lng] }; }));
  MapDeco.decoDogs(decoPlaces).forEach(function (d) {
    addTo('deco', L.marker(d.latlng, {
      icon: L.divIcon({ className: '', html: d.html, iconSize: [40, 40], iconAnchor: [20, 36] }),
      interactive: false, keyboard: false, zIndexOffset: zOf('deco')
    }));
  });

  // 산책 중에 내가 찍어 둔 핀 — 여기서는 보기만 한다(지우기는 산책 화면에서)
  WalsonStore.pins().forEach(function (p) {
    if (typeof p.lat !== 'number' || typeof p.lng !== 'number') return;
    var icon = L.divIcon({ className: '', html: '<div class="my-pin"></div>', iconSize: [22, 22], iconAnchor: [11, 22], popupAnchor: [0, -20] });
    var wrap = document.createElement('div');
    wrap.className = 'popup';
    var memo = document.createElement('div');
    memo.textContent = p.memo || '메모 없음';
    var src = document.createElement('div');
    src.className = 'popup-source';
    src.textContent = '내가 찍은 핀 · 이 휴대폰에만 있어요';
    wrap.appendChild(memo);
    wrap.appendChild(src);
    var mm = L.marker([p.lat, p.lng], { icon: icon, zIndexOffset: zOf('mine') }).bindPopup(wrap, PAD_OPTS);
    addTo('mine', mm);
    viewItems.push({ kind: 'mine', key: 'mine', memo: p.memo || '', marker: mm });
  });

  function sync() {
    var zoom = map.getZoom();
    Object.keys(layers).forEach(function (key) {
      // 레이어마다 정해 둔 확대 단계부터 보인다(넓게 볼 때 덜 중요한 핀이 지도를 덮지 않게)
      var show = !!lay.byKey[key] && zoom >= lay.byKey[key].minZoom && !filter.isOff(key);
      if (show && !map.hasLayer(layers[key])) map.addLayer(layers[key]);
      if (!show && map.hasLayer(layers[key])) map.removeLayer(layers[key]);
    });
    // 동반 가게이면서 수호견 가게(A): 수호견 가게가 보이면 강아지 핀 하나만(컵 표시가 동반을 알린다), 꺼지면 가게 핀으로
    var guardShown = !!layers.guard && map.hasLayer(layers.guard);
    if (layers.spot) bothIds.forEach(function (id) {
      var sm = shopMarkers[id];
      if (guardShown && layers.spot.hasLayer(sm)) layers.spot.removeLayer(sm);
      if (!guardShown && !layers.spot.hasLayer(sm)) layers.spot.addLayer(sm);
    });
    refreshChips();
    scheduleSheet();   // 켜고 끈 것·확대 단계가 바뀌면 요약 줄과 '지금 화면' 목록도
  }

  // ── 칩: 윗줄은 묶음, 아랫줄은 펼친 묶음 안의 레이어 ──
  // 핀이 하나도 없는 레이어·묶음은 만들지 않는다(눌러도 아무것도 안 나오는 버튼을 두지 않기 위함).
  // 레이어가 하나뿐인 묶음은 펼치지 않고 그 칩이 바로 켜고 끄는 버튼이 된다.
  var chipsEl = document.getElementById('chips');
  var subEl = document.getElementById('sub-chips');
  // 위 칩은 하나만(2026-11-15 가르시아: 아래가 [급할 때]·[동반 가게] 두 개뿐이니 위도 단출하게 — "갈 곳"에 나머지를 다 넣는다).
  // 스팟 편집의 묶음 순서·확대 단계는 그대로 따르고, 펼친 줄에 모든 레이어가 그 순서로 나온다.
  var allLayers = [];
  lay.groups.forEach(function (g) {
    g.layers.forEach(function (l) { if (counts[l.key] && allLayers.indexOf(l) < 0) allLayers.push(l); });
  });
  var groups = allLayers.length ? [{ id: 'all', label: '갈 곳', layers: allLayers }] : [];
  var openGroup = null;   // 펼친 묶음 id
  var painters = [];      // 상태가 바뀔 때 칩을 다시 칠하는 함수들

  function dotHtml(layer) {
    return '<span class="dot" style="background:' + layer.color + '">' + (layer.system ? '' : InfraPins.iconSvg(layer.key, 11)) + '</span>';
  }
  function span(cls, text) { var e = document.createElement('span'); if (cls) e.className = cls; e.textContent = text; return e; }
  function layerCount(layer) { return layer.key === 'deco' ? '' : counts[layer.key]; }   // 그림 개수는 의미 없어서 안 보임
  function tooFar(layer) { return !filter.isOff(layer.key) && map.getZoom() < layer.minZoom; }

  function layerChip(layer) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.innerHTML = dotHtml(layer);
    chip.appendChild(span('', layer.label));
    chip.appendChild(span('count', layerCount(layer)));
    chip.addEventListener('click', function () { map.closePopup(); filter.toggle(layer.key); sync(); });
    painters.push(function () {
      if (!chip.isConnected) return false;
      chip.setAttribute('aria-pressed', filter.isOff(layer.key) ? 'false' : 'true');
      chip.classList.toggle('is-far', tooFar(layer));
      chip.title = tooFar(layer) ? '지도를 더 확대하면 보여요' : '';
      return true;
    });
    return chip;
  }
  function renderSub() {
    subEl.innerHTML = '';
    var g = groups.filter(function (x) { return x.id === openGroup; })[0];
    subEl.hidden = !g;
    if (!g) return;
    var all = document.createElement('button');
    all.type = 'button';
    all.className = 'chip is-all';
    all.addEventListener('click', function () {
      var anyOn = g.layers.some(function (l) { return !filter.isOff(l.key); });
      g.layers.forEach(function (l) { filter.set(l.key, !anyOn); });
      sync();
    });
    painters.push(function () {
      if (!all.isConnected) return false;
      all.textContent = g.layers.some(function (l) { return !filter.isOff(l.key); }) ? '모두 끄기' : '모두 켜기';
      return true;
    });
    subEl.appendChild(all);
    g.layers.forEach(function (l) { subEl.appendChild(layerChip(l)); });
  }
  groups.forEach(function (g) {
    if (g.layers.length === 1) { chipsEl.appendChild(layerChip(g.layers[0])); return; }
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.innerHTML = dotHtml(g.layers[0]);
    chip.appendChild(span('', g.label));
    var count = span('count', '');
    chip.appendChild(count);
    chip.appendChild(span('caret', '▼'));
    chip.addEventListener('click', function () {
      map.closePopup();
      openGroup = openGroup === g.id ? null : g.id;
      renderSub();
      refreshChips();
    });
    painters.push(function () {
      var on = g.layers.filter(function (l) { return !filter.isOff(l.key); }).length;
      chip.setAttribute('aria-pressed', on ? 'true' : 'false');
      chip.setAttribute('aria-expanded', openGroup === g.id ? 'true' : 'false');
      count.textContent = on === g.layers.length ? '' : on + '/' + g.layers.length;   // 일부만 켜져 있을 때만 알린다
      return true;
    });
    chipsEl.appendChild(chip);
  });
  function refreshChips() {

  // ── 급할 때(2026-11-15 가르시아: 화장실·병원은 중요하지만 빈도가 낮다) ──
  // 화장실·동물병원은 지도에 평소 꺼 두고(지도 묶음 '처음엔 꺼 둠'), 이 버튼으로 가까운 곳을 찾는다.

  var SOS_CATS = [{ key: 'vet', label: '동물병원', max: 3 }, { key: 'toilet', label: '화장실', max: 3 }];
  var sosPins = InfraPins.all().filter(function (p) { return p.cat === 'vet' || p.cat === 'toilet'; });
  var sosLink = document.getElementById('sos-link');

  var sosLocating = false;

  // ── 근처에서만 · 이 지역 탐색(11/24 전국판 — 가르시아 "추천대로" + "다른 구역을 지도만 옮겨서 구경할 수도 있잖아? 그 지역 탐색") ──
  // 동반 가게·급할 때·지킴이 목록은 기준점에서 NEAR_M 안의 것만 — 다른 동네 사람에게 다산동 가게·병원이 '가까운 곳'처럼 뜨지 않게.
  // 기준점 = [이 지역 탐색]을 누른 지도 가운데(그동안) 또는 내 위치(읽었으면). 둘 다 없으면 동반 가게·지킴이 버튼은 숨고,
  // 급할 때는 누르면 위치부터 읽는다. 기준점 근처에 등록된 곳이 없으면 빈 동네 안내(급할 때는 카카오맵에서 동물병원 찾기).
  // 지킴이 예시 화면(사장님께 보여 드리는 것)은 예전처럼 다. 지도 가운데·내 위치는 이 화면 메모리에만 — 저장하거나 보내지 않는다.
  var NEAR_M = 5000, EXPLORE_ZOOM = 13;
  var explore = null;   // { lat, lng } — [이 지역 탐색]을 누른 지도 가운데
  var exploreBtn = document.getElementById('explore-btn'), areaNote = document.getElementById('area-note');
  var SEARCH_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
  function basis() {

  // 탐색 중에 그 지역을 보고 있으면 '이 지역 둘러보는 중 · 끝내기', 다른 곳으로 옮기면 '이 지역 다시 탐색'

    exploreBtn.appendChild(document.createTextNode(on ? '이 지역 둘러보는 중 · 끝내기' : explore ? '이 지역 다시 탐색' : '이 지역 탐색'));

  // 목록 시트 '급할 때' — 고르면 위치부터 읽는다(가까운 곳을 찾으려고 누른 것이라. 처음이면 이유를 먼저 묻는다)
  function sosLocate() {

  function renderSosMode() {

    // 근처에 병원·화장실 정보가 없으면(다른 동네·위치를 아직 모름) 먼 다산동 병원 대신 카카오맵에서 찾기(11/24 전국판).

      [['카카오맵에서 가까운 동물병원 찾기', '동물병원'], ['카카오맵에서 24시 동물병원 찾기', '24시 동물병원']].forEach(function (q) {

        .map(function (p) { return { pin: p, d: distFromBasis(p) }; });

      rows.slice(0, c.max).forEach(function (r) {

        var item = mk('div', 'shop-item');
        item.setAttribute('role', 'button');
        item.tabIndex = 0;
        var thumb = mk('span', 'shop-thumb');

        ic.innerHTML = InfraPins.iconSvg(pin.cat, 22); thumb.appendChild(ic);

    });

  }
  // 꺼 둔 종류(화장실·병원)여도 이 핀 하나만 잠깐 보여 주고, 팝업을 닫으면 다시 숨긴다
  function goToPin(id) {

  }

  // ── 목록 시트(2026-11-18, 지도 목록 A안 1단계 — hq notes/petwalk-map-list-view-plan.md, 시안 map-sheet-proto.html) ──
  // 볼 것: 지금 화면 · 급할 때 · 동반 가게 · 수호견(있을 때만). QR 찍기는 목록이 아니라 바로 하는 버튼(위 qrLink).

  // 시트를 올려도 범위는 접혔을 때 그대로라 요약 줄의 개수와 목록의 개수가 같다.
  // 거리는 내 위치를 알면 내 위치에서(걸어서 몇 분), 모르면 그 범위의 가운데에서 잰다(이때는 순서에만 쓰고 몇 분은 안 보인다).

  var sheetEl = document.getElementById('list-sheet');

  var MODE_BTN = { view: document.getElementById('view-link'), mission: missionLink, sos: sosLink, shop: shopLink, guard: document.getElementById('guard-link') };
  var SHORT = { stamp: RewardRules.STAMPS_ON ? '발도장' : '다녀간 곳', park: '공원', bag: '봉투함', guard: '지킴이', cheer: '응원 가게' };   // 요약 줄에 쓰는 짧은 이름

  // 높이: 숨김 = 손잡이 한 줄(지도만 보기, 11/23), 접힘 = 손잡이 + 머리(요약 줄·볼 것 — 미션 카드는 11/18부터 [미션] 목록 안),
  //       반 = 지도 높이의 55%, 펼침 = 위 칩 한 줄만 남기고
  var HIDE_H = 28;

  function naturalPeek() { return lsGrab.offsetHeight + lsHead.offsetHeight; }
  function heights() {

  }
  function fitSheet() {
    if (sheetState === 'peek') peekH = naturalPeek();   // 접혔을 때만 잰다(펼치면 미션 카드가 숨어서 머리가 낮아짐)

  function relayoutSheet() {

  lsClose.addEventListener('click', function () { setSheet('peek'); });

  // 끌어서 바꾸기 — 손잡이·요약 줄에서. 조금만 움직였으면 누름(click이 처리), 놓으면 가까운 단계로
  (function dragSheet() {
    var startY = 0, startH = 0, active = false, moved = false, lastDragEnd = 0;
    function down(e) {
      if (e.button) return;   // 마우스 오른쪽 등
      active = true; moved = false; startY = e.clientY; startH = sheetEl.getBoundingClientRect().height;
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* 못 잡아도 손잡이 위에서는 끌린다 */ }
    }
    function move(e) {
      if (!active) return;
      var dy = startY - e.clientY;
      if (!moved) {
        if (Math.abs(dy) < 6) return;
        moved = true;
        sheetEl.classList.add('is-dragging');
      }
      var h = heights();
      sheetEl.style.height = Math.max(h.hide, Math.min(h.full, startH + dy)) + 'px';
    }
    function up() {
      if (!active) return;
      active = false;
      if (!moved) return;
      sheetEl.classList.remove('is-dragging');
      lastDragEnd = Date.now();
      var h = heights(), cur = sheetEl.getBoundingClientRect().height, best = 'peek', bd = Infinity;
      ['hide', 'peek', 'half', 'full'].forEach(function (s) { var d = Math.abs(h[s] - cur); if (d < bd) { bd = d; best = s; } });
      if ((sheetState === 'peek' || sheetState === 'hide') && (best === 'half' || best === 'full')) sheetMode = 'view';
      setSheet(best);   // 같은 단계로 돌아와도 높이를 제자리로(fitSheet)
    }
    [lsGrab, lsSummary].forEach(function (el) {
      el.addEventListener('pointerdown', down);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('click', function () {
        if (Date.now() - lastDragEnd < 400) return;   // 끌고 놓은 바로 뒤의 click은 무시
        cycleSheet();
      });
    });
    lsGrab.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycleSheet(); } });
  })();

  // ── 시트 안 그리기 ──
  function viewBox() {   // 접힌 시트 위로 보이는 지도(Leaflet 화면 좌표)
    var s = map.getSize();
    return { w: s.x, h: Math.max(40, s.y - (peekH || 0)) };
  }
  function viewEntries() {
    var b = viewBox(), out = [];
    viewItems.forEach(function (e) {
      if (!map.hasLayer(e.marker)) return;   // 꺼 둔 레이어·아직 넓게 봐서 안 뜬 핀은 빼고
      var p = map.latLngToContainerPoint(e.marker.getLatLng());
      if (p.x >= 0 && p.x <= b.w && p.y >= 0 && p.y <= b.h) out.push(e);
    });
    return out;
  }
  function originLatLng() {
    if (myPos) return [myPos.lat, myPos.lng];
    var b = viewBox(), c = map.containerPointToLatLng([b.w / 2, b.h / 2]);
    return [c.lat, c.lng];
  }
  function paintPeekSummary(sum, list) {
    if (!list.length) { sum.appendChild(mk('b', '', '이 화면엔 켠 곳이 없어요')); return; }
    sum.appendChild(mk('b', '', '이 화면 ' + list.length + '곳'));
    var cnt = {};
    list.forEach(function (e) { cnt[e.key] = (cnt[e.key] || 0) + 1; });
    // 순서는 지도 묶음의 우선순위(스팟 편집) — 칩과 같은 순서
    var keys = Object.keys(cnt).sort(function (a, b) { return (lay.byKey[a] ? lay.byKey[a].rank : 99) - (lay.byKey[b] ? lay.byKey[b].rank : 99); });
    keys.slice(0, 3).forEach(function (k) {
      var l = lay.byKey[k] || { label: k, color: '#7a6a58' };
      var c = mk('span', 'cnt');
      var dot = mk('i');
      dot.style.background = l.color;
      c.appendChild(dot);
      c.appendChild(document.createTextNode((SHORT[k] || l.label) + ' ' + cnt[k]));
      sum.appendChild(c);
    });
    if (keys.length > 3) sum.appendChild(mk('span', 'cnt', '외 ' + (keys.length - 3) + '종류'));
  }
  function renderSheet() {
    if (!sheetReady) return;
    Object.keys(MODE_BTN).forEach(function (m) {
      MODE_BTN[m].setAttribute('aria-pressed', sheetOpen() && sheetMode === m ? 'true' : 'false');
    });
    lsSummary.innerHTML = '';
    var sum = mk('span', 'sum');
    lsSummary.appendChild(sum);
    lsSummary.appendChild(mk('span', 'more', !sheetOpen() ? '목록 ▲' : sheetState === 'half' ? '더 보기 ▲' : '접기 ▼'));
    if (!sheetOpen()) {   // 접힘(지도만 볼 땐 안 보이지만 같이 — 다시 올렸을 때 바로 맞게)
      paintPeekSummary(sum, viewEntries());
      return;
    }
    lsTools.innerHTML = '';
    lsList.innerHTML = '';
    var res = (sheetMode === 'sos' ? renderSosMode : sheetMode === 'shop' ? renderShopMode : sheetMode === 'guard' ? renderGuardMode :
      sheetMode === 'mission' ? renderMissionMode : renderViewMode)();
    sum.appendChild(mk('b', '', res.title));
    if (res.sub) sum.appendChild(mk('span', 'cnt', res.sub));
    lsNote.textContent = res.note || '';
  }
  // 지도를 옮기거나 칩을 바꾸면 요약 줄과 '지금 화면' 목록만 다시(다른 목록은 지도와 상관없음)
  function scheduleSheet() {
    if (!sheetReady) return;
    clearTimeout(sheetTimer);
    sheetTimer = setTimeout(function () { if (sheetState === 'hide') return; if (sheetState === 'peek' || sheetMode === 'view') renderSheet(); }, 80);
  }

  function iconBox(svg, color) {
    var ic = mk('span', 'ic');
    if (color) ic.style.background = color;
    ic.innerHTML = svg;
    return ic;
  }
  function photoBox(src) { var img = mk('img'); img.src = src; img.alt = ''; return img; }
  // '지금 화면' 한 줄: 아이콘 · 이름 · (내 위치를 알면) 걸어서 몇 분 · 상태 한 줄
  function entryRow(e, d) {
    var li = mk('li');
    var item = mk('button', 'shop-item is-row');
    item.type = 'button';
    var thumb = mk('span', 'shop-thumb');
    var name = '', meta = [], layerLabel = (lay.byKey[e.key] || {}).label || '';
    if (e.kind === 'shop') {
      var pin = e.pin, v = ShopVisits.info(pin.id);
      var photo = e.as === 'guard' ? (InfraPins.dogPhoto(pin) || InfraPins.shopPhoto(pin)) : (InfraPins.shopPhoto(pin) || InfraPins.dogPhoto(pin));
      if (photo) thumb.appendChild(photoBox(photo));
      else thumb.appendChild(e.as === 'cheer' ? iconBox(InfraPins.heartSvg(20), InfraPins.CHEER_COLOR) : iconBox(InfraPins.iconSvg('spot', 20), (lay.byKey[e.key] || {}).color));
      if (v.level) thumb.appendChild(mk('span', 'lv', 'Lv' + v.level));
      name = pin.name || layerLabel || '가게';
      meta.push(layerLabel || '가게');
      if (e.as === 'guard' && InfraPins.hasGuardian(pin)) meta.push('지킴이 ' + pin.guardian.name);
      else if (e.as === 'cheer') { var sp = InfraPins.supportInfo(pin); if (sp && sp.offer) meta.push(sp.offer); }
      else {
        var badges = InfraPins.petBadges(pin);
        meta.push(badges.length ? badges.slice(0, 2).map(function (b) { return b.text; }).join(' · ') : '동반 조건 확인 전');
      }
      if (v.count) meta.push('방문 도장 ' + v.count + '번');
    } else if (e.kind === 'infra') {
      var c = InfraPins.category(e.pin.cat) || { label: '', color: '#6b5d4e' };
      thumb.appendChild(iconBox(InfraPins.iconSvg(e.pin.cat, 20), c.color));
      name = e.pin.name || c.label;
      if (name !== c.label) meta.push(c.label);
      if (e.pin.cat === 'vet') {
        var vi = InfraPins.vetInfo(e.pin);
        meta.push(vi.hours ? '진료 ' + vi.hours : '진료 시간 확인 전');
        if (vi.night) meta.push('야간 진료');
      } else if (e.pin.note) meta.push(e.pin.note);
      if (!meta.length) meta.push(InfraPins.sourceText(e.pin));
    } else if (e.kind === 'stamp') {
      if (e.visit && !e.mission && myDog.photo) thumb.appendChild(photoBox(myDog.photo));
      else thumb.appendChild(iconBox(e.mission ? FLAG_SVG : STAMP_SVG, e.mission || e.visit ? 'var(--accent)' : '#a8998a'));
      name = e.mission ? '미션 ' + missionNow.no + ' · ' + e.place.name : e.place.name;
      meta.push(e.mission ? '지금 미션 · 길 기록 산책으로 지나가면 발도장' :
        e.visit ? withJosa(dogName) + ' ' + e.visit.count + '번 다녀갔어요' : '발도장 장소 · 아직이에요');
    } else {   // 내가 찍은 핀
      thumb.appendChild(iconBox(PIN_SVG, 'var(--accent)'));
      name = e.memo || '메모 없는 핀';
      meta.push('내가 찍은 핀 · 이 휴대폰에만 있어요');
    }
    var body = mk('span', 'body');
    var row1 = mk('span', 'row1');
    row1.appendChild(mk('span', 'name', name));
    if (d != null) row1.appendChild(mk('span', 'walk', ShopVisits.walkText(d)));
    body.appendChild(row1);
    body.appendChild(mk('span', 'meta', meta.join(' · ')));
    item.appendChild(thumb);
    item.appendChild(body);
    item.addEventListener('click', function () { goToEntry(e); });
    li.appendChild(item);
    return li;
  }
  function renderViewMode() {
    var o = originLatLng();
    var rows = viewEntries().map(function (e) {
      var ll = e.marker.getLatLng();
      return { e: e, d: ShopVisits.distanceM(o, [ll.lat, ll.lng]) };
    }).sort(function (a, b) { return a.d - b.d; });
    if (!myPos) addNearBtn();
    if (!rows.length) lsList.appendChild(mk('li', 'sheet-empty', '지금 화면엔 켠 곳이 없어요. 지도를 옮기거나 위 칩을 켜 보세요.'));
    rows.slice(0, VIEW_MAX).forEach(function (r) { lsList.appendChild(entryRow(r.e, myPos ? r.d : null)); });
    if (rows.length > VIEW_MAX) lsList.appendChild(mk('li', 'sheet-empty', '가까운 ' + VIEW_MAX + '곳까지만 보여요 · 지도를 확대하면 좁혀져요'));
    return {
      title: '지금 화면 ' + rows.length + '곳',
      sub: myPos ? '내 위치에서 가까운 순' : '화면 가운데에서 가까운 순',
      note: '지금 지도에 보이는 곳 중 위 칩으로 켠 것만이에요. 지도를 옮기면 목록도 바뀌어요.' + (myPos ? ' 걸어서 몇 분은 직선 거리로 어림한 값이에요.' : '')
    };
  }
  // 수호견: 얼굴이 주인공이라 2열 카드. 누르면 지도의 그 강아지 핀으로
  function renderGuardMode() {
    var grid = mk('li', 'ls-grid');

    nearG.forEach(function (pin) {

    };
  }
  // 미션 목록(11/18): 맨 위에 지금 미션 카드(걸어서 몇 분 · 지금 여기면 바로 산책 화면으로), 아래에 미션 전부를 순서대로.
  // 줄을 누르면 시트를 접고 그 장소의 깃발·동그라미로 가서 팝업. 아래 버튼은 길 기록 산책 시작(진행 중이면 산책 화면으로).
  var CHECK_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function renderMissionMode() {
    var cardOn = !missionCard.hidden;
    // 위치 오차가 100m를 넘으면(대략적인 위치·실내) 미션 장소에 가도 도착을 알 수 없다 — 맨 위에 켜는 법으로 가는 줄
    if (PHONE && myPos && myPos.accuracy > 100) {
      var warn = mk('li', 'ls-warn');
      warn.appendChild(mk('strong', '', myPos.accuracy >= 1000 ? '지금은 ‘대략적인 위치’예요(오차 약 ' + accText(myPos.accuracy) + ')' : '지금 위치가 흐릿해요(오차 약 ' + accText(myPos.accuracy) + ')'));
      warn.appendChild(mk('span', '', myPos.accuracy >= 1000 ? '이대로는 미션 장소에 가도 도착을 알 수 없어요. ' : '실내라면 밖에서 [내 위치]를 다시 눌러 보세요. '));

    missionAll.forEach(function (m) {

      note: '길 기록 산책 중에 미션 장소의 동그라미 안에 들어가면 발도장이 찍히고 화면 가운데로 알려 드려요. ' +
        '앱을 화면에 켜 둔 동안만 알 수 있어요. 휴대폰 위치가 "대략적인 위치"로 되어 있으면 도착을 알 수 없어요.'

  }
  function goToMission(m) {

  // '지금 화면'에서 누르면: 시트를 접고 그 핀으로 가서 팝업(가게는 goToShop — 둘 다인 가게는 지금 보이는 핀으로)

  // 지도를 누르거나 핀을 열면 접는다(목록이 지도를 가린 채로 두지 않게). Esc도.
  map.on('click', function () { if (sheetOpen()) setSheet('peek'); });
  map.on('popupopen', function () { if (sheetOpen()) setSheet('peek'); });
  // 다른 행동을 하면 지도 위에 떠 있던 것을 내린다(11/18 가르시아 "지도 위에 팝업되었던 정보들은 내가 다른 액션을 취하면 내려가게"):
  // 지도를 손으로 끌면 핀 팝업을 닫고 펼친 목록도 접는다. 확대·축소(버튼·두 손가락·[내 위치])도 팝업을 닫는다.

  map.on('dragstart', function () { map.closePopup(); if (sheetOpen()) setSheet('peek'); });

  map.on('moveend', paintExplore);  // 지도를 옮기면 [이 지역 탐색] 알약을 다시
  window.__town = { map: map, basis: basis };   // 시험용(지도 옮겨 보기·기준점 확인)
  // 처음 열 때 동네 가운데가 '시트 위로 보이는 지도'의 가운데 오게 — 시트가 지도 아래쪽을 덮어서(첫 미션 깃발이 시트에 가리지 않게).
  // 수호견 예시 화면은 예시가 다 보이게 따로 맞춰 두었고(fitBounds), 주소로 가게를 열면(?spot=) 아래에서 그 자리로 옮긴다.
  if (!InfraPins.GUARDIAN_DEMO) map.panBy([0, Math.round(peekH / 2)], { animate: false });
  if (window.ResizeObserver) {

    new ResizeObserver(function () { if (sheetState === 'peek' && !sheetEl.classList.contains('is-dragging')) fitSheet(); }).observe(lsHead);

    new ResizeObserver(function () { placeAttribution(sheetEl.getBoundingClientRect().height); }).observe(sheetEl);
  }

  // 수호지킴이 목록에서 "지도에서 보기"로 오면(town.html?spot=id) 그 스팟으로 가서 팝업을 연다
  var openId = (location.search.match(/[?&]spot=([^&]+)/) || [])[1];
  if (openId) openId = decodeURIComponent(openId);
  if (openId && (guardMarkers[openId] || shopMarkers[openId] || cheerMarkers[openId])) {
    filter.set(guardMarkers[openId] ? 'guard' : shopMarkers[openId] ? 'spot' : 'cheer', true);   // 지킴이 목록에서 왔으면 지킴이 가게를 켠다
    map.setView((guardMarkers[openId] || shopMarkers[openId] || cheerMarkers[openId]).getLatLng(), 17, { animate: false });
    sync();
    shopMarkerOf(openId).openPopup();
  }

  // ── 내 위치: 버튼을 눌렀을 때만, 이유를 먼저 설명하고 읽는다. 지도에 점만 찍고 저장하지 않는다. ──
  // 위치 버튼과 "가게까지 걸어서 몇 분"이 같이 쓴다. 읽은 위치는 이 화면 메모리(myPos)에만 둔다.
  // 정밀 위치가 늦으면 대략적인 위치로 다시 찾는다(geo.js). 찾는 동안 위치 버튼을 돌리고, 겹쳐 찾지 않게 한다.
  var myDot = null, myAcc = null, locating = null;
  var locateBtn = document.getElementById('locate-btn');
  function locate(quiet) {
    if (locating) return locating;   // 찾는 중이면 그 결과를 같이 기다린다
    var explained = false;
    try { explained = localStorage.getItem(LOCATION_EXPLAINED_KEY) === '1'; } catch (e) { /* 다시 설명 */ }
    if (!explained) {
      if (quiet) return Promise.reject();
      if (!confirm('내 위치를 지도에 점으로 보여 주고 가게까지 걸어서 몇 분인지 계산하려면 위치 정보 접근 권한이 필요합니다. 위치는 이 화면에서만 쓰고 저장하거나 보내지 않아요.' + (/Android/i.test(navigator.userAgent || '') ? '\n\n다음 창에서 ‘정확한 위치’가 골라진 채로 허용해 주세요. 미션 발도장에 필요해요.' : '') + '\n\n허용할까요?')) return Promise.reject();
      try { localStorage.setItem(LOCATION_EXPLAINED_KEY, '1'); } catch (e) { /* 다음에 다시 설명 */ }
    }
    locateBtn.classList.add('is-busy');
    locateBtn.setAttribute('aria-busy', 'true');
    locating = new Promise(function (resolve, reject) {
      WalsonGeo.locate(function (pos) {
        myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy || 0 };
        var coord = [myPos.lat, myPos.lng];
        if (myDot) myDot.setLatLng(coord);
        else myDot = L.marker(coord, { icon: L.divIcon({ className: '', html: '<div class="my-dot"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }), interactive: false, zIndexOffset: 5000 }).addTo(map);
        // 대략적인 위치(오차 100m 넘음)면 오차 범위를 옅은 원으로 같이 보여 준다
        if (myAcc) { map.removeLayer(myAcc); myAcc = null; }
        if (myPos.accuracy > 100) myAcc = L.circle(coord, { radius: Math.min(myPos.accuracy, 3000), color: '#3b7dc4', weight: 1, fillOpacity: 0.08, interactive: false }).addTo(map);
        // PC·실내는 GPS가 없어 와이파이·인터넷 주소로 어림잡는다 — 수백 m~몇 km 틀릴 수 있어서 알려 준다
        var accNote = document.getElementById('acc-note');
        if (myPos.accuracy > 100) {
          var a = accText(myPos.accuracy);
          accNote.innerHTML = '';
          // 휴대폰이면 정확한 위치 켜는 법으로(2026-11-18 가르시아 "정교한 위치 기능을 켜도록 가이드") — PC는 GPS가 없으니 예전 안내 그대로
          if (!PHONE) accNote.textContent = '위치가 대략적이에요(오차 약 ' + a + ') · PC·실내는 GPS가 없어요' + (missionAll.length ? '. 미션은 휴대폰으로 밖에서' : '');
          else if (myPos.accuracy >= 1000) { accNote.appendChild(document.createTextNode('‘대략적인 위치’로 잡혀요(오차 약 ' + a + ') · ')); accNote.appendChild(guideLink('정확한 위치 켜는 법')); }
          else { accNote.appendChild(document.createTextNode('위치가 흐릿해요(오차 약 ' + a + ') · 밖에서 [내 위치]를 다시 · ')); accNote.appendChild(guideLink('도움말')); }
          accNote.hidden = false;
        } else accNote.hidden = true;
        resolve(myPos);
      }, function (info) {
        if (!quiet) {
          if (info.code === 1 && PHONE) { if (confirm('위치 권한이 막혀 있어요.\n\n켜는 방법을 그림으로 볼까요?')) location.href = GUIDE_HREF; }
          else alert(info.message);
        }
        reject();
      });
    });
    var done = function () { locating = null; locateBtn.classList.remove('is-busy'); locateBtn.removeAttribute('aria-busy'); };
    locating.then(done, done);
    return locating;
  }
  function locateAndCenter(quiet) {
    explore = null;   // [내 위치]를 누르면 이 지역 탐색을 끝낸다
    locate(quiet).then(function (p) {
      map.setView([p.lat, p.lng], p.accuracy > 500 ? 15 : 17, { animate: true });
      refreshShops();
    }, function () {});
  }
  locateBtn.addEventListener('click', function () { map.closePopup(); locateAndCenter(false); });
  // 시연 모드: 출발점 핀을 끌어 옮긴다(demo-geo.js) — 옮기면 내 위치·미션 카드·걸어서 몇 분이 그 자리 기준으로
  if (window.PetwalkDemoGeo && PetwalkDemoGeo.on) PetwalkDemoGeo.attachStartMarker(map, { onMove: function () { locate(true).then(refreshShops, function () {}); } });
  // 탭을 열자마자 내 위치(2026-11-15 가르시아 "누르면 바로 체크가 안 된다") — 위치를 허용한 기기에서만.
  // 처음인 기기는 묻지 않고 기다린다(위치 버튼을 누를 때 이유부터 설명 — CLAUDE.md). 실패해도 조용히(버튼으로 다시).
  // 11/25 가르시아 "위치 정보 동의한 상태면 바로 현재 위치로 가서 들여다보는 게 맞지 않나?" → 지도도 내 위치로 옮긴다(동네가 보이는 확대 15 —
  // 골목 단위 17은 [내 위치] 버튼으로. 11/16엔 캡처 걱정으로 점만 찍었었다). 받는 사이 지도를 직접 움직였으면 옮기지 않는다.
  (function autoLocate() {
    var explained = false, moved = false;
    try { explained = localStorage.getItem(LOCATION_EXPLAINED_KEY) === '1'; } catch (e) { /* 안 함 */ }
    map.once('dragstart zoomstart', function () { moved = true; });
    var go = function () {
      locate(true).then(function (p) {
        if (!moved && !explore) map.setView([p.lat, p.lng], 15, { animate: false });
        refreshShops();
      }, function () {});
    };
    try {
      // 브라우저에서 이미 허용했으면(다른 화면에서 허용한 것도) 바로, 이유를 설명한 적 있으면 거절만 아니면
      navigator.permissions.query({ name: 'geolocation' }).then(function (p) {
        if (p.state === 'granted' || (explained && p.state !== 'denied')) go();
      }, function () { if (explained) go(); });
    } catch (e) { if (explained) go(); }
  })();
})();
</script>
