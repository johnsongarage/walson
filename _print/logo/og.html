<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>왈슨 카톡 미리보기 그림(1600×800)</title>
<!-- 카톡·SNS 링크 미리보기 그림 og/walson-og.png를 만드는 판(2026-11-18 로고를 짖는 얼굴로 바꾸며 다시 만듦).
     브라우저로 1600×800 크기로 열어 그대로 찍는다(README.md). 글은 site-config.js brand에서 불러 넣되(CLAUDE.md 텍스트 규칙),
     카톡 미리보기는 예외로 "APP" 없이 WALSON(2026-11-18 가르시아 "카톡 로고를 app 빼고"). 글씨 색은 강아지 테두리·귀와 같은 진갈색 #361e12
     (같은 날 "글씨를 강아지의 색깔 톤하고 맞춰줘"). 그림을 바꾸면 화면들의 og:image 주소 ?v= 번호를 올린다 — 카톡이 예전 그림을 오래 기억한다. -->
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1600px; height: 800px; overflow: hidden; background: #f2b733; color: #361e12; position: relative;
    font-family: 'Black Han Sans', sans-serif; }
  .txt { position: absolute; left: 118px; top: 0; }
  .en { position: absolute; top: 106px; font-size: 52px; letter-spacing: 0.24em; white-space: nowrap; }
  .ko { position: absolute; top: 186px; font-size: 236px; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
  .lead { position: absolute; top: 486px; font-size: 62px; line-height: 1.32; white-space: nowrap; }
  .rule { position: absolute; top: 678px; width: 70px; height: 6px; background: #361e12; }
  .tag { position: absolute; top: 704px; font-size: 38px; white-space: nowrap; }
  .face { position: absolute; left: 760px; top: 64px; width: 820px; height: auto; }
</style>
</head>
<body>
  <div class="txt">
    <div class="en" id="en"></div>
    <div class="ko">왈슨</div>
    <div class="lead">산책 다녀오면<br>영수증 한 장</div>
    <div class="rule"></div>
    <div class="tag" id="tag"></div>
  </div>
  <img class="face" src="walson-face.png" alt="">
<script src="../../site-config.js"></script>
<script>
  // 글은 site-config.js brand 한 곳에서(문구를 고칠 땐 거기만) — 카톡 미리보기만 "APP"을 뺀다(2026-11-18 가르시아)
  var B = (window.WALSON_CONFIG || {}).brand || null;
  document.getElementById('en').textContent = B ? B.name.replace(/^APP\s+/i, '') : '';
  document.getElementById('tag').textContent = B ? B.tagline : '';
</script>
</body>
</html>
