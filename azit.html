<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* [아지트] 탭 — 산책 아지트(2026-11-23 개방명록 2단계, 가르시아 "아지트는 탭 하나 더 두던가 해야 할 거야" → "2단계로 가자").
     시안 azit-sian-b.html(모서리 뷰 미니룸, 11/22~23)을 앱 화면으로 옮겼다:
     - 내 방 = 이 휴대폰 산책 기록으로 생긴 소품(azit-room.js — 첫 산책 뼈다귀, 산책 러버 등급 액자, 발도장 엽서, 가게 QR 방석, 꾸준함 트로피 …).
       포인트로 사는 상점 X. 소품은 끌어서 옮기고, 눌러서 넣고 빼고, 고른 것은 이 휴대폰에만(petwalk_azit).
     - 만난 친구 줄 = 진짜 도감(petwalk_dex). 단짝이 그 자리에서 띄운 화면 QR에 실려 온 방 모습(r)으로 그 친구 방에 마실 —
       방 모습이 없으면(발자국·예전에 넣은 단짝) 그 친구 강아지만 서 있는 빈 방 + 어떻게 열리는지 안내.
     - 킁킁 방명록 = 도감에 쌓인 만난 날 기록(받은 한마디·단짝 만남·발자국). 직접 쓰는 글 X(한마디는 고르기만 — 11/23).
       내 방 바닥에는 최근에 만난 친구 발자국이 그 친구 털색으로 찍힌다.
     - 시안에서 뺀 것: 강아지 도트 굵기 고르기(원본 하나로), 직접 쓰는 한마디 칸, 예시 친구 7명.
     같은 날 가르시아 "아지트를 정성들여 꾸민 버전을 샘플로 보여주는 것도 있어야 해" → "추천대로 만들어"(hq notes/petwalk-azit-showroom.md 1단계):
     - 왈슨 모델하우스 — 왈슨이 손으로 꾸민 예시 방(azit-room.js SHOWROOMS). 친구 줄 "내 방" 다음 칸, 구경만, 우리 개는 손님,
       아래 칸은 방명록 대신 "이 방에 있는 것 — 어떻게 생겨요?"(소품마다 조건과 나는 어떤지). #show로 바로 열림.
     - 소품을 누르면 어떻게 생기는지 잠깐(모델하우스·친구 방, 내 방은 끌지 않고 톡 누를 때).
     - 샘플 모드의 내 방은 왈슨이 꾸민 샘플 방(sampleState) — 샘플을 끄면 원래대로(sample-data.js가 petwalk_azit을 보관·되돌림).
     색은 모두 화면 색 변수(theme.js) — 방 그림·소품·벽지 견본만 그림 색. */
  @font-face { font-family: 'DungGeunMo'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff'); font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: var(--ink); background-color: var(--bg);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 0; }
  .px { font-family: 'DungGeunMo', 'Galmuri11', monospace; font-weight: normal; font-synthesis: none; }
  .wrap { max-width: 470px; margin: 0 auto; }

  /* 홈 틀 */
  .shell { background: var(--panel); border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--line); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .pbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 2px solid var(--line); box-shadow: 2px 2px 0 var(--line);
    padding: 6px 9px; background: var(--panel); font-size: 13px; }
  .pbar label { display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
  .pbar select { font: inherit; font-size: 13px; border: 2px solid var(--line); background: var(--accent-tint); color: var(--ink); padding: 3px 4px;
    flex: 0 1 150px; min-width: 0; max-width: 150px; }
  .pbar select:disabled { opacity: .5; }
  .count { flex: none; background: var(--accent-tint); border: 2px solid var(--line); padding: 3px 7px; white-space: nowrap; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .head-txt { min-width: 0; }
  .title { font-size: 19px; color: var(--accent); margin: 0; line-height: 1.25; word-break: keep-all; }
  .sub { font-size: 12px; color: var(--ink-soft); margin-top: 3px; word-break: keep-all; }
  .pbtn { font: inherit; font-family: 'DungGeunMo', 'Galmuri11', monospace; font-weight: normal; font-synthesis: none; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-align: center;
    border: 3px solid var(--line); box-shadow: 2px 2px 0 var(--line); padding: 7px 10px; background: var(--panel); color: var(--ink); white-space: nowrap; }
  .pbtn.main { background: var(--hl); color: var(--hl-ink); }
  .pbtn:active { transform: translate(2px, 2px); box-shadow: none; }
  .pbtn[hidden] { display: none; }

  /* 만난 친구 줄 */
  .friends { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin: -4px -2px 0; }
  .friends::-webkit-scrollbar { display: none; }
  .fr { flex: none; width: 60px; font: inherit; font-size: 11px; color: var(--ink); background: var(--panel); border: 2px solid var(--line); box-shadow: 2px 2px 0 var(--line);
    padding: 4px 2px 3px; text-align: center; cursor: pointer; line-height: 1.2; position: relative; }
  .fr .pic, .dogpick .pic { height: 38px; display: flex; align-items: flex-end; justify-content: center; }
  .fr img, .dogpick img { height: 100%; width: auto; display: block; }
  .fr .nm { display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fr .tg { display: block; font-size: 9px; color: var(--ink-soft); margin-top: 1px; }
  .fr.foot { border-style: dashed; box-shadow: none; }
  .fr.foot img { opacity: .75; }
  .fr[aria-pressed="true"] { background: var(--accent-tint); box-shadow: inset 0 0 0 2px var(--hl), 2px 2px 0 var(--line); }
  .fr.me .nm { color: var(--accent); }
  /* 왈슨 모델하우스 칸 — 친구 칸과 헷갈리지 않게 바탕색 + "예시" */
  .fr.show { width: 72px; background: var(--accent-tint); }
  .fr.show .tg { color: var(--accent); }
  .fr-hint { font-size: 12px; color: var(--ink-soft); margin: -6px 0 0; line-height: 1.5; word-break: keep-all; }

  /* 방 */
  .stage { position: relative; border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--line); overflow: hidden;
    background-color: var(--accent-tint);
    background-image: radial-gradient(rgba(var(--shadow-rgb), .07) 1px, transparent 1.5px); background-size: 12px 12px;
    display: flex; justify-content: center; padding: 10px 0 6px; user-select: none; -webkit-user-select: none; }
  .stage::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 8px;
    background: radial-gradient(circle at 8px -2px, var(--panel) 7px, transparent 7.5px) 0 0 / 16px 8px repeat-x; }   /* 위 구름 띠 */
  .roomwrap { position: relative; line-height: 0; }
  /* 휴대폰에서 방 위를 위아래로 밀면 화면이 내려간다(pan-y, 11/23 가르시아 "고쳐줘" — 시안은 none이라 방 위에선 안 내려갔음).
     내 방 소품 위를 누를 때만 아래 스크립트(touchstart)가 막아서 끌기가 된다 */
  #room { display: block; image-rendering: pixelated; touch-action: pan-y; cursor: pointer; }
  .sign { position: absolute; left: 8px; top: 14px; max-width: 46%; background: var(--panel); color: var(--ink); border: 2px solid var(--line);
    padding: 3px 6px; font-size: 11px; line-height: 1.3; z-index: 2; word-break: keep-all; }
  .bubble { position: absolute; transform: translate(-50%, -100%); background: var(--panel); color: var(--ink); border: 2px solid var(--line); box-shadow: 2px 2px 0 var(--line);
    padding: 3px 7px; font-size: 11px; line-height: 1.3; width: max-content; max-width: 78%; text-align: center; word-break: keep-all;
    pointer-events: none; z-index: 3; display: flex; align-items: center; gap: 4px; }
  .bubble[hidden] { display: none; }
  .bubble .stamp, .gb-list .stamp { display: inline-block; width: 12px; height: 12px; flex: none; color: var(--accent); }
  .bubble .stamp svg, .gb-list .stamp svg { display: block; width: 100%; height: 100%; }
  /* 소품 안내(누르면 잠깐) — 말풍선과 구별되게 글자색·바탕색을 뒤집어서 */
  .tip { position: absolute; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); padding: 4px 8px; border-radius: 6px;
    font-size: 11.5px; line-height: 1.4; width: max-content; max-width: 86%; text-align: center; word-break: keep-all; z-index: 4; pointer-events: none;
    box-shadow: 0 3px 10px rgba(var(--shadow-rgb), .25); }
  .tip[hidden] { display: none; }
  .closed { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--panel); color: var(--ink); border: 2px dashed var(--line);
    padding: 6px 8px; font-size: 12px; line-height: 1.45; z-index: 2; word-break: keep-all; text-align: center; }
  .closed[hidden] { display: none; }
  .hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin: -4px 0 0; }

  /* 내 방 꾸미기 */
  .box { border: 3px solid var(--line); padding: 10px; background: var(--panel); color: var(--ink); }
  .box[hidden] { display: none; }
  .box-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; font-size: 13px; margin: 12px 0 8px; }
  .box-title:first-child { margin-top: 0; }
  .box-title span { flex: none; }
  .box-title small { flex: 1 1 150px; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; color: var(--ink-soft); text-align: right; word-break: keep-all; }
  .dogs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .dogpick { font: inherit; font-size: 11px; color: var(--ink); background: var(--bg); border: 2px solid var(--line); padding: 5px 3px 4px; text-align: center; cursor: pointer; line-height: 1.3; }
  .dogpick[aria-pressed="true"] { background: var(--accent-tint); box-shadow: inset 0 0 0 2px var(--hl); }
  .tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slot { font: inherit; font-size: 11px; color: var(--ink); background: var(--bg); border: 2px solid var(--line); padding: 6px 3px 5px; text-align: center; cursor: pointer; line-height: 1.3; }
  .slot canvas { display: block; margin: 0 auto 3px; image-rendering: pixelated; height: 30px; width: auto; }
  .slot[aria-pressed="true"] { background: var(--accent-tint); box-shadow: inset 0 0 0 2px var(--hl); }
  .slot[disabled] { opacity: .5; cursor: not-allowed; }
  .slot .why { display: block; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 10px; color: var(--ink-soft); }
  .accs, .walls { display: flex; gap: 6px; flex-wrap: wrap; }
  .accs .slot { flex: 1; min-width: 64px; }
  .walls .slot { flex: 1; min-width: 70px; padding: 8px 3px; }

  /* 킁킁 방명록 */
  .gb-title { font-size: 14px; color: var(--accent); margin-bottom: 8px; }
  .gb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .gb-list li { margin: 0; }
  .gb-row { width: 100%; display: flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; color: var(--ink); text-align: left;
    background: var(--bg); padding: 6px 8px; border: 0; border-left: 3px solid var(--hl); cursor: pointer; }
  .gb-row.foot { border-left-style: dashed; border-left-color: var(--ink-soft); }
  .gb-row .day { flex: none; font-size: 11px; color: var(--ink-soft); min-width: 46px; }
  .gb-row .who { flex: none; font-family: 'DungGeunMo', 'Galmuri11', monospace; font-synthesis: none; color: var(--accent); }
  .gb-row .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gb-row .soft { color: var(--ink-soft); }
  /* 모델하우스 "이 방에 있는 것" 줄 */
  .gb-row.show-row { cursor: default; border-left-style: dotted; border-left-color: var(--ink-soft); }
  .gb-row.show-row.have { border-left-style: solid; border-left-color: var(--hl); }
  .gb-row .spr { flex: none; height: 18px; width: auto; image-rendering: pixelated; }
  .gb-row.show-row .what { white-space: normal; word-break: keep-all; }
  .gb-row .mine { flex: none; margin-left: auto; padding-left: 6px; font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .gb-row.have .mine { color: var(--accent); font-weight: 700; }
  .gb-empty { font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin: 0; word-break: keep-all; }
  .gb-empty[hidden] { display: none; }
  .more { display: block; margin: 8px auto 0; font: inherit; font-size: 12px; color: var(--ink); background: none; border: 0; text-decoration: underline; cursor: pointer; }
  .more[hidden] { display: none; }

  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acts .pbtn { white-space: normal; line-height: 1.3; padding: 9px 6px; }
  .foot-note { font-size: 11.5px; color: var(--ink-soft); line-height: 1.55; margin: 0; word-break: keep-all; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h, 58px) + 18px); transform: translateX(-50%); z-index: 1200; max-width: calc(100vw - 32px);
    background: var(--ink); color: var(--bg); padding: 10px 14px; font-size: 13px; line-height: 1.45; border-radius: 10px; word-break: keep-all; text-align: center;
    box-shadow: 0 6px 18px rgba(var(--shadow-rgb), .25); }
</style>
<script src="store.js?v=2"></script>

<body>
<main class="wrap">
  <div class="shell">
    <div class="pbar px">
      <label>오늘 기분 <select id="mood" class="px" aria-label="오늘 기분"></select></label>
      <span class="count" id="count"></span>
    </div>

    <div class="head">
      <div class="head-txt"><div class="title px" id="title" role="heading" aria-level="1"></div><div class="sub" id="sub"></div></div>
      <button type="button" class="pbtn" id="visit" hidden>마실 가기 ▶</button>
    </div>
    <div class="friends px" id="friends" role="group" aria-label="내 아지트와 만난 친구"></div>
    <p class="fr-hint" id="fr-hint" hidden></p>

    <div class="stage" id="stage">
      <div class="sign px" id="sign"></div>
      <div class="roomwrap" id="roomwrap">
        <canvas id="room" width="184" height="150" role="img" aria-label="모서리에서 내려다본 도트 강아지 방"></canvas>
        <div class="bubble px" id="bubble" hidden></div>
        <div class="tip" id="tip" role="status" hidden></div>
      </div>
      <div class="closed" id="closed" hidden></div>
    </div>
    <p class="hint" id="hint"></p>

    <div class="box px" id="mine-box">
      <div class="box-title"><span>우리 개 도트 강아지</span><small id="dog-note"></small></div>
      <div class="dogs" id="dogs"></div>
      <div class="box-title"><span>내 소품</span><small>산책으로 생긴 것 · 눌러서 넣고 빼기</small></div>
      <div class="tray" id="tray"></div>
      <div class="box-title"><span>머리 위 장식</span><small>등급·꾸준함으로 생겨요</small></div>
      <div class="accs" id="accs"></div>
      <div class="box-title"><span>벽지</span></div>
      <div class="walls" id="walls"></div>
    </div>

    <div class="box">
      <div class="gb-title px" id="gb-title">킁킁 방명록</div>
      <ul class="gb-list" id="gb-list"></ul>
      <button type="button" class="more" id="gb-more" hidden>더 보기</button>
      <p class="gb-empty" id="gb-empty" hidden></p>
    </div>

    <div class="acts" id="acts"></div>
    <p class="foot-note">아지트는 이 휴대폰에만 있어요. 내 카드(화면 QR)를 그 자리에서 찍은 단짝 휴대폰에는 방 모습 —
      도트 강아지·벽지·놓은 소품·머리 장식·산책 등급만 가요. 놓은 자리·산책 횟수·장소는 가지 않아요.</p>
  </div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var AZ = window.WalsonAzit, DC = window.WalsonDexCard;
  var OUT = '#3a2b2e';   // 방 소품·강아지 바깥 테두리(그림 색)
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function batchim(s) { s = String(s); var c = s.charCodeAt(s.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 > 0; }
  function ga(s) { return s + (batchim(s) ? '이' : '가'); }
  function dayLabel(k) { return k ? Number(k.slice(5, 7)) + '월 ' + Number(k.slice(8, 10)) + '일' : ''; }
  function toast(msg) {
    var t = el('div', 'toast', msg); t.setAttribute('role', 'status');
    document.body.appendChild(t); setTimeout(function () { t.parentNode && t.parentNode.removeChild(t); }, 3200);
  }
  function msgText(m) { return DC.MSGS[m] ? DC.MSGS[m].t : ''; }
  function stampEl(m) { var s = el('span', 'stamp'); s.innerHTML = DC.stampSvg(DC.MSGS[m] ? DC.MSGS[m].s : 'paw'); return s; }   // 우리 코드가 만든 그림만

  // ── 모서리 방 모양(시안 B안 그대로) ── 바닥 8×8칸(마름모), 한 칸 = 가로 20 · 세로 10 도트. 벽 높이 56.
  var CW = 184, CH = 150, N = 8, HW = 56, OX = 92, OY = HW + 8, SLAB = 4;
  function P(i, j) { return { x: OX + (i - j) * 10, y: OY + (i + j) * 5 }; }            // 바닥 칸 → 그림 위치
  function unP(x, y) { var a = (x - OX) / 10, b = (y - OY) / 5; return { i: (a + b) / 2, j: (b - a) / 2 }; }
  // 벽 위 한 점: 오른쪽 벽(side 'R')은 i축, 왼쪽 벽('L')은 j축을 따라 u칸, 바닥에서 h도트 위
  function W(side, u, h) { var p = side === 'R' ? P(u, 0) : P(0, u); return { x: p.x, y: p.y - h }; }

    t.hidden = false;
    var tw = t.offsetWidth, th = t.offsetHeight, rw = CW * K, cx = (s.x + s.w / 2) * K;
    t.style.left = Math.max(tw / 2 + 2, Math.min(rw - tw / 2 - 2, cx)) + 'px';
    t.style.top = Math.max(th + 2, s.y * K - 4) + 'px';
    clearTimeout(tipTimer); tipTimer = setTimeout(function () { t.hidden = true; }, 3000);
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = at(e), s = itemAt(p); downAt = p; drag = null; tapItem = null;   // 지난 끌기가 덜 끝났어도 새로 시작
    if (s) {
      drag = { id: s.id, moved: false, s: s };
      try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* 무시 */ }
      e.preventDefault(); kick();
      return;
    }
    if (view !== -1) { tapItem = spriteAt(p); if (tapItem) showTip(tapItem); }   // 모델하우스·친구 방: 소품을 누르면 안내(걷지 않음)
  });
  // 휴대폰: 소품 위에서 시작한 손가락만 화면이 따라 움직이지 않게(끌기). 바닥에서 위아래로 밀면 화면이 내려가고
  // 그때 브라우저가 보내는 pointercancel로 걷기도 취소된다. 그냥 톡 누르면 그 칸으로 걸어간다.
  canvas.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1 && itemAt(at(e.touches[0]))) e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = at(e), it = AZ.byId(AZ.ITEMS, drag.id);
    if (!it) return;
    if (it.wall) {
      var side = p.x >= OX ? 'R' : 'L', u = side === 'R' ? (p.x - OX) / 10 : (OX - p.x) / 10;
      u = Math.max(0.3, Math.min(N - 1, u));
      var floorY = OY + u * 5, h = Math.round(floorY - p.y + 6);
      state.pos[drag.id] = { wall: side, u: Math.round(u * 100) / 100, h: Math.max(26, Math.min(HW - 2, h)) };
      staticDirty = true;
    } else {
      var q = unP(p.x, p.y + 4);
      state.pos[drag.id] = { i: Math.round(Math.max(0.5, Math.min(N - 0.4, q.i)) * 100) / 100, j: Math.round(Math.max(0.5, Math.min(N - 0.4, q.j)) * 100) / 100 };
    }
    drag.moved = true; kick();
  });
  canvas.addEventListener('pointercancel', function () { if (drag && drag.moved) save(); drag = null; downAt = null; tapItem = null; });
  canvas.addEventListener('pointerup', function (e) {
    if (drag) { if (drag.moved) save(); else showTip(drag.s); drag = null; return; }   // 내 방 소품을 끌지 않고 톡 누르면 안내
    if (tapItem) { tapItem = null; downAt = null; return; }
    var p = at(e); if (!downAt) return; downAt = null;
    var q = unP(p.x, p.y);
    if (q.i < 0 || q.j < 0 || q.i > N || q.j > N) return;              // 바닥 밖(벽)을 누르면 그대로
    $('tip').hidden = true;
    var who = view === -1 ? host : guest;
    who.ti = Math.max(0.7, Math.min(N - 0.5, q.i)); who.tj = Math.max(0.7, Math.min(N - 0.5, q.j));
    kick();
  });

  // ── 움직임 ── 움직일 때만 매 화면, 쉬는 동안은 천천히(배터리) · 다른 앱에 가 있으면 멈춤
  var raf = 0, idle = 0, last = 0;
  function moving(d) { var di = d.ti - d.i, dj = d.tj - d.j; return di * di + dj * dj > 0.0025; }
  function step(ts) {
    raf = 0;
    var now = ts / 1000, dt = last ? Math.min(0.05, now - last) : 0; last = now;
    [host, guest].forEach(function (d) {
      var di = d.ti - d.i, dj = d.tj - d.j, dist = Math.sqrt(di * di + dj * dj);
      if (dist > 0.05) {
        var sp = Math.min(dist, 2.2 * dt);
        d.i += di / dist * sp; d.j += dj / dist * sp;
        d.flip = (di - dj) < 0;                     // 화면 왼쪽으로 가면 뒤집기
        d.frame = Math.floor(now * 6) % 2;
      } else d.frame = ((now + d.phase) % 4.2) < 0.2 ? 3 : 0;   // 쉴 땐 4초쯤마다 한 번 통통
    });
    render();
    schedule();
  }
  function schedule() {
    if (raf || idle || document.hidden) return;
    if (moving(host) || (view !== -1 && moving(guest)) || drag) raf = requestAnimationFrame(step);
    else idle = setTimeout(function () { idle = 0; last = 0; raf = requestAnimationFrame(step); }, 150);
  }
  function kick() { if (idle) { clearTimeout(idle); idle = 0; } if (!raf && !document.hidden) raf = requestAnimationFrame(step); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (raf) cancelAnimationFrame(raf); if (idle) clearTimeout(idle); raf = 0; idle = 0; last = 0; }
    else kick();
  });

  // ── 마실(방이 열린 친구 차례대로 → 다시 내 방) ──
  function goTo(v) {
    if (v >= friends.length || v < -1 - AZ.SHOWROOMS.length) v = -1;
    view = v; gbShown = 12;
    host.i = host.ti = 3.6; host.j = host.tj = 4.8; host.flip = false;
    guest.i = guest.ti = 6.2; guest.j = guest.tj = 4.2; guest.flip = true;
    refreshModel(); ui();
    var on = document.querySelector('#friends .fr[aria-pressed="true"]');   // 고른 친구가 줄 밖에 있으면 보이게
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  $('visit').addEventListener('click', function () { goTo(nextOpen()); });

  // ── 오늘 기분(이 휴대폰에만, 그날만) ──
  $('mood').appendChild(new Option('고르기', ''));
  AZ.MOODS.forEach(function (m) { $('mood').appendChild(new Option(m, m)); });
  $('mood').value = state.mood;
  $('mood').addEventListener('change', function () { state.mood = $('mood').value; state.moodDay = state.mood ? AZ.todayKey() : ''; save(); bubble(); });

  // ── 도감에서 "아지트 구경"으로 들어온 경우(#v=번호) · 모델하우스 바로 열기(#show — 공원 시연용) ──
  function fromHash() {
    if (/^#show\b/.test(location.hash)) { goTo(-2); return true; }
    var m = /[#&]v=([a-z0-9]{8})/.exec(location.hash);
    if (!m) return false;
    for (var n = 0; n < friends.length; n++) if (friends[n].i === m[1]) { goTo(n); return true; }
    return false;
  }
  window.addEventListener('hashchange', fromHash);

  // ── 처음 ── 새로 생긴 소품 알려 주기(처음 연 날은 그냥 보이기만)
  var gotNow = AZ.unlockedItems(prog).concat(AZ.ACCS.filter(function (a) { return AZ.met(a.need, prog); }).map(function (a) { return a.id; }));
  if (state.seen === null) { state.seen = gotNow; save(); }
  else {
    var fresh = gotNow.filter(function (id) { return state.seen.indexOf(id) < 0; });
    if (fresh.length) {
      state.seen = state.seen.concat(fresh); save();
      toast('새로 생겼어요: ' + fresh.map(function (id) { var x = AZ.byId(AZ.ITEMS, id) || AZ.byId(AZ.ACCS, id); return x ? x.name : ''; }).filter(Boolean).join(' · '));
    }
  }
  // 견종을 안 적었으면 프로필 사진 털색으로 한 번 더 골라 둔다(사용자가 고른 뒤엔 그대로)
  if (state.dogAuto && !AZ.dogFromBreed(profile.breed) && DC.myCard) {
    DC.myCard().then(function (card) {
      if (!card || !state.dogAuto) return;
      var d = AZ.guessDog(profile.size, card.c);
      if (d && d !== state.dog) { state.dog = d; save(); refreshModel(); ui(); }
    }).catch(function () { /* 그대로 */ });
  }
  save();

  window.addEventListener('resize', function () { fit(); measureBubble(); kick(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measureBubble(); kick(); });   // 도트 글꼴이 늦게 오면 폭이 바뀐다
  fit(); refreshModel();
  if (!fromHash()) ui();
  dogsReady.then(function () { dogCache = {}; kick(); });
  // 시험용 — 지금 보는 방·그리는 배율
  window.__azit = { goTo: goTo, state: function () { return { view: view, open: cur && cur.open, dog: cur && cur.dog, theme: cur && cur.theme, items: cur && cur.items.slice(), R: R, K: K, friends: friends.length, me: state.dog,
    to: [Math.round(host.ti * 100) / 100, Math.round(host.tj * 100) / 100] }; } };
})();
</script>
