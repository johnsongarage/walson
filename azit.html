<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산책 아지트</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="왈슨">
<meta name="theme-color" content="#fffdfd">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* [아지트] 탭 — 산책 아지트(2026-11-23 개방명록 2단계, 가르시아 "아지트는 탭 하나 더 두던가 해야 할 거야" → "2단계로 가자").
     시안 azit-sian-b.html(모서리 뷰 미니룸, 11/22~23)을 앱 화면으로 옮겼다:
     - 내 방 = 이 휴대폰 산책 기록으로 생긴 소품(azit-room.js — 첫 산책 뼈다귀, 산책 러버 등급 액자, 발도장 엽서, 가게 QR 방석, 꾸준함 트로피 …).
       포인트로 사는 상점 X. 소품은 끌어서 옮기고, 눌러서 넣고 빼고, 고른 것은 이 휴대폰에만(petwalk_azit).
     - 만난 친구 줄 = 진짜 도감(petwalk_dex). 단짝이 그 자리에서 띄운 화면 QR에 실려 온 방 모습(r)으로 그 친구 방에 마실 —
       방 모습이 없으면(발자국·예전에 넣은 단짝) 그 친구 강아지만 서 있는 빈 방 + 어떻게 열리는지 안내.
     - 킁킁 방명록 = 도감에 쌓인 만난 날 기록(받은 한마디·단짝 만남·발자국). 직접 쓰는 글 X(한마디는 고르기만 — 11/23).
       내 방 바닥에는 최근에 만난 친구 발자국이 그 친구 털색으로 찍힌다.
     - 시안에서 뺀 것: 강아지 도트 굵기 고르기(원본 하나로), 직접 쓰는 한마디 칸, 예시 친구 7명.
     같은 날 가르시아 "아지트를 정성들여 꾸민 버전을 샘플로 보여주는 것도 있어야 해" → "추천대로 만들어"(hq notes/petwalk-azit-showroom.md 1단계):
     - 왈슨 모델하우스 — 왈슨이 손으로 꾸민 예시 방(azit-room.js SHOWROOMS). 친구 줄 "내 방" 다음 칸, 구경만, 우리 개는 손님,
       아래 칸은 방명록 대신 "이 방에 있는 것 — 어떻게 생겨요?"(소품마다 조건과 나는 어떤지). #show로 바로 열림.
     - 소품을 누르면 어떻게 생기는지 잠깐(모델하우스·친구 방, 내 방은 끌지 않고 톡 누를 때).
     - 샘플 모드의 내 방은 왈슨이 꾸민 샘플 방(sampleState) — 샘플을 끄면 원래대로(sample-data.js가 petwalk_azit을 보관·되돌림).
     같은 날 "2단계로 가자"(notes/petwalk-azit-showroom.md 2단계):
     - 새 도트 소품 10개(러그·우리 개 사진 액자·장난감 바구니·강아지 집·오늘의 한 장 선반·응가 봉투 걸이·키링 걸이·스탠드 조명·피크닉 매트·가랜드) —
       모두 "한 것"으로 생김(azit-room.js ITEMS). 러그·매트는 바닥에 비스듬히 까는 것(맨 아래 층, 끌지 않음 — 바닥 누르기를 가로막지 않게).
       우리 개 사진 액자는 이 휴대폰 안에서 워킹패스 사진을 작게 그리기만(친구 방은 그 친구 도트 강아지 — 사진은 QR로 오지 않는다).
     - 모델하우스 세 채(핑크 앰배서더의 방·밤산책 라운지·공원 피크닉 방) — 아래 칸에서 골라 보고, [이 방처럼 놓기]로 내 방에 그 자리·벽지를(되돌리기 있음).
      11/23 밤 가르시아 "탭에 넣기"(시안 azit-sian-c.html — 받은 방·소품 그림 + 내 도트 강아지 8마리 그대로):
     - 방 = 분홍 빈 방 394×220점(받은 그림을 원래 점으로 되돌리고 붙박이 창을 지운 것), 벽지 셋은 그 색만 바꾼 라일락·밤 블랙 핑크(방 모습 글자 j·l·n 그대로).
       창은 지금 시각대로 낮·밤. 소품은 icons/azit-room(방 한 점 = 그림 한 점 — _dev/azit-sheet-slice.py → azit-fit.py → azit-extra.py
       → azit-letter.py: 11/24 글자 소품 글씨를 한글 도트 글꼴로 다시 씀).
     - 소품 22개·생기는 조건·순서(방 모습 QR)는 그대로, 그림만 새로: 받은 그림에 없는 당근 인형·스탠드·깃발·응가 봉투 걸이·키링 걸이·피크닉 매트·
       머리 장식은 같은 화풍으로 그림. 우리 개 사진 액자·단짝 액자는 받은 액자의 속 그림 칸에 사진·단짝 도트 강아지를 넣는다.
       트로피는 오른쪽 붙박이 선반 위(벽), 가랜드는 두 벽 모서리에 걸쳐(끌지 않음), 강아지 집은 소파로.
     - 같은 날 밤 받은 그림 세 장으로 새 소품 28개(말풍선·팻말·족자·네온·풍선·붕어빵 포장마차·생활용품 등) — 생기면 [내 소품]에 들어오고 눌러야 놓인다(stash).
       글자 있는 벽 그림은 왼쪽 벽용을 따로(뒤집으면 거울 글씨). 모델하우스 두 채 더(왈슨의 B급 방·집사 살림 방). 소품 칸은 생긴 것 먼저, 안 생긴 것은 접기.
     - 좌표가 바뀌어 예전에 옮겨 둔 자리는 새 처음 자리로(azit-room.js POS_V). 강아지 키 44점, 방 한 점 = 화면 점 정수 배(모자라면 왼쪽 계단 쪽을 잘라 보임).
     - 11/24 꽉 찬 방(가르시아 받은 그림 "이런 느낌의 배치 가능하겠냐? … 선반 위에도 화분 … 선반 사이에 액자" → "앱에 넣어 줘"):
       소품 19개 더(화분 셋·걸이 화분·액자 둘·깃발 배너·방석 넷·식기·물그릇·바구니·밧줄·공 넷 — 받은 그림 그대로, stash).
       붙박이 선반 셋에 작은 소품(화분·당근 인형·카페 컵·황금 똥 트로피·간식 통)을 올린다 — 끌어서 선반 가까이 놓으면 선반 위로(한 자리에 하나,
       azit-room.js SHELVES). 우리 개 사진 액자는 두 선반 사이, 엽서는 아래 선반 오른쪽 위로(선반에 화분 올릴 자리). 모델하우스 "꽉 찬 아지트".
    색은 모두 화면 색 변수(theme.js) — 방 그림·소품·벽지 견본만 그림 색. */
  /* 도트 글씨(11/24 가르시아 "아지트에 보이는 폰트체 개선이 될까?" → "추천대로"): 갈무리11 굵게(Galmuri 2.40.3, SIL OFL 1.1 — vendor/galmuri).
     12px에 맞춰 점을 찍은 글꼴이라 12px·24px(12의 배수)에서만 점이 화면에 딱 맞는다 — 다른 크기로 쓰지 말 것.
     예전 둥근모꼴은 16px 글꼴을 12~19px로 써서 점이 뭉개졌고(0.75~1.2배), 1.6MB를 바깥(jsdelivr)에서 받아 늦게 바뀌었다. 이건 167KB, 앱 안 */
  @font-face { font-family: 'Galmuri11'; font-weight: 700; src: url('vendor/galmuri/Galmuri11-Bold.woff2?v=2.40.3') format('woff2'); font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: var(--ink); background-color: var(--bg);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 0; }
  .px { font-family: 'Galmuri11', monospace; font-weight: 700; font-synthesis: none; }
  .wrap { max-width: 470px; margin: 0 auto; }

  /* 홈 틀 */
  .shell { background: var(--panel); border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--line); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  /* 산책 횟수 — 제목 아래 줄 끝에(11/23 밤, 예전 맨 위 줄에서) */
  .sub .count { white-space: nowrap; }
  .sub .count:not(:empty)::before { content: ' · '; }
  /* 오늘 기분 — 방 바로 아래(내 방에서만). 아이폰이 누를 때 화면을 키우지 않게 고르기 칸 글씨 16px */
  .mood-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: -4px 0 0; font-size: 13px; font-weight: 700; color: var(--ink); }
  .mood-row[hidden] { display: none; }
  .mood-row select { font-family: inherit; font-size: 16px; border: 2px solid var(--line); background: var(--accent-tint); color: var(--ink); padding: 4px 6px;
    min-width: 0; max-width: 62%; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .head-txt { min-width: 0; }
  .title { font-size: 24px; color: var(--accent); margin: 0; line-height: 1.25; word-break: keep-all; }   /* 도트 글씨 2배(12의 배수) */
  .sub { font-size: 12px; color: var(--ink-soft); margin-top: 3px; word-break: keep-all; }
  .pbtn { font: inherit; font-family: 'Galmuri11', monospace; font-weight: 700; font-synthesis: none; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-align: center;
    border: 3px solid var(--line); box-shadow: 2px 2px 0 var(--line); padding: 7px 10px; background: var(--panel); color: var(--ink); white-space: nowrap; }
  .pbtn.main { background: var(--hl); color: var(--hl-ink); }
  .pbtn:active { transform: translate(2px, 2px); box-shadow: none; }
  .pbtn[hidden] { display: none; }

  /* 만난 친구 줄 */
  .friends { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin: -4px -2px 0; }
  .friends::-webkit-scrollbar { display: none; }
  .fr { flex: none; width: 60px; font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 2px solid var(--line); box-shadow: 2px 2px 0 var(--line);
    padding: 4px 2px 3px; text-align: center; cursor: pointer; line-height: 1.2; position: relative; }
  .fr .pic, .dogpick .pic { height: 38px; display: flex; align-items: flex-end; justify-content: center; }
  .fr img, .dogpick img { height: 100%; width: auto; display: block; }
  .fr .nm { display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fr .tg { display: block; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; font-weight: 700; color: var(--ink-soft); margin-top: 1px; }
  .fr.foot { border-style: dashed; box-shadow: none; }
  .fr.foot img { opacity: .75; }
  .fr[aria-pressed="true"] { background: var(--accent-tint); box-shadow: inset 0 0 0 2px var(--hl), 2px 2px 0 var(--line); }
  .fr.me .nm { color: var(--accent); }
  /* 왈슨 모델하우스 칸 — 친구 칸과 헷갈리지 않게 바탕색 + "예시" */
  .fr.show { width: 72px; background: var(--accent-tint); }
  .fr.show .tg { color: var(--accent); }
  .fr-hint { font-size: 12px; color: var(--ink-soft); margin: -6px 0 0; line-height: 1.5; word-break: keep-all; }

  /* 방 */
  /* 방 칸은 홈 틀 안쪽 끝까지(양옆 여백 없이) — 방 한 점을 화면 점 2·3개로 딱 맞게 그리려고(11/23 새 방) */
  .stage { position: relative; margin: 0 -12px; border-top: 3px solid var(--line); border-bottom: 3px solid var(--line); overflow: hidden;
    background-color: var(--accent-tint);
    background-image: radial-gradient(rgba(var(--shadow-rgb), .07) 1px, transparent 1.5px); background-size: 12px 12px;
    display: flex; justify-content: center; padding: 10px 0 6px; user-select: none; -webkit-user-select: none; }
  .stage::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 8px;
    background: radial-gradient(circle at 8px -2px, var(--panel) 7px, transparent 7.5px) 0 0 / 16px 8px repeat-x; }   /* 위 구름 띠 */
  .roomwrap { position: relative; line-height: 0; }
  /* 휴대폰에서 방 위를 위아래로 밀면 화면이 내려간다(pan-y, 11/23 가르시아 "고쳐줘" — 시안은 none이라 방 위에선 안 내려갔음).
     내 방 소품 위를 누를 때만 아래 스크립트(touchstart)가 막아서 끌기가 된다 */
  #room { display: block; image-rendering: pixelated; touch-action: pan-y; cursor: pointer; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }   /* 꾹 누를 때 저장·복사 메뉴가 안 뜨게 */
  #room.grab { cursor: grabbing; }
  /* 방 이름표 — 오른쪽 위 천장 자리(11/24: 왼쪽 위였을 땐 선반 위 화분·두 선반 사이 사진 액자를 가려서). 오른쪽 벽 위 천장은 소품이 안 가는 곳 */
  .sign { position: absolute; right: 8px; top: 6px; max-width: 46%; background: var(--panel); color: var(--ink); border: 2px solid var(--line);
    padding: 3px 6px; font-size: 12px; line-height: 1.3; z-index: 2; word-break: keep-all; text-align: right; }
  /* 11/24 가르시아 "이름표 '방' 혼자 넘어가는 것도 고쳐 줘" — " · "로 나눈 조각(등급·예시 방·날짜)은 한 덩어리로 두고,
     한 줄에 안 들어가면 점 자리에서 줄을 바꾼다(점은 숨김 — setSign) */
  .sign .seg { white-space: nowrap; }
  .sign.wrap .sep { display: block; height: 0; overflow: hidden; }
  .bubble { position: absolute; transform: translate(-50%, -100%); background: var(--panel); color: var(--ink); border: 2px solid var(--line); box-shadow: 2px 2px 0 var(--line);
    padding: 3px 7px; font-size: 12px; line-height: 1.3; width: max-content; max-width: 78%; text-align: center; word-break: keep-all;
    pointer-events: none; z-index: 3; display: flex; align-items: center; gap: 4px; }
  .bubble[hidden] { display: none; }
  .bubble .stamp, .gb-list .stamp { display: inline-block; width: 12px; height: 12px; flex: none; color: var(--accent); }
  .bubble .stamp svg, .gb-list .stamp svg { display: block; width: 100%; height: 100%; }
  /* 소품 안내(누르면 잠깐) — 말풍선과 구별되게 글자색·바탕색을 뒤집어서 */
  .tip { position: absolute; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); padding: 4px 8px; border-radius: 6px;
    font-size: 12px; line-height: 1.4; width: max-content; max-width: 86%; text-align: center; word-break: keep-all; z-index: 4; pointer-events: none;
    box-shadow: 0 3px 10px rgba(var(--shadow-rgb), .25); }
  .tip[hidden] { display: none; }
  .tip .more { display: block; margin-top: 2px; opacity: .82; }   /* "한 번 더 누르면 우리 개가 가 봐요" */
  .bubble.react { border-color: var(--accent); box-shadow: 2px 2px 0 var(--accent); }   /* 소품과 놀 때 한마디(11/24) — 기분 말풍선과 구별 */
  .closed { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--panel); color: var(--ink); border: 2px dashed var(--line);
    padding: 6px 8px; font-size: 12px; line-height: 1.45; z-index: 2; word-break: keep-all; text-align: center; }
  .closed[hidden] { display: none; }
  .hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin: -4px 0 0; }
  /* 모델하우스 방 고르기 · 이 방처럼 놓기 */
  .show-bar { display: flex; flex-direction: column; gap: 8px; margin-top: -2px; }
  .show-bar[hidden] { display: none; }
  .rooms { display: flex; gap: 6px; flex-wrap: wrap; }
  .room-chip { flex: 1 1 28%; min-width: 0;   /* 여섯 채(11/24) — 한 줄에 셋 */ font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 2px solid var(--line);
    padding: 6px 4px; cursor: pointer; line-height: 1.25; word-break: keep-all;
    text-wrap: balance; }   /* 11/24 두 줄이면 고르게("3 공원 / 피크닉 방" — '방'만 혼자 넘어가지 않게, 지원 안 하는 옛 브라우저는 그대로) */
  .room-chip[aria-pressed="true"] { background: var(--accent-tint); box-shadow: inset 0 0 0 2px var(--hl); }
  .show-note { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin: 0; word-break: keep-all; text-align: center; }
  .undo-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 12px; color: var(--ink); background: var(--accent-tint); padding: 6px 8px; margin-bottom: 10px; }
  .undo-row[hidden] { display: none; }
  .undo-row .more { margin: 0; flex: none; }

  /* 내 방 꾸미기 — 한 줄로 접는다(11/23 밤) */
  .deco-sum { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 8px; cursor: pointer; list-style: none; font-size: 12px; color: var(--accent); }
  .deco-sum::-webkit-details-marker { display: none; }
  .deco-sum span::after { content: ' ▸'; color: var(--ink-soft); }
  .deco[open] .deco-sum span::after { content: ' ▾'; }

    <p class="hint" id="hint"></p>
    <!-- 오늘 기분(내 방에서만, 그날만) — 고르면 방 강아지 머리 위에 그 말만 뜬다(11/23 밤 가르시아 "'오늘 기분:' 이건 빼 줘").
         예전엔 화면 맨 위 줄이었는데 방에 뜨는 말이라 방 바로 아래로(가르시아 "고르는 게 먼저 나오는 게 맞는지") -->
    <div class="mood-row" id="mood-row">
      <label for="mood">오늘 기분</label>
      <select id="mood"></select>
    </div>

      <button type="button" class="more" id="gb-more" hidden>더 보기</button>
      <p class="gb-empty" id="gb-empty" hidden></p>
    </div>

    <div class="acts" id="acts"></div>

    <!-- 방 꾸미기(접기 — 연 상태는 이 휴대폰에 기억, 새 소품이 생기면 저절로 펼친다) -->
    <details class="box px deco" id="mine-box">

      <div id="dog-photo"></div>

      <p class="dog-msg" id="dog-msg" hidden></p>

      <details class="tray-more" id="tray-more" hidden><summary id="tray-more-sum"></summary><div class="tray" id="tray-locked"></div></details>
      <div class="box-title"><span>머리 위 장식</span><small>등급·꾸준함으로 생겨요</small></div>
      <div class="accs" id="accs"></div>
      <div class="box-title"><span>벽지</span></div>
      <div class="walls" id="walls"></div>
    </details>
    <p class="foot-note">아지트는 이 휴대폰에만 있어요. 내 카드(화면 QR)를 그 자리에서 찍은 단짝 휴대폰에는 방 모습 —
      도트 강아지·벽지·놓은 소품·머리 장식·산책 등급만 가요. 놓은 자리·산책 횟수·장소는 가지 않아요.
      워킹패스 사진으로 만든 우리 개는 이 휴대폰에서만 보이고, 단짝 휴대폰엔 닮은 도트 강아지로 가요.</p>
  </div>
